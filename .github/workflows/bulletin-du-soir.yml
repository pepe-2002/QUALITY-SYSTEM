# Le « tuyau » du bulletin du soir MoheliGo.
#
# Chaque soir à 19h25 (heure des Comores), GitHub refait le flyer avec la vraie
# prévision de mer du lendemain, et le dépose sur la branche `bulletin-du-jour`.
# Le patron ouvre toujours la même adresse et trouve le flyer du jour :
#
#   https://github.com/pepe-2002/QUALITY-SYSTEM/blob/bulletin-du-jour/flyer-soir-facebook.png
#   https://github.com/pepe-2002/QUALITY-SYSTEM/blob/bulletin-du-jour/texte-du-jour.txt
#
# La branche est réécrite à chaque fois (un seul commit, sans historique) :
# le dépôt ne grossit pas, alors qu'un PNG de 2,6 Mo commité chaque jour
# ajouterait près d'un gigaoctet par an.
#
# 🫀 CE ROBOT N'A PLUS DE RENDEZ-VOUS PROGRAMMÉ — et c'est voulu.
# 🚨 28/08/2026, la mesure qui a tranché : les deux `cron` du 27 au soir ont bien
# fini par être livrés… **à 00h37 et 01h06 le lendemain**, soit 8 h 43 et 8 h 25
# de retard. Le bulletin est donc parti à 3h38 du matin, heure des Comores, et le
# second n'a été arrêté que par `publier_fb.deja_publie()`.
# 📌 Un rendez-vous qui arrive huit heures plus tard n'est pas « en retard », il
# est NUISIBLE : il publie quand personne ne regarde, et il occupe la place du
# jour — celui de 19h25 se fait alors refuser comme doublon.
# ➡️ Le seul déclencheur est le BATTEMENT : une Routine hors de GitHub pousse une
# ligne dans `battement-soir.txt` à 19h25 (heure des Comores), et le `push` part
# en 2 secondes. Le bouton « Run workflow » reste là pour la main.

name: Bulletin du soir

on:
  push:
    branches: [main]
    paths: ['moheligo/pub/flyers/battement-soir.txt']

  workflow_dispatch:           # bouton « Run workflow » dans l'onglet Actions
    inputs:
      publier_sur_facebook:
        description: 'Publier vraiment sur la page Facebook ?'
        type: boolean
        default: false

# Sans ceci, Python met sa sortie en memoire tampon quand elle est redirigee :
# les messages d'erreur (stderr, non tamponne) apparaissent AVANT les lignes
# normales, et on cherche l'erreur au mauvais endroit du journal. Vecu.
env:
  PYTHONUNBUFFERED: '1'

permissions:
  contents: write              # pour publier sur la branche bulletin-du-jour

concurrency:
  group: bulletin-du-soir
  cancel-in-progress: false

jobs:
  fabriquer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright et Chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Aller chercher la mer de demain et fabriquer le flyer
        working-directory: moheligo/pub/flyers
        run: |
          python3 bulletin.py
          node render.js flyer8-soir-fb.html flyer-soir-facebook.png 1080 1350 2
          ls -la flyer-soir-facebook.png texte-du-jour.txt bulletin.json

      - name: Déposer le flyer du jour sur la branche bulletin-du-jour
        working-directory: moheligo/pub/flyers
        run: |
          set -e
          jour=$(python3 -c "import json;print(json.load(open('bulletin.json'))['date'])")
          etat=$(python3 -c "import json;print(json.load(open('bulletin.json'))['etat'])")
          mkdir -p /tmp/depot
          cp flyer-soir-facebook.png texte-du-jour.txt bulletin.json /tmp/depot/
          cat > /tmp/depot/README.md <<EOF
          # Bulletin du soir MoheliGo — $jour

          **$etat** demain matin sur le couloir Ouroveni – Hoani.

          - \`flyer-soir-facebook.png\` : le visuel à publier (2160 x 2700).
          - \`texte-du-jour.txt\` : le texte du post et le premier commentaire.
          - \`bulletin.json\` : les chiffres bruts.

          Refait ET publié automatiquement chaque soir, heure des Comores.
          Ne jamais republier le flyer de la veille : il annonce une date.
          EOF
          cd /tmp/depot
          git init -q -b bulletin-du-jour
          git config user.name  "MoheliGo Bulletin"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Bulletin du soir — $jour ($etat)"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            bulletin-du-jour

      # --- Publication automatique sur la page Facebook -------------------
      # DÉSARMÉE par défaut : rien n'est publié tant que la variable de dépôt
      # PUBLIER_FB ne vaut pas « oui ». Le bouton « Run workflow » permet en
      # plus une publication de contrôle, à la main, une seule fois.
      # Marche à suivre complète : moheligo/dossier/LIER-FACEBOOK.md
      - name: Est-ce que la liaison Facebook est configurée ?
        run: |
          if [ -z "${{ vars.FB_PAGE_ID }}" ]; then
            echo "::warning::FB_PAGE_ID absent — les etapes Facebook seront sautees et RIEN ne sera publie. Verifier le nom exact de la variable dans Settings > Secrets and variables > Actions."
          elif [ -z "${{ secrets.FB_PAGE_TOKEN }}" ]; then
            echo "::warning::FB_PAGE_TOKEN absent — la liaison echouera. Verifier le nom exact du secret."
          # ⚠️ 12/08/2026 : la variable vaut « Oui » avec une majuscule. Les
          # conditions « if: » de GitHub ignorent la casse, mais PAS bash — ce
          # voyant annoncait donc « DESARMEE » alors que tout partait. Un voyant
          # qui ment coute des heures de diagnostic : on normalise avant de
          # comparer, ici et partout ailleurs.
          elif [ "$(echo "${{ vars.PUBLIER_FB }}" | tr '[:upper:]' '[:lower:]')" != "oui" ]; then
            echo "Liaison configuree. Publication DESARMEE (PUBLIER_FB n'est pas a « oui ») : repetition a blanc seulement."
          else
            echo "Liaison configuree et publication ARMEE."
          fi

      # Diagnostic : elle LIT la page, ce qui demande pages_read_engagement.
      # Publier n'en a pas besoin — donc cette etape ne doit jamais faire
      # echouer le travail. continue-on-error garantit qu'un manque de droit de
      # LECTURE n'empeche pas l'ECRITURE.
      - name: Vérifier la liaison avec la page (lecture seule)
        continue-on-error: true
        if: vars.FB_PAGE_ID != ''
        working-directory: moheligo/pub/flyers
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python3 publier_fb.py --verifier

      - name: Répétition à blanc de la publication Facebook
        if: vars.FB_PAGE_ID != ''
        working-directory: moheligo/pub/flyers
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PAUSE_FB: ${{ vars.PAUSE_FB }}
        run: python3 publier_fb.py

      - name: Publier sur la page Facebook
        if: vars.PUBLIER_FB == 'oui' || inputs.publier_sur_facebook
        working-directory: moheligo/pub/flyers
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PAUSE_FB: ${{ vars.PAUSE_FB }}
        # 🔓 LE BATTEMENT PEUT PORTER L'ORDRE DE FORCER.
        # Cas qui l'a rendu nécessaire (28/08/2026) : un `cron` livré avec 8 h 30
        # de retard a publié le bulletin à 3h38 du matin. Celui du soir, porteur
        # d'une AUTRE prévision, se faisait refuser — le garde-fou compare la
        # ligne de titre, et celle du bulletin ne change jamais.
        # ⚠️ ON NE REGARDE QUE LA DERNIÈRE LIGNE, et c'est capital : si un
        # battement normal arrive après le battement forcé, sa ligne devient la
        # dernière et la publication redevient protégée. Avec `tail -3`, le
        # second battement aurait forcé lui aussi — et publié le doublon.
        run: |
          if [ "$(tail -1 battement-soir.txt | grep -c FORCER)" -gt 0 ]; then
            echo "::warning::Battement marqué FORCER : le garde-fou anti-doublon est contourné pour CETTE publication."
            python3 publier_fb.py --publier --forcer
          else
            python3 publier_fb.py --publier
          fi

      - name: Rapport
        if: always() && vars.FB_PAGE_ID != ''
        working-directory: moheligo/pub/flyers
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python3 rapport.py

      - name: Garder aussi une copie téléchargeable depuis cette exécution
        uses: actions/upload-artifact@v4
        with:
          name: bulletin-du-soir
          path: |
            moheligo/pub/flyers/flyer-soir-facebook.png
            moheligo/pub/flyers/texte-du-jour.txt
          retention-days: 14
