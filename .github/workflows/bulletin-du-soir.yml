# Le « tuyau » du bulletin du soir MoheliGo.
#
# Chaque soir à 19h25 (heure des Comores), GitHub refait le flyer avec la vraie
# prévision de mer du lendemain, et le dépose sur la branche `bulletin-du-jour`.
# Le patron ouvre toujours la même adresse et trouve le flyer du jour :
#
#   https://github.com/pepe-2002/QUALITY-SYSTEM/blob/bulletin-du-jour/flyer-soir-facebook.png
#   https://github.com/pepe-2002/QUALITY-SYSTEM/blob/bulletin-du-jour/texte-du-jour.txt
#
# La branche est réécrite à chaque fois (un seul commit, sans historique) :
# le dépôt ne grossit pas, alors qu'un PNG de 2,6 Mo commité chaque jour
# ajouterait près d'un gigaoctet par an.
#
# 🫀 DEUX DÉCLENCHEURS, ET LE SECOND EST UN FILET — pas un remplaçant.
#
# 1️⃣ LE BATTEMENT reste le déclencheur normal : une Routine pousse une ligne dans
#    `battement-soir.txt` à 19h25 (heure des Comores) et le `push` part en 2 s.
#    C'est net, c'est à l'heure, ça reste la voie principale.
#
# 2️⃣ LE `schedule:` EST REVENU LE 01/09/2026, à la demande du patron, APRÈS avoir
#    été retiré le 28/08. Les deux décisions sont justes, et voici pourquoi :
#    🚨 28/08 — la mesure qui l'avait fait retirer : les deux `cron` du 27 au soir
#    ont été livrés **à 00h37 et 01h06 le lendemain**, soit 8 h 43 et 8 h 25 de
#    retard. Le bulletin est parti **à 3h38 du matin**, heure des Comores. Un
#    rendez-vous livré huit heures plus tard n'est pas « en retard », il est
#    NUISIBLE : il publie quand personne ne regarde, et il occupe la place du
#    jour — celui de 19h25 se fait ensuite refuser comme doublon.
#    🔴 31/08 — la mesure inverse : la session Claude n'avait plus de crédit. Les
#    trois Routines ont sonné, aucune n'a pu s'exécuter. **Ni flyer, ni bulletin,
#    page muette toute la journée.** Le point de défaillance unique de tout le
#    système n'est pas GitHub : c'est la session qui pousse le battement.
#
# ➡️ LA SYNTHÈSE : on ne choisit pas entre les deux pannes, on supprime le DÉGÂT
#    de la seconde solution. Le `cron` est réarmé, MAIS le travail refuse de
#    publier hors de la fenêtre du soir. Un cron livré à 3h38 fabrique alors le
#    flyer, le dépose sur la branche, et **ne publie pas**.
# 📌 LA RÈGLE GÉNÉRALE : quand un outil est peu fiable sur QUAND il agit, on ne
#    le supprime pas et on ne lui fait pas confiance — on lui interdit d'agir au
#    mauvais moment. Le battement, lui, n'est jamais bridé : il arrive à l'heure
#    par construction, et il porte l'ordre FORCER quand il faut passer outre.
#
# ══════════════════════════════════════════════════════════════════════════
# 🚩 02/09/2026 — LE FILET ÉTAIT ARMÉ ET IL N'A JAMAIS PU ATTRAPER QUOI QUE
#    CE SOIT. C'est mesuré, pas supposé.
#
#    Les trois `cron` du 01/09 ONT été livrés — contrairement à ce que j'avais
#    conclu le soir même. Voici à quelle heure, aux Comores :
#      · cron 19h20  →  livré 22h26   (3 h 06 de retard)
#      · cron 20h00  →  livré 22h39   (2 h 39 de retard)
#      · cron 20h40  →  livré 23h08   (2 h 28 de retard)
#    Les trois ont tourné jusqu'au bout, et les trois ont été arrêtés par le
#    garde-fou : « Publier sur la page Facebook » = skipped, trois fois.
#
#    Le garde-fou a donc parfaitement fait son travail. Le FILET, lui, n'a
#    servi à rien : si la session avait été morte ce soir-là — le cas même
#    pour lequel il existe — la page serait restée muette malgré trois
#    déclenchements réussis.
#
# ⛔ **UN DISPOSITIF DE SECOURS QUI NE SE DÉCLENCHE JAMAIS DANS SA FENÊTRE
#    N'EST PAS UN SECOURS : C'EST UNE DÉCORATION QUI RASSURE.** Et c'est pire
#    qu'une absence, parce qu'on cesse de chercher une vraie solution.
#
# ✅ DEUX CORRECTIONS, ET ELLES VONT ENSEMBLE :
#
#    1. LA FENÊTRE COMMENCE APRÈS LE BATTEMENT, ET FINIT PLUS TARD :
#       **19h45 → 23h00** au lieu de 18h00 → 22h00.
#       · Elle COMMENCE à 19h45 pour que le filet n'entre jamais en
#         concurrence avec le battement de 19h25 : un cron ponctuel qui
#         publierait à 19h00 déplacerait le rendez-vous quotidien, et le
#         battement se ferait ensuite refuser comme doublon. Le filet rattrape
#         ce que le battement a laissé tomber, il ne lui prend pas sa place.
#       · Elle FINIT à 23h00 parce qu'un bulletin à 22h30 se lit encore, et
#         que la vraie question n'est pas « est-ce l'heure idéale ? » mais
#         « vaut-il mieux ça, ou une page muette ? ». Avec cette seule borne,
#         deux des trois crons du 01/09 auraient publié.
#
#    2. ON ÉLARGIT LE FILET DANS LE TEMPS, PAS DANS LE NOMBRE D'ESSAIS À LA
#       MÊME HEURE. Les retards mesurés vont de ~20 min à 8 h 43 et sont
#       imprévisibles ; aucun horaire unique ne peut donc tomber juste. On
#       sème les `cron` sur toute la journée pour qu'un retard QUELCONQUE en
#       fasse atterrir au moins un dans la fenêtre du soir (voir ci-dessous).
#       Les surnuméraires ne coûtent rien : hors fenêtre ils se taisent, et
#       dans la fenêtre `publier_fb.deja_publie()` refuse le doublon en ~3 s.
#
# 📌 LA LEÇON, PLUS LARGE QUE CE FICHIER : **un garde-fou qui refuse tout est
#    indiscernable d'un garde-fou qui marche, tant qu'on ne regarde que ses
#    refus.** Ce qu'il fallait mesurer n'était pas « le cron a-t-il été
#    bloqué ? » mais « le filet a-t-il déjà, une seule fois, servi à quelque
#    chose ? ». Trouvé le 02/09 en vérifiant une question annexe.
# ══════════════════════════════════════════════════════════════════════════

name: Bulletin du soir

on:
  push:
    branches: [main]
    paths: ['moheligo/pub/flyers/battement-soir.txt']

  # ⏰ Heures des Comores = UTC+3, sans changement d'heure dans l'année.
  # LA FENÊTRE QUI PUBLIE : 19h45 → 23h00 aux Comores, soit **16:45 → 20:00 UTC**.
  #
  # Ces horaires ne sont PAS des heures de publication : ce sont des heures de
  # DÉPART. Ce qui compte est l'heure d'ARRIVÉE, et le retard de GitHub est
  # imprévisible (mesuré : ~20 min, 2 h 28, 3 h 06, 8 h 25, 8 h 43, et quatre
  # jours sans aucune livraison). On sème donc large pour qu'un retard
  # quelconque en fasse atterrir un dans la fenêtre :
  #
  #   · départs 16:45 / 17:30 / 18:15 / 19:00 UTC → tombent juste si GitHub est
  #     à l'heure ou presque (retard 0 à ~1 h) ;
  #   · départs 14:00 / 15:00 / 16:00 UTC        → couvrent un retard de ~2 à 4 h,
  #     celui mesuré le 01/09 ;
  #   · départs 08:15 / 09:15 / 10:15 UTC        → couvrent un retard de ~7 à 10 h,
  #     celui mesuré le 27/08.
  #
  # Tout ce qui arrive hors fenêtre fabrique le flyer, le dépose sur la branche
  # `bulletin-du-jour` — donc le lien du patron reste à jour — et se tait.
  # Tout ce qui arrive dans la fenêtre après une publication déjà faite se fait
  # refuser en ~3 s par `publier_fb.deja_publie()`. Le doublon reste impossible.
  schedule:
    - cron: '15 8 * * *'
    - cron: '15 9 * * *'
    - cron: '15 10 * * *'
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
    - cron: '45 16 * * *'
    - cron: '30 17 * * *'
    - cron: '15 18 * * *'
    - cron: '0 19 * * *'

  workflow_dispatch:           # bouton « Run workflow » dans l'onglet Actions
    inputs:
      publier_sur_facebook:
        description: 'Publier vraiment sur la page Facebook ?'
        type: boolean
        default: false

# Sans ceci, Python met sa sortie en memoire tampon quand elle est redirigee :
# les messages d'erreur (stderr, non tamponne) apparaissent AVANT les lignes
# normales, et on cherche l'erreur au mauvais endroit du journal. Vecu.
env:
  PYTHONUNBUFFERED: '1'

permissions:
  contents: write              # pour publier sur la branche bulletin-du-jour

concurrency:
  group: bulletin-du-soir
  cancel-in-progress: false

jobs:
  fabriquer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright et Chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Aller chercher la mer de demain et fabriquer le flyer
        working-directory: moheligo/pub/flyers
        run: |
          python3 bulletin.py
          node render.js flyer8-soir-fb.html flyer-soir-facebook.png 1080 1350 2
          ls -la flyer-soir-facebook.png texte-du-jour.txt bulletin.json

      - name: Déposer le flyer du jour sur la branche bulletin-du-jour
        working-directory: moheligo/pub/flyers
        run: |
          set -e
          jour=$(python3 -c "import json;print(json.load(open('bulletin.json'))['date'])")
          etat=$(python3 -c "import json;print(json.load(open('bulletin.json'))['etat'])")
          mkdir -p /tmp/depot
          cp flyer-soir-facebook.png texte-du-jour.txt bulletin.json /tmp/depot/
          cat > /tmp/depot/README.md <<EOF
          # Bulletin du soir MoheliGo — $jour

          **$etat** demain matin sur le couloir Ouroveni – Hoani.

          - \`flyer-soir-facebook.png\` : le visuel à publier (2160 x 2700).
          - \`texte-du-jour.txt\` : le texte du post et le premier commentaire.
          - \`bulletin.json\` : les chiffres bruts.

          Refait ET publié automatiquement chaque soir, heure des Comores.
          Ne jamais republier le flyer de la veille : il annonce une date.
          EOF
          cd /tmp/depot
          git init -q -b bulletin-du-jour
          git config user.name  "MoheliGo Bulletin"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Bulletin du soir — $jour ($etat)"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            bulletin-du-jour

      # --- Publication automatique sur la page Facebook -------------------
      # DÉSARMÉE par défaut : rien n'est publié tant que la variable de dépôt
      # PUBLIER_FB ne vaut pas « oui ». Le bouton « Run workflow » permet en
      # plus une publication de contrôle, à la main, une seule fois.
      # Marche à suivre complète : moheligo/dossier/LIER-FACEBOOK.md
      - name: Est-ce que la liaison Facebook est configurée ?
        run: |
          if [ -z "${{ vars.FB_PAGE_ID }}" ]; then
            echo "::warning::FB_PAGE_ID absent — les etapes Facebook seront sautees et RIEN ne sera publie. Verifier le nom exact de la variable dans Settings > Secrets and variables > Actions."
          elif [ -z "${{ secrets.FB_PAGE_TOKEN }}" ]; then
            echo "::warning::FB_PAGE_TOKEN absent — la liaison echouera. Verifier le nom exact du secret."
          # ⚠️ 12/08/2026 : la variable vaut « Oui » avec une majuscule. Les
          # conditions « if: » de GitHub ignorent la casse, mais PAS bash — ce
          # voyant annoncait donc « DESARMEE » alors que tout partait. Un voyant
          # qui ment coute des heures de diagnostic : on normalise avant de
          # comparer, ici et partout ailleurs.
          elif [ "$(echo "${{ vars.PUBLIER_FB }}" | tr '[:upper:]' '[:lower:]')" != "oui" ]; then
            echo "Liaison configuree. Publication DESARMEE (PUBLIER_FB n'est pas a « oui ») : repetition a blanc seulement."
          else
            echo "Liaison configuree et publication ARMEE."
          fi

      # Diagnostic : elle LIT la page, ce qui demande pages_read_engagement.
      # Publier n'en a pas besoin — donc cette etape ne doit jamais faire
      # echouer le travail. continue-on-error garantit qu'un manque de droit de
      # LECTURE n'empeche pas l'ECRITURE.
      - name: Vérifier la liaison avec la page (lecture seule)
        continue-on-error: true
        if: vars.FB_PAGE_ID != ''
        working-directory: moheligo/pub/flyers
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python3 publier_fb.py --verifier

      - name: Répétition à blanc de la publication Facebook
        if: vars.FB_PAGE_ID != ''
        working-directory: moheligo/pub/flyers
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PAUSE_FB: ${{ vars.PAUSE_FB }}
        run: python3 publier_fb.py

      # 🚧 LE GARDE-FOU D'HEURE — c'est lui qui rend le `schedule:` inoffensif.
      # Il ne bride QUE les exécutions déclenchées par l'horloge de GitHub. Un
      # battement (push) et le bouton « Run workflow » passent toujours : ils
      # arrivent quand quelqu'un l'a décidé, pas quand une file d'attente se
      # vide. Le 27/08, un cron livré à 00h37 a publié le bulletin à 3h38 du
      # matin ; avec cette étape, il aurait fabriqué le flyer et s'est tu.
      #
      # ⏱️ LA FENÊTRE SE COMPTE EN MINUTES, PAS EN HEURES PLEINES, et sa borne
      # basse est 19h45 — vingt minutes APRÈS le battement de 19h25. Une borne
      # à l'heure pleine (« H >= 19 ») laisserait un cron publier à 19h02 et
      # déplacerait le rendez-vous quotidien de tout le monde. Le filet passe
      # derrière le battement, jamais devant.
      - name: Sommes-nous dans la fenêtre du soir ?
        id: fenetre
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Déclenché par ${{ github.event_name }} — pas de bridage horaire."
            echo "ok=oui" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Heure des Comores = UTC+3, sans changement d'heure dans l'année.
          MAINTENANT=$(TZ=Indian/Comoro date '+%H:%M')
          MINUTES=$(( 10#$(TZ=Indian/Comoro date +%H) * 60 + 10#$(TZ=Indian/Comoro date +%M) ))
          DEBUT=$(( 19 * 60 + 45 ))
          FIN=$(( 23 * 60 ))
          echo "Il est ${MAINTENANT} aux Comores (déclenchement par l'horloge GitHub)."
          echo "Fenêtre du filet : 19h45 → 23h00."
          if [ "$MINUTES" -ge "$DEBUT" ] && [ "$MINUTES" -lt "$FIN" ]; then
            echo "Dans la fenêtre : ce cron a le droit de publier (et sera refusé comme doublon si le battement est déjà passé)."
            echo "ok=oui" >> "$GITHUB_OUTPUT"
          else
            echo "ok=non" >> "$GITHUB_OUTPUT"
            echo "::notice::${MAINTENANT} aux Comores, hors de la fenêtre du filet (19h45-23h00) : le flyer est fabriqué et déposé sur la branche bulletin-du-jour, mais RIEN n'est publié. Avant 19h45 le battement a la priorité ; après 23h00 plus personne ne regarde."
          fi

      - name: Publier sur la page Facebook
        if: (vars.PUBLIER_FB == 'oui' || inputs.publier_sur_facebook) && steps.fenetre.outputs.ok == 'oui'
        working-directory: moheligo/pub/flyers
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PAUSE_FB: ${{ vars.PAUSE_FB }}
        # 🔓 LE BATTEMENT PEUT PORTER L'ORDRE DE FORCER.
        # Cas qui l'a rendu nécessaire (28/08/2026) : un `cron` livré avec 8 h 30
        # de retard a publié le bulletin à 3h38 du matin. Celui du soir, porteur
        # d'une AUTRE prévision, se faisait refuser — le garde-fou compare la
        # ligne de titre, et celle du bulletin ne change jamais.
        # ⚠️ ON NE REGARDE QUE LA DERNIÈRE LIGNE, et c'est capital : si un
        # battement normal arrive après le battement forcé, sa ligne devient la
        # dernière et la publication redevient protégée. Avec `tail -3`, le
        # second battement aurait forcé lui aussi — et publié le doublon.
        run: |
          if [ "$(tail -1 battement-soir.txt | grep -c FORCER)" -gt 0 ]; then
            echo "::warning::Battement marqué FORCER : le garde-fou anti-doublon est contourné pour CETTE publication."
            python3 publier_fb.py --publier --forcer
          else
            python3 publier_fb.py --publier
          fi

      - name: Rapport
        if: always() && vars.FB_PAGE_ID != ''
        working-directory: moheligo/pub/flyers
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python3 rapport.py

      - name: Garder aussi une copie téléchargeable depuis cette exécution
        uses: actions/upload-artifact@v4
        with:
          name: bulletin-du-soir
          path: |
            moheligo/pub/flyers/flyer-soir-facebook.png
            moheligo/pub/flyers/texte-du-jour.txt
          retention-days: 14
