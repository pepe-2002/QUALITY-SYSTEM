# ════════════════════════════════════════════════════════════════════
#  Met en ligne « Nous » (dossier nous/) sur GitHub Pages.
#
#  ⚠️ Ne publie QUE le dossier nous/. Le reste du dépôt — RA-QDMS,
#  MoheliGo — n'est pas touché et n'est pas mis en ligne par ici.
#
#  Deux travaux, et ce n'est pas un caprice : la première fois, Pages
#  n'est pas encore activé, donc l'environnement « github-pages »
#  n'existe pas — un travail qui le réclame échoue avant même de
#  démarrer. Le premier travail active donc Pages (enablement: true) et
#  prépare le paquet ; le second, qui vient après, publie.
# ════════════════════════════════════════════════════════════════════

name: Nous — mise en ligne

on:
  push:
    branches: [main]
    paths:
      - "nous/**"
      - ".github/workflows/nous-pages.yml"
  workflow_dispatch:        # bouton « Run workflow » pour publier à la demande

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 1. Activer Pages (si besoin) et préparer le paquet ──
  preparer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Seul le dossier de l'application part en ligne.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nous

  # ── 2. Publier ──
  publier:
    needs: preparer
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
