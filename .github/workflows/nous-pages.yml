# ════════════════════════════════════════════════════════════════════
#  Met en ligne « Nous » (dossier nous/) sur GitHub Pages.
#
#  ⚠️ Ne publie QUE le dossier nous/. Le reste du dépôt — RA-QDMS,
#  MoheliGo — n'est pas touché et n'est pas mis en ligne par ici.
#
#  ⚠️ À FAIRE UNE SEULE FOIS, ET SEUL LE PROPRIÉTAIRE PEUT LE FAIRE :
#     Settings → Pages → Build and deployment → Source : « GitHub Actions »
#  GitHub interdit à un robot de créer le site lui-même (l'API répond
#  « Resource not accessible by integration »). Une fois l'interrupteur
#  basculé, tout le reste est automatique et il n'y a plus jamais rien
#  à toucher : chaque modification de nous/ remet le site à jour.
# ════════════════════════════════════════════════════════════════════

name: Nous — mise en ligne

on:
  push:
    branches: [main]
    paths:
      - "nous/**"
      - ".github/workflows/nous-pages.yml"
  workflow_dispatch:        # bouton « Run workflow » pour publier à la demande

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 1. Préparer le paquet ──
  preparer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Seul le dossier de l'application part en ligne.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nous

  # ── 2. Publier ──
  publier:
    needs: preparer
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
