# La publication de midi, tous les jours, d'après le calendrier de la semaine.
#
#   lundi     comment ça marche      vendredi  la diaspora
#   mardi     l'île                  samedi    la destination
#   mercredi  les prix               dimanche  l'institutionnel
#   jeudi     s'abonner à la page
#
# Le calendrier est dans moheligo/pub/flyers/calendrier.py — et il tire ses
# visuels et ses textes de page.py, la même source que la page du patron.
#
# Ce travail est LÉGER : les visuels sont déjà dans le dépôt, donc ni Chromium
# ni rendu — quelques secondes suffisent. Le bulletin du soir, lui, garde son
# propre workflow parce qu'il doit être fabriqué le jour même.
#
# DEUX INTERRUPTEURS, dans cet ordre :
#   variable PAUSE_FB = oui    → le frein d'urgence, plus rien ne part
#   variable PUBLIER_FB = oui  → arme la publication automatique
# Sans PUBLIER_FB, ce travail se contente d'une répétition à blanc : il affiche
# ce qu'il aurait publié. Marche à suivre : moheligo/dossier/LIER-FACEBOOK.md

# 🫀 CE ROBOT N'A PLUS DE RENDEZ-VOUS PROGRAMMÉ — voir `bulletin-du-soir.yml`
# pour la mesure complète. En deux mots : les `cron` de GitHub ont été livrés
# avec 8 h 30 de retard, donc au milieu de la nuit. Le seul déclencheur est le
# BATTEMENT — une Routine hors de GitHub pousse une ligne dans `battement.txt`
# à 12h05 (heure des Comores), et le `push` part en 2 secondes.

name: Publication du jour

on:
  push:
    branches: [main]
    paths: ['moheligo/pub/flyers/battement.txt']

  workflow_dispatch:
    inputs:
      publier_sur_facebook:
        description: 'Publier vraiment sur la page Facebook ?'
        type: boolean
        default: false
      essai_ecriture:
        description: 'Essai : deposer une photo NON PUBLIEE pour verifier le droit de publier'
        type: boolean
        default: false
      avis_de_suspension:
        description: 'Publier l avis de SERVICE SUSPENDU (pendant une fermeture)'
        type: boolean
        default: false
      reprise:
        description: 'Publier l annonce de REPRISE des traversees (jamais automatique)'
        type: boolean
        default: false
      video_young_leader:
        description: 'Publier la VIDEO Young Leader (moheligo/pub/video)'
        type: boolean
        default: false
      rapport_seulement:
        description: 'Ne RIEN publier : seulement produire le rapport (diagnostic)'
        type: boolean
        default: false
      # 🎯 PUBLIER UN VISUEL CHOISI, hors calendrier.
      # Ajouté le 28/08/2026 : le patron voulait publier le flyer
      # « digitalisation », qui n'est dans aucun créneau. Jusque-là les robots ne
      # savaient sortir QUE la publication du jour — donc tout visuel hors
      # calendrier demandait une manipulation à la main, et rien de reproductible.
      # 📌 Sert aussi pour les films d'identité et le flyer destination.
      visuel:
        description: 'Publier UN visuel precis (nom du PNG dans pub/flyers)'
        type: string
        default: ''
      texte:
        description: 'Le fichier texte qui va avec (dans pub/flyers)'
        type: string
        default: ''

# Sans ceci, Python met sa sortie en memoire tampon quand elle est redirigee :
# les messages d'erreur (stderr, non tamponne) apparaissent AVANT les lignes
# normales, et on cherche l'erreur au mauvais endroit du journal. Vecu.
env:
  PYTHONUNBUFFERED: '1'

permissions:
  contents: read

# ⚠️ 26/08/2026 — LE VERROU S'EST BLOQUÉ, ET IL A FALLU LE RENOMMER.
# Une exécution est restée fantôme : GitHub l'annonçait « en file » et refusait
# de l'annuler (« cannot cancel a workflow run that has not been queued yet »).
# Elle a gardé le verrou, et les DEUX lancements suivants sont morts en
# « startup_failure » sans jamais démarrer. Renommer le groupe libère les
# nouvelles exécutions : le fantôme garde l'ancien nom, tout seul.
# 📌 Si ça se reproduit : incrémenter le numéro ci-dessous. Le verrou reste utile
# (il empêche deux publications simultanées), il ne doit juste pas être éternel.
concurrency:
  group: publication-du-jour-2
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      # 🪶 ON NE TÉLÉCHARGE QUE CE QU'ON OUVRE.
      # Le patron, 28/08/2026 : « supprime des flyers pour alléger le système ».
      # Mesuré avant de supprimer quoi que ce soit : l'arbre fait 278 Mo, dont
      # ~150 Mo de VIDÉOS que ce robot n'ouvre jamais. Il n'y avait donc rien à
      # supprimer — il y avait à ne pas télécharger.
      # 📌 Les quatre dossiers ci-dessous sont exactement ce que les scripts de
      # `pub/flyers/` atteignent (relevé sur leurs chemins relatifs : `../photos`,
      # `../photos-cc`, `../../dossier`). ⚠️ Si un script se met un jour à lire
      # ailleurs, il faut l'ajouter ICI, sinon la publication casse — et une
      # publication qui casse coûte plus cher que les secondes gagnées.
      # 🚩 `moheligo/pub/video` N'ETAIT PAS DANS CETTE LISTE — corrige le 01/09/2026.
      # L'etape « Publier la video Young Leader » a ete ecrite le 26/08 et mise en
      # attente le jour meme (« on la garde pour la reouverture »). Le jour ou on
      # s'en est servi, elle a echoue en ZERO seconde : « video introuvable ». Le
      # fichier etait bien sur main — c'est le runner qui ne le telechargeait pas.
      # 📌 UN CHEMIN DE CODE JAMAIS EXECUTE N'EST PAS UN CHEMIN DE CODE QUI MARCHE.
      # Il avait l'air fini : etape ecrite, case dans le formulaire, garde-fou de
      # service, fonction testee. Personne ne l'avait lance une seule fois.
      #
      # ⚖️ POURQUOI C'EST CONDITIONNEL et non ajoute a la liste fixe : le dossier
      # video pese ~37 Mo. Le telecharger a chaque publication de midi, tous les
      # jours, pour un fichier qui sert deux fois par an, serait payer tous les
      # jours pour un cas rare. L'expression s'evalue a la chaine vide quand la
      # case n'est pas cochee (declenchement par cron ou par battement).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            moheligo/pub/flyers
            moheligo/pub/photos
            moheligo/pub/photos-cc
            moheligo/dossier
            ${{ inputs.video_young_leader && 'moheligo/pub/video' || '' }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow      # pour alléger les PNG trop lourds

      - name: Ce que le calendrier prévoit cette semaine
        working-directory: moheligo/pub/flyers
        run: python3 calendrier.py

      - name: Est-ce que la liaison Facebook est configurée ?
        run: |
          if [ -z "${{ vars.FB_PAGE_ID }}" ]; then
            echo "::warning::FB_PAGE_ID absent — les etapes Facebook seront sautees et RIEN ne sera publie. Verifier le nom exact de la variable dans Settings > Secrets and variables > Actions."
          elif [ -z "${{ secrets.FB_PAGE_TOKEN }}" ]; then
            echo "::warning::FB_PAGE_TOKEN absent — la liaison echouera. Verifier le nom exact du secret."
          # ⚠️ 12/08/2026 : la variable vaut « Oui » avec une majuscule. Les
          # conditions « if: » de GitHub ignorent la casse, mais PAS bash — ce
          # voyant annoncait donc « DESARMEE » alors que tout partait. Un voyant
          # qui ment coute des heures de diagnostic : on normalise avant de
          # comparer, ici et partout ailleurs.
          elif [ "$(echo "${{ vars.PUBLIER_FB }}" | tr '[:upper:]' '[:lower:]')" != "oui" ]; then
            echo "Liaison configuree. Publication DESARMEE (PUBLIER_FB n'est pas a « oui ») : repetition a blanc seulement."
          else
            echo "Liaison configuree et publication ARMEE."
          fi

      # Diagnostic : elle LIT la page, ce qui demande pages_read_engagement.
      # Publier n'en a pas besoin — donc cette etape ne doit jamais faire
      # echouer le travail. continue-on-error garantit qu'un manque de droit de
      # LECTURE n'empeche pas l'ECRITURE.
      - name: Vérifier la liaison avec la page (lecture seule)
        continue-on-error: true
        if: vars.FB_PAGE_ID != ''
        working-directory: moheligo/pub/flyers
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python3 publier_fb.py --verifier

      - name: Répétition à blanc
        if: vars.FB_PAGE_ID != ''
        working-directory: moheligo/pub/flyers
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PAUSE_FB: ${{ vars.PAUSE_FB }}
        run: python3 programme.py

      - name: Essai d'ecriture (photo NON PUBLIEE, invisible sur la page)
        if: inputs.essai_ecriture
        working-directory: moheligo/pub/flyers
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python3 programme.py --essai

      # L'avis de fermeture, a la demande. Le robot ne le sort de lui-meme que le
      # PREMIER jour de la fermeture (il ne garde aucune memoire entre deux
      # executions) : cette case sert a le republier, ou a l'annoncer plus tard
      # dans la journee comme le 12/08/2026.
      - name: Publier l'avis de service suspendu
        if: inputs.avis_de_suspension && !inputs.rapport_seulement
        working-directory: moheligo/pub/flyers
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PAUSE_FB: ${{ vars.PAUSE_FB }}
        run: python3 programme.py --avis --publier

      # L'annonce de REPRISE. Jamais sur minuterie : le jour et l'heure sont
      # decides par le patron, parce qu'une reprise se decide quand la vedette
      # part vraiment. programme.py refuse de la publier si service.py dit encore
      # « ferme » — les deux messages se contrediraient.
      - name: Publier l'annonce de reprise
        if: inputs.reprise && !inputs.rapport_seulement
        working-directory: moheligo/pub/flyers
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PAUSE_FB: ${{ vars.PAUSE_FB }}
        run: python3 programme.py --reprise --publier

      # LA VIDEO. Point d'entree /videos et non /photos (voir publier_video dans
      # publier_fb.py). Jamais sur minuterie : une video se publie quand on l'a
      # decide, pas a 12h07. Le texte porte deja la mention de fermeture quand le
      # service est ferme — il est ecrit a la main dans pub/video.
      - name: Publier la video Young Leader
        if: inputs.video_young_leader && !inputs.rapport_seulement
        working-directory: moheligo/pub/flyers
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PAUSE_FB: ${{ vars.PAUSE_FB }}
        run: |
          python3 publier_fb.py --publier \
            --video ../video/MoheliGo-YoungLeader.mp4 \
            --texte ../video/texte-publication.txt \
            --titre "MoheliGo - La mer decide. Nous, on te le dit avant."

      # ⚠️ « && !inputs… » : sans ces conditions, un lancement avec une des cases
      # ci-dessus publierait EN PLUS la publication du jour, puisque PUBLIER_FB
      # est arme en permanence — deux posts d'un coup.
      # Un visuel choisi à la main, hors calendrier.
      # ⚠️ LES NOMS DE FICHIERS PASSENT PAR L'ENVIRONNEMENT, JAMAIS DANS LE
      # SCRIPT. Écrire `--image ${{ inputs.visuel }}` collerait le texte saisi
      # directement dans la commande : n'importe qui pouvant lancer ce workflow
      # y ferait exécuter ce qu'il veut. Avec `env:` + guillemets, la valeur
      # reste une donnée.
      - name: Publier un visuel choisi
        if: inputs.visuel != '' && !inputs.rapport_seulement
        working-directory: moheligo/pub/flyers
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PAUSE_FB: ${{ vars.PAUSE_FB }}
          VISUEL: ${{ inputs.visuel }}
          TEXTE: ${{ inputs.texte }}
        run: |
          test -f "$VISUEL" || { echo "::error::visuel introuvable : $VISUEL"; exit 1; }
          test -f "$TEXTE"  || { echo "::error::texte introuvable : $TEXTE";  exit 1; }
          python3 publier_fb.py --publier --image "$VISUEL" --texte "$TEXTE"

      - name: Publier
        if: inputs.visuel == '' && (vars.PUBLIER_FB == 'oui' || inputs.publier_sur_facebook) && !inputs.avis_de_suspension && !inputs.reprise && !inputs.video_young_leader && !inputs.rapport_seulement
        working-directory: moheligo/pub/flyers
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PAUSE_FB: ${{ vars.PAUSE_FB }}
        run: python3 programme.py --publier

      - name: Rapport
        if: always() && vars.FB_PAGE_ID != ''
        working-directory: moheligo/pub/flyers
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python3 rapport.py
