# ════════════════════════════════════════════════════════════════════
#  Met en ligne les applications du dépôt sur GitHub Pages.
#
#    /kodo/   le jeu-école Kodo
#    /nous/   la messagerie privée Nous
#
#  ⚠️ GitHub n'autorise qu'UN SEUL site Pages par dépôt : les deux
#  applications doivent donc être publiées par ce workflow unique.
#  C'est pour ça qu'il remplace l'ancien « nous-pages.yml ».
#
#  ⚠️ RA-QDMS et MoheliGo ne sont PAS publiés ici et ne sont pas touchés.
#
#  ⚠️ À FAIRE UNE SEULE FOIS, ET SEUL LE PROPRIÉTAIRE PEUT LE FAIRE :
#     Settings → Pages → Build and deployment → Source : « GitHub Actions »
#  GitHub interdit à un robot de créer le site lui-même (l'API répond
#  « Resource not accessible by integration »). Une fois l'interrupteur
#  basculé, tout est automatique : chaque modification de kodo/ ou de
#  nous/ remet le site à jour toute seule.
# ════════════════════════════════════════════════════════════════════

name: Site — mise en ligne

on:
  push:
    branches: [main]
    paths:
      - "kodo/**"
      - "nous/**"
      - ".github/pages-index.html"
      - ".github/workflows/site-pages.yml"
  workflow_dispatch:        # bouton « Run workflow » pour publier à la demande

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 1. Assembler le paquet ──
  preparer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Assembler le site
        run: |
          mkdir -p _site
          cp -r kodo _site/kodo
          cp -r nous _site/nous
          # Documentation et fichiers de travail : inutiles en ligne
          rm -f _site/kodo/README.md _site/kodo/kodo-en-ligne.html
          rm -f _site/nous/README.md _site/nous/SQL-nous.sql
          # La racine mène au jeu ; « Nous » garde son adresse discrète.
          cp .github/pages-index.html _site/index.html
          echo "Contenu publié :"
          ls _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ── 2. Publier ──
  publier:
    needs: preparer
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
