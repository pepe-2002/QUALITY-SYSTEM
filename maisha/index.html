    ()=>{ etat.bonheur=borne(etat.bonheur+9); ecrire("Superbe traversée en mer vers Mohéli, dauphins au rendez-vous. 🐬", "bon"); },
    ()=>{ if(etat.argent>500){ const perte=100+alea(Math.min(2000,Math.max(200,etat.argent/4))); etat.argent-=perte;

function ajouterAmi(){
  const g = alea(2)?"F":"M";
  const nom = parmi(g==="F"?PRENOMS_F:PRENOMS_M)+" "+parmi(NOMS);
  etat.relations.push(rel("ami", nom, Math.max(1,etat.age + alea(5) - 2), g));
  ecrire(`Je me suis fait un nouvel ami : ${nom}.`, "bon");
}

/* ---------------- mort & héritage ---------------- */

function valeurPatrimoine(){
  let v = etat.biens.reduce((s,b)=>s+b.valeur,0);
  for(const e of (etat.entreprises||[])) v += Math.round(e.valeur*0.9) + Math.max(0, e.caisse||0);
  return v;
}

function mourir(cause){
  etat.mort = true;
  ecrire(`Je suis mort${etat.genre==="F"?"e":""} ${cause} à ${etat.age} ans.`, "mauvais");
  sauver(); toutAfficher();

  const heritiers = enfants();
  const patrimoine = valeurPatrimoine();
  // les biens sont vendus et partagés ; les entreprises passent en nature à l'héritier choisi
  const patrimoineBiens = etat.biens.reduce((s,b)=>s+b.valeur,0);
  const fraisSucc = diff().frais;
  const succession = Math.max(0, Math.round((Math.max(0,etat.argent) + patrimoineBiens) * (1-fraisSucc)));
  const part = heritiers.length ? Math.round(succession / heritiers.length) : 0;

  let htmlHeritiers = "";
  if(heritiers.length){
    htmlHeritiers = `<div class="fiche">🪙 Succession (après ${Math.round(fraisSucc*100)} % de frais) : <b>${euros(succession)}</b><br>
      👪 Partagée entre <b>${heritiers.length}</b> héritier${heritiers.length>1?"s":""} : <b>${euros(part)}</b> chacun</div>
      <div class="sous">Continuer la dynastie ${etat.nom} (génération ${etat.generation+1}) avec :</div>` +
      heritiers.map((h,i)=>`<button class="grand heritier" data-i="${i}">${h.genre==="F"?"👧":"👦"} ${h.nom} — ${h.age} an${h.age>1?"s":""}<br><small>hérite ${euros(part)}${h.argent?" + "+euros(h.argent)+" d'économies":""}${(etat.entreprises||[]).length?" + 🏭 "+(etat.entreprises.length>1?"les entreprises":"l'entreprise"):""}${etat.royaume?" + 👑 le trône":""}</small></button>`).join("");
  }

  // le ruban : le titre que mérite cette vie
  const bilanVie = {
    age: etat.age, fortune: etat.argent + patrimoine, karma: etat.karma||60,
    celebrite: etat.celebrite, intel: etat.intel, sante: etat.sante, diplome: etat.diplome,
    royaume: !!etat.royaume, polMax: etat.polMax||0, entMax: etat.entMax||0,
    enfants: heritiers.length, petitsEnfants: etat.petitsEnfants||0,
    crimes: etat.crimes||0, anneesPrison: etat.anneesPrison||0, divorces: etat.divorces||0,
    voyages: etat.voyages||0, constructions: etat.constructions||0,
    marie: etat.relations.some(r => r.type === "conjoint"),
  };
  const ruban = RUBANS.find(r => { try{ return r.test(bilanVie); }catch(e){ return false; } }) || RUBANS[RUBANS.length-1];
  etat.dernierRuban = ruban.nom;
  if(ruban.nom === "Légende") debloquer("legende");
  if((etat.karma||60) >= 90) debloquer("saint");
  if(etat.age >= 100) debloquer("centenaire");

  $("plein").innerHTML = `
    <div class="cadre">
      <div class="embleme">🪦</div>
      <h1>${etat.prenom} ${etat.nom}</h1>
      <div class="fiche" style="text-align:center; border-color:var(--accent)">
        <div style="font-size:40px">${ruban.ico}</div>
        <div style="font-size:20px; font-weight:800; letter-spacing:.5px">Ruban « ${ruban.nom} »</div>
        <div style="color:var(--ink-dim); font-size:13px; line-height:1.5">${ruban.desc}</div>
        <div style="color:var(--ink-dim); font-size:12px; margin-top:8px">🏆 Succès débloqués : <b>${succesObtenus().length}/${SUCCES.length}</b></div>
      </div>
      <div class="sous">Génération ${etat.generation} · ${etat.ville}, ${etat.pays}<br>Décès ${cause} à ${etat.age} ans</div>
      <div class="fiche">
        💰 Argent au décès : <b>${euros(etat.argent)}</b><br>
        🏠 Patrimoine : <b>${euros(patrimoine)}</b><br>
        ${etat.diplome ? "🎓 Diplôme : <b>"+etat.filiere+"</b><br>" : ""}
        ${etat.emploi ? "💼 Dernier poste : <b>"+etat.emploi.titre+"</b><br>" : ""}
        ${(etat.entreprises||[]).map(e=>"🏭 Entreprise transmise : <b>"+e.nom+"</b> (caisse "+euros(Math.max(0,e.caisse||0))+")<br>").join("")}
        ${etat.celebrite>=50 ? "⭐ Mort·e célèbre (célébrité "+etat.celebrite+")<br>" : ""}
        ${etat.politique&&etat.politique.niveau>0 ? "🏛️ Carrière politique : <b>"+NIVEAUX_POL[etat.politique.niveau]+"</b><br>" : ""}
        ${etat.royaume ? "👑 Souverain·e de <b>"+etat.royaume.nom+"</b> ("+etat.royaume.sujets.toLocaleString("fr-FR")+" sujets)<br>" : ""}
        👶 Enfants : <b>${heritiers.length}</b>${etat.petitsEnfants?" · Petits-enfants : <b>"+etat.petitsEnfants+"</b>":""}
        <br>☯️ Karma : <b>${etat.karma||60}/100</b>${(etat.crimes||0)?" · 🚨 Délits : <b>"+etat.crimes+"</b>":""}${(etat.anneesPrison||0)?" · ⛓️ Prison : <b>"+etat.anneesPrison+" an(s)</b>":""}
        ${(etat.voyages||0)?"<br>✈️ Voyages : <b>"+etat.voyages+"</b>":""}${(etat.constructions||0)?" · 🏗️ Bâti pour le pays : <b>"+etat.constructions+"</b>":""}
        ${heritiers.filter(h=>h.riche).length?"<br>🌟 Enfants devenus riches par eux-mêmes : <b>"+heritiers.filter(h=>h.riche).length+"</b>":""}
        ${heritiers.some(h=>h.polit===4)?"<br>🏛️ Un de mes enfants a été <b>président·e</b> !":""}
        <br>${diff().ico} Mode : <b>${diff().nom}</b>
      </div>
      ${htmlHeritiers}
      <button class="grand ${heritiers.length?"secondaire":""}" id="btn-renaitre">🌱 Nouvelle vie (recommencer à zéro)</button>
    </div>`;
  $("plein").classList.add("ouvert");
  $("btn-renaitre").onclick = () => ecranAccueil();
  for(const b of document.querySelectorAll("#plein .heritier")){
    b.onclick = () => continuerAvec(heritiers[+b.dataset.i], part);
  }
}

function continuerAvec(h, heritage){
  const parent = etat;
  const freresSoeurs = enfants().filter(x => x !== h);
  const conjointSurvivant = parent.relations.find(r => r.vivant && r.type==="conjoint");
  const monde = parent.monde;

  etat = {
    prenom: h.nom.split(" ")[0], nom: parent.nom, genre: h.genre,
    ville: parent.ville, pays: parent.pays,
    age: Math.max(0, h.age), generation: parent.generation+1,
    sante: 70+alea(31), bonheur: 60+alea(31),
    intel: borne(parent.intel*0.5 + 20+alea(35)),
    look: borne(parent.look*0.5 + 20+alea(35)),
    difficulte: parent.difficulte,
    celebrite: 0, compPro: h.metier ? 15+alea(15) : 5+alea(10), mba:false, anda:false,
    argent: heritage + (h.argent||0), emploi:null, filiere:null,
    etude:"aucune", anneesEtude:0, diplome: h.statut==="diplômé",
    entreprises: parent.entreprises || [], politique:null, royaume: parent.royaume,
    pension:0, maladie:null, petitsEnfants:0, anneesTravail: h.metier?2:0, candidats:null, auto: parent.auto||false,
    karma:60, animaux:[], crimes:0, anneesPrison:0, divorces:0, voyages:0, constructions:0, polMax:0, entMax:0,
    prison:0, faits:{}, relations:[], biens:[], journal:[], monde, mort:false
  };
  // scolarité selon l'âge
  const a = etat.age;
  etat.etude = a>=18 ? "fini" : a>=15 ? "lycee" : a>=11 ? "college" : a>=6 ? "primaire" : a>=3 ? "maternelle" : "aucune";
  if(a>=18 && h.statut==="étudiant"){ etat.etude="universite"; etat.filiere=parmi(FILIERES); etat.anneesEtude=Math.max(0,a-18); }
  // l'héritier garde son métier
  if(h.metier) etat.emploi = {titre:h.metier, salaire:h.salaire, annees:1};
  // les entreprises familiales passent à l'héritier : il n'y est plus salarié, il en est le patron
  for(const e of etat.entreprises){
    const avant = (e.employes||[]).length;
    e.employes = (e.employes||[]).filter(x=>x.nom!==h.nom);
    if(avant !== e.employes.length) etat.emploi = null;
    e.monSalaire = 0;
  }

  // famille : le parent survivant + frères et sœurs
  if(conjointSurvivant){
    etat.relations.push({type: conjointSurvivant.genre==="F"?"mere":"pere", nom: conjointSurvivant.nom,
      age: conjointSurvivant.age, genre: conjointSurvivant.genre, barre: 70+alea(31), vivant:true});
  }
  for(const f of freresSoeurs){
    etat.relations.push({type: f.genre==="F"?"soeur":"frere", nom: f.nom, age: f.age, genre: f.genre, barre: 60+alea(41), vivant:true});
  }

  nouvelleAnnee();
  ecrire(`Je suis ${etat.prenom} ${etat.nom}, génération ${etat.generation} de la famille.`, "bon");
  ecrire(`Mon ${parent.genre==="F"?"ma mère":"père"} ${parent.prenom} nous a quittés. J'hérite de ${euros(heritage)} (part sur ${freresSoeurs.length+1} enfant${freresSoeurs.length?"s":""})${h.argent?", en plus de mes "+euros(h.argent)+" d'économies personnelles":""}.`.replace("Mon ma","Ma"), "argent");
  for(const e of etat.entreprises)
    ecrire(`🏭 Je reprends l'entreprise familiale « ${e.nom} » (${e.type}, caisse : ${euros(e.caisse||0)}). À moi de la faire prospérer.`, "argent");
  if(etat.royaume){
    if(etat.age>=18) ecrire(`👑 COURONNEMENT ! Je monte sur le trône : me voilà ${etat.genre==="F"?"Reine":"Roi"} de ${etat.royaume.nom}.`, "bon");
    else ecrire(`👑 J'hérite du trône de ${etat.royaume.nom}. Le conseil de régence gouvernera jusqu'à mes 18 ans.`, "bon");
  }
  sauver(); toutAfficher();
  $("plein").classList.remove("ouvert");
}

/* ---------------- modales ---------------- */

function prochaineModale(){
  if(!fileEvenements.length) return;
  const ev = fileEvenements.shift();
  // en pilote automatique, le personnage tranche lui-même
  if(etat.auto){
    const dispo = ev.choix.filter(c => !/annuler/i.test(c.label));
    const c = dispo.length ? dispo[alea(Math.min(2, dispo.length))] : ev.choix[0];
    c.effet();
    if(!etat.mort){ sauver(); toutAfficher(); prochaineModale(); }
    return;
  }
  $("mod-titre").textContent = ev.titre;
  $("mod-texte").textContent = ev.texte;
  const box = $("mod-choix");
  box.innerHTML = "";
  for(const c of ev.choix){
    const b = document.createElement("button");
    b.textContent = c.label;
    b.onclick = () => {
      $("modale").classList.remove("ouvert");
      c.effet();
      if(!etat.mort){ sauver(); toutAfficher(); prochaineModale(); }
    };
    box.appendChild(b);
  }
  $("modale").classList.add("ouvert");
}

/* ---------------- feuilles (onglets) ---------------- */

let ecranCourant = null;   // {nom, arg, parent}

function ouvrirFeuille(nom, arg, parent){
  if(etat.mort) return;
  const titres = {travail:"💼 Travail & Entreprises", actifs:"🏠 Actifs", pays:"🏛️ Mon pays",
                  relations:"❤️ Relations", vie:"🌴 Vie & Formations"};
  const vues = {travail:feuilleTravail, actifs:feuilleActifs, pays:feuillePays,
                relations:feuilleRelations, vie:feuilleVie,
                entreprise:feuilleEntreprise, gouvernement:feuilleGouvernement};
  ecranCourant = {nom, arg, parent: parent||null};
  conteneurCourant = null;
  $("feuille-titre").textContent = nom==="entreprise" ? `${arg.ico} ${arg.nom}`
    : nom==="gouvernement" ? `🏛️ Gouvernement de ${etat.pays}`
    : titres[nom];
  $("feuille-retour").hidden = !parent;
  $("feuille-corps").innerHTML = "";
  $("feuille-corps").scrollTop = 0;
  vues[nom](arg);
  $("voile").classList.add("ouvert");
  $("feuille").classList.add("ouvert");
}
function rafraichirFeuille(){
  if(ecranCourant) ouvrirFeuille(ecranCourant.nom, ecranCourant.arg, ecranCourant.parent);
}
function retourFeuille(){
  if(ecranCourant && ecranCourant.parent) ouvrirFeuille(ecranCourant.parent);
  else fermerFeuille();
}
function fermerFeuille(){
  ecranCourant = null;
  $("voile").classList.remove("ouvert");
  $("feuille").classList.remove("ouvert");
}
/* petits boutons compacts en grille */
function grille(parent){
  const d = document.createElement("div");
  d.className = "grille";
  parent.appendChild(d);
  return d;
}
function btn(parent, label, classe, fn, desactive){
  const b = document.createElement("button");
  b.className = "bouton "+(classe||"");
  b.textContent = label;
  if(desactive) b.disabled = true;
  b.onclick = () => { fn(); if(!etat.mort){ sauver(); toutAfficher(); } };
  parent.appendChild(b);
  return b;
}
let conteneurCourant = null;
function section(titre, ouvert){
  const ferme = ouvert === false;
  const h = document.createElement("button");
  h.type = "button";
  h.className = "section-titre" + (ferme ? " ferme" : "");
  h.innerHTML = `<span class="chev">▾</span><span>${titre}</span><span class="trait"></span>`;

}
function carte(html){
  const d = document.createElement("div");
  d.className = "carte";
  d.innerHTML = html;
  (conteneurCourant || $("feuille-corps")).appendChild(d);
  return d;
}
function action(parent, label, classe, fn, desactive){
  const b = document.createElement("button");
  b.className = "bouton "+(classe||"");
  b.textContent = label;
  if(desactive) b.disabled = true;
  b.onclick = () => { fn(); if(!etat.mort){ sauver(); toutAfficher(); } };
  parent.querySelector(".actions").appendChild(b);
  return b;
}

/* --- offres d'emploi reçues (chasseurs de tête) --- */
function offresRecues(){
  if(!etat.offres || etat.offres.age !== etat.age){
    const liste = [];
    if(etat.age >= 18 && etat.prison <= 0){
      const niveau = etat.intel + (etat.compPro||0)/2 + (etat.diplome ? 20 : 0) + (etat.mba ? 15 : 0);
      const eligibles = EMPLOIS.filter(x => (!x.diplome || etat.diplome) && (x.intel||0) <= niveau/1.4);
      const nb = niveau > 110 ? 3 : niveau > 75 ? 2 : niveau > 45 ? 1 : 0;
      for(let i=0;i<nb && eligibles.length;i++){
        const m = parmi(eligibles);
        const prime = 1 + (alea(35) - 10)/100;                 // −10 % à +25 % du marché
        const g = alea(2) ? "F" : "M";
        liste.push({
          titre: m.titre,
          salaire: Math.round(m.salaire * prime * (1 + (etat.compPro||0)/220) / 500) * 500,
          societe: parmi(CLIENTS),
          recruteur: parmi(g==="F"?PRENOMS_F:PRENOMS_M) + " " + parmi(NOMS),
          avantages: parmi(["voiture de fonction","logement de fonction","13ᵉ mois","télétravail partiel",
                            "formation payée","mutuelle famille","prime de résultat"]),
        });
      }
    }
    etat.offres = {age: etat.age, liste};
  }
  return etat.offres.liste;
}

/* --- progression de palier dans une carrière spéciale --- */
function monterRang(C, def){
  if(C.rang >= def.rangs.length-1) return;
  const seuils = [1, 3, 6, 10];
  const requis = seuils[C.rang] || 99;
  if((C.oeuvres||C.annees||0) >= requis && C.talent >= 30 + C.rang*15 && alea(100) < 55){
    C.rang++;
    etat.celebrite = borne(etat.celebrite + 8);
    ecrire(`${def.ico} Nouveau palier : me voilà <b>${def.rangs[C.rang]}</b> !`.replace(/<\/?b>/g,""), "bon");
    if(C.rang >= def.rangs.length-1) etat.celebrite = borne(etat.celebrite + 12);
  }
}

    rafraichirFeuille();
  });

  /* --- croissance, fusion, bourse --- */
  section("Croissance & haut de bilan", false);

  // introduction en bourse
  if(!e.cotee){
    const okT = (e.taille||0) >= 2, okV = e.valeur >= 600000, okR = e.reputation >= 60;
    const frais = Math.round(e.valeur*0.12);
    const cI = carte(`<div class="titre">📈 Introduire en bourse</div>
      <div class="ligne-info"><span>Être au moins un Groupe</span><b>${okT?"✅":"❌"} ${tailleEnt(e).nom}</b></div>
      <div class="ligne-info"><span>Valorisation ≥ 600 000 €</span><b>${okV?"✅":"❌"} ${euros(e.valeur)}</b></div>
      <div class="ligne-info"><span>Réputation ≥ 60</span><b>${okR?"✅":"❌"} ${e.reputation}</b></div>
      <div class="ligne-info"><span>Frais d'introduction</span><b>${euros(frais)}</b></div>
      <div class="detail" style="margin-top:6px">L'entrée en bourse lève des capitaux massifs et fait croître la valorisation bien plus vite. Mais les actionnaires exigent des résultats : une année de pertes fait plonger le cours.</div>
      <div class="actions"></div>`);
    action(cI, "Entrer en bourse", "or", () => {
      e.caisse -= frais;
      const leve = Math.round(e.valeur*0.45);
      e.caisse += leve; e.cotee = true; e.reputation = borne(e.reputation+10);
      etat.celebrite = borne(etat.celebrite+10);
      ecrire(`📈🔔 « ${e.nom} » entre en bourse ! ${euros(leve)} levés auprès des investisseurs (frais : ${euros(frais)}). La cloche a sonné.`, "argent");
      rafraichirFeuille();
    }, !okT || !okV || !okR || (e.caisse||0) < frais);
  } else {
    carte(`<div class="titre">📈 Société cotée</div>
      <div class="detail">« ${e.nom} » est cotée en bourse : la valorisation grimpe plus vite chaque année bénéficiaire, mais un exercice dans le rouge fait chuter le cours de 12 %.</div>`);
  }

  // fusion avec une autre de mes entreprises
  const autres = (etat.entreprises||[]).filter(x => x !== e);
  for(const o of autres){
    const cout = Math.round((e.valeur + o.valeur) * 0.22);
    const cF = carte(`<div class="titre">🔗 Fusionner avec « ${o.nom} »</div>
      <div class="ligne-info"><span>Valorisation combinée</span><b>${euros(e.valeur + o.valeur)}</b></div>
      <div class="ligne-info"><span>Coût de l'opération</span><b>${euros(cout)}</b></div>
      <div class="detail" style="margin-top:6px">Banquiers, avocats, restructuration : la fusion coûte très cher, mais le nouvel ensemble vaut 15 % de plus que la somme des parties, cumule les équipes et les trésoreries, et monte d'un palier de taille.</div>
      <div class="actions"></div>`);
    action(cF, "Fusionner", "or", () => {
      etat.argent -= cout;
      e.valeur = Math.round((e.valeur + o.valeur) * 1.15);
      e.caisse = (e.caisse||0) + (o.caisse||0);
      e.dette = (e.dette||0) + (o.dette||0);
      e.employes = e.employes.concat(o.employes||[]);
      e.reputation = borne(Math.round((e.reputation + o.reputation)/2) + 8);
      e.qualite = borne(Math.round((e.qualite + o.qualite)/2) + 4);
      e.stock = Math.min(100, Math.round((e.stock + o.stock)/2) + 10);
      e.taille = Math.min(3, Math.max(e.taille||0, o.taille||0) + 1);
      e.niveau = Math.min(5, Math.max(e.niveau, o.niveau));
      e.produits = (e.produits||[]).concat(o.produits||[]);
      if(!e.pdg && o.pdg) e.pdg = o.pdg;
      etat.entreprises = etat.entreprises.filter(x => x !== o);
      etat.celebrite = borne(etat.celebrite+6);
      ecrire(`🔗 FUSION : « ${o.nom} » absorbe et rejoint « ${e.nom} » pour ${euros(cout)}. Le nouvel ensemble pèse ${euros(e.valeur)} et devient ${tailleEnt(e).nom}.`, "argent");
      rafraichirFeuille();
    }, etat.argent < cout);
  }

  const suivante = TAILLES[(e.taille||0)+1];
  if(suivante){
    const okEmp = e.employes.length >= suivante.emp, okVal = e.valeur >= suivante.valeur;
    const cc = carte(`<div class="titre">${suivante.ico} Passer en ${suivante.nom}</div>
      <div class="ligne-info"><span>Valorisation requise</span><b>${okVal?"✅":"❌"} ${euros(e.valeur)} / ${euros(suivante.valeur)}</b></div>
      <div class="ligne-info"><span>Employés requis</span><b>${okEmp?"✅":"❌"} ${e.employes.length} / ${suivante.emp}</b></div>
      <div class="detail" style="margin-top:6px">Monter en gamme augmente durablement la production et la valorisation, mais consomme plus de stock.</div>
      <div class="actions"></div>`);
    action(cc, `Passer en ${suivante.nom}`, "or", () => {
      e.taille++; e.valeur = Math.round(e.valeur*1.15); e.reputation = borne(e.reputation+8);
      etat.celebrite = borne(etat.celebrite + 5);
      ecrire(`🏆 « ${e.nom} » devient ${suivante.nom} ${suivante.ico} ! Un nouveau palier pour la famille ${etat.nom}.`, "bon");
      rafraichirFeuille();
    }, !okEmp || !okVal);
  }

  /* --- équipe --- */
  section("Équipe ("+e.employes.length+")", false);
  if(!e.employes.length) carte(`<div class="detail">Aucun employé. Recrute ta famille, tes amis, ou des candidats externes ci-dessous.</div>`);
  for(const emp of e.employes){
    const r = emp.externe ? null : etat.relations.find(x=>x.nom===emp.nom);
    if(!emp.externe && !r) continue;
    const comp = emp.externe ? emp.competence : competence(r);
    const poste = POSTES.find(p=>p.nom===emp.poste) || POSTES[POSTES.length-1];
    const ok = comp >= poste.req;
    const fortEmp = emp.externe ? (emp.argent||0) : ((r && r.argent)||0);
    const cE = carte(`<div class="titre">${emp.nom} ${emp.externe?"":"<span class=\"badge\">👪 famille</span>"}</div>
      <div class="detail">${emp.poste} · ${euros(emp.salaire)}/an · Compétence ${comp}/100 ${ok?"✅":"⚠️ requis "+poste.req}${emp.salaire < comp*120 ? " · 😠 sous-payé·e" : ""} · ${emp.exp||0} an${(emp.exp||0)>1?"s":""} d'ancienneté<br>💰 Fortune personnelle : <b>${euros(fortEmp)}</b></div>`);
    const gE = grille(cE);
    btn(gE, "Augmenter +20 %", "", () => {
      emp.salaire = Math.round(emp.salaire*1.2);
      if(r){ r.salaire = emp.salaire; r.barre = borne(r.barre+8); }
      ecrire(`${emp.nom} est augmenté${(r?r.genre:emp.genre)==="F"?"e":""} : ${euros(emp.salaire)}/an.`, "argent");
      rafraichirFeuille();
    });
    btn(gE, "Baisser −20 %", "gris", () => {
      emp.salaire = Math.round(emp.salaire*0.8);
      if(r){ r.salaire = emp.salaire; r.barre = borne(r.barre-12); }
      ecrire(`Salaire de ${emp.nom} baissé à ${euros(emp.salaire)}/an.`, "mauvais");
      rafraichirFeuille();
    });
    btn(gE, "Former (2 000 €)", "or", () => {
      if(dejaFait("form_"+emp.nom)){ ecrire(`${emp.nom} a déjà été formé${(r?r.genre:emp.genre)==="F"?"e":""} cette année.`); return; }
      e.caisse -= 2000;
      const gain = 4+alea(5);
      if(emp.externe) emp.competence = Math.min(95, emp.competence+gain);
      else if(r) r.competence = Math.min(95, competence(r)+gain);
      if(r) r.barre = borne(r.barre+6);
      ecrire(`🎓 ${emp.nom} revient de formation (+${gain} de compétence).`, "bon");
      rafraichirFeuille();
    }, (e.caisse||0) < 2000);
    btn(gE, "Changer de poste", "gris", () => {
      fileEvenements.push({
        titre:"Nouveau poste pour "+emp.nom,
        texte:`Compétence : ${comp}/100.`,
        choix: POSTES.map(p => ({label:`${p.nom}${comp<p.req?" ⚠️ (requis "+p.req+")":""}`, effet(){
          emp.poste = p.nom; if(r) r.metier = p.nom+" — "+e.nom;
          ecrire(`${emp.nom} devient ${p.nom.toLowerCase()} chez « ${e.nom} ».`);
        }})).concat([{label:"Annuler", effet(){}}])
      });
      fermerFeuille(); prochaineModale();
    });
    btn(gE, "Licencier", "rouge", () => {
      e.employes = e.employes.filter(x=>x!==emp);
      if(r){ r.metier = null; r.salaire = 0; r.barre = borne(r.barre-20); }
      ecrire(`J'ai licencié ${emp.nom} de « ${e.nom} ».${r && (r.type==="conjoint"||r.type==="enfant") ? " Ça va barder à la maison…" : ""}`, "mauvais");
      rafraichirFeuille();
    });
  }

  /* --- recrutement --- */
  const candidats = etat.relations.filter(r =>
    r.vivant && r.age>=16 && !employeDe(r.nom) && !r.sdf &&
    ["ami","conjoint","enfant","frere","soeur"].includes(r.type));
  if(candidats.length){
    section("Recruter dans la famille", false);
    for(const r of candidats){
      const comp = competence(r);
      const cR = carte(`<div class="titre">${r.nom}</div>
        <div class="detail">${LIBELLE_REL[r.type]} · ${r.age} ans · Compétence <b>${comp}/100</b>${r.metier?" · déjà : "+r.metier:""}</div>
        <div class="actions"></div>`);
      action(cR, "Recruter", "", () => {
        fileEvenements.push({
          titre:"Recruter "+r.nom,
          texte:`Compétence : ${comp}/100. Un poste au-dessus de son niveau produira moitié moins.`,
          choix: POSTES.map(p => ({label:`${p.nom}${comp<p.req?" ⚠️ (requis "+p.req+")":""}`, effet(){
            fileEvenements.unshift({
              titre:"Salaire de "+r.nom,
              texte:`Poste : ${p.nom}. Trésorerie : ${euros(e.caisse||0)}. En dessous de ${euros(comp*120)}, ${r.genre==="F"?"elle":"il"} risque de démissionner.`,
              choix: SALAIRES_PROPOSES.map(s => ({label: euros(s)+"/an", effet(){
                e.employes.push({nom:r.nom, poste:p.nom, salaire:s, exp:0});
                r.metier = p.nom+" — "+e.nom; r.salaire = s; r.barre = borne(r.barre+10);
                ecrire(`J'ai recruté ${r.nom} comme ${p.nom.toLowerCase()} chez « ${e.nom} » à ${euros(s)}/an.`, "bon");
              }})).concat([{label:"Annuler", effet(){}}])
            });
          }})).concat([{label:"Annuler", effet(){}}])
        });
        fermerFeuille(); prochaineModale();
      });
    }
  }
  const cands = candidatsDuJour();
  if(cands.length){
    section("Candidatures reçues", false);
    for(const cand of cands){
      const rabais = Math.round(cand.pretention*0.8/100)*100;
      const cC = carte(`<div class="titre">${cand.nom}</div>
        <div class="detail">${cand.age} ans · Compétence <b>${cand.competence}/100</b> · Demande ${euros(cand.pretention)}/an</div>
        <div class="actions"></div>`);
      action(cC, "Embaucher", "", () => {
        fileEvenements.push({
          titre:"Embaucher "+cand.nom,
          texte:`Compétence : ${cand.competence}/100 · Prétention : ${euros(cand.pretention)}/an.`,
          choix: POSTES.map(p => ({label:`${p.nom}${cand.competence<p.req?" ⚠️ (requis "+p.req+")":""}`, effet(){
            fileEvenements.unshift({
              titre:"Négociation avec "+cand.nom,
              texte:`Poste : ${p.nom}. Trésorerie : ${euros(e.caisse||0)}.`,
              choix:[
                {label:"Accepter ("+euros(cand.pretention)+"/an)", effet(){
                  e.employes.push({nom:cand.nom, genre:cand.genre, poste:p.nom, salaire:cand.pretention, competence:cand.competence, externe:true, exp:0});
                  etat.candidats.liste = etat.candidats.liste.filter(x=>x!==cand);
                  ecrire(`${cand.nom} rejoint « ${e.nom} » comme ${p.nom.toLowerCase()} à ${euros(cand.pretention)}/an.`, "bon");
                }},
                {label:"Négocier à "+euros(rabais)+" (risqué)", effet(){
                  etat.candidats.liste = etat.candidats.liste.filter(x=>x!==cand);
                  if(alea(2)){
                    e.employes.push({nom:cand.nom, genre:cand.genre, poste:p.nom, salaire:rabais, competence:cand.competence, externe:true, exp:0});
                    ecrire(`Bien négocié : ${cand.nom} accepte ${euros(rabais)}/an chez « ${e.nom} ».`, "bon");
                  } else ecrire(`${cand.nom} a refusé mon offre au rabais.`, "mauvais");
                }},
                {label:"Annuler", effet(){}}
              ]
            });
          }})).concat([{label:"Annuler", effet(){}}])
        });
        fermerFeuille(); prochaineModale();
      });
    }
  }

  /* --- réseau d'affaires --- */
  section("Réseau d'affaires", false);
  const cr = carte(`<div class="detail">Les affaires se font aussi au déjeuner. Rencontrer les patrons de la place ouvre des contrats, des partenariats… et parfois plus.</div>`);
  const gr = grille(cr);
  btn(gr, "Déjeuner d'affaires (2 000 €)", "gris", () => {
    if(dejaFait("reseau")){ ecrire("J'ai déjà fait le tour des tables cette année."); return; }
    etat.argent -= 2000;
    const patron = parmi(PATRONS);
    const g = alea(2)?"F":"M";
    const nom = parmi(g==="F"?PRENOMS_F:PRENOMS_M)+" "+parmi(NOMS);
    if(alea(100) < 45 + charisme()/4 + e.reputation/4){
      const type = alea(3);
      if(type===0){
        const contrat = 8000+alea(30000);
        e.caisse += contrat;
        ecrire(`🤝 Déjeuner avec ${nom}, ${patron.toLowerCase()} : ${e.genre||""}nous signons un contrat de ${euros(contrat)} pour « ${e.nom} ».`.replace("undefined","").replace(": nous",": nous"), "argent");
      } else if(type===1){
        e.reputation = borne(e.reputation+8); e.valeur += 10000;
        ecrire(`🤝 Partenariat scellé avec ${nom} (${patron.toLowerCase()}) : « ${e.nom} » gagne en réputation et en valeur.`, "bon");
      } else {
        etat.compPro = borne((etat.compPro||0)+4);
        ecrire(`🤝 Longue discussion avec ${nom}, ${patron.toLowerCase()}. ${g==="F"?"Elle":"Il"} m'a transmis de vrais conseils de gestion.`, "bon");
      }
      if(!etat.relations.some(r=>r.vivant && (r.type==="conjoint"||r.type==="partenaire")) && etat.age>=20 && alea(3)===0){
        const pr = rel("partenaire", nom, Math.max(22, etat.age+alea(9)-4), g);
        pr.metier = patron; pr.salaire = 60000+alea(60000); pr.competence = 70+alea(26);
        etat.relations.push(pr);
        ecrire(`💘 Entre deux dossiers, le courant est passé avec ${nom}. Nous nous revoyons — hors travail cette fois.`, "bon");
      }
    } else ecrire(`Déjeuner d'affaires poli mais sans suite avec ${nom}. 2 000 € et deux heures perdues.`);
    rafraichirFeuille();
  }, etat.argent < 2000);
  btn(gr, "Racheter un concurrent (" + euros(Math.round(e.valeur*0.6)) + ")", "or", () => {
    const prix = Math.round(e.valeur*0.6);
    if((e.caisse||0) < prix){ ecrire("La trésorerie ne suffit pas pour racheter un concurrent.", "mauvais"); return; }
    e.caisse -= prix;
    e.valeur += Math.round(prix*1.05); e.reputation = borne(e.reputation+5); e.stock = Math.min(100, e.stock+15);
    ecrire(`🏢 « ${e.nom} » rachète un concurrent pour ${euros(prix)} : parts de marché, stock et clients récupérés.`, "argent");
    rafraichirFeuille();
  }, (e.caisse||0) < Math.round(e.valeur*0.6));

  /* --- vendre --- */
  section("Sortie", false);
  const cv = carte(`<div class="detail">Vendre l'entreprise te rapporte 85 % de sa valorisation plus la trésorerie, moins les dettes. Tes employés sont remerciés.</div><div class="actions"></div>`);
  action(cv, `Vendre (${euros(Math.round(e.valeur*0.85) + Math.max(0,e.caisse||0) - (e.dette||0))})`, "rouge", () => {
    const v = Math.round(e.valeur*0.85) + Math.max(0, e.caisse||0) - (e.dette||0);
    libererEmployes(e);
    etat.argent += v;
    ecrire(`J'ai vendu « ${e.nom} » pour ${euros(v)}.`, "argent");
    etat.entreprises = etat.entreprises.filter(x=>x!==e);
    ouvrirFeuille("travail");
  });
}

/* ----- pays : état de la nation, classement, politique & royaume ----- */

function feuillePays(){

  carte(`<div class="titre">🌍 ${etat.pays}</div>
    <div class="pays-stat"><label>Développement</label><div class="jauge"><i style="width:${p.dev}%;background:var(--intel)"></i></div><b>${p.dev}</b></div>
    <div class="pays-stat"><label>Économie</label><div class="jauge"><i style="width:${p.eco}%;background:var(--accent)"></i></div><b>${p.eco}</b></div>
    <div class="pays-stat"><label>Éducation</label><div class="jauge"><i style="width:${p.edu||50}%;background:var(--look)"></i></div><b>${p.edu||50}</b></div>
    <div class="pays-stat"><label>Moral du peuple</label><div class="jauge"><i style="width:${p.peuple||50}%;background:var(--bonheur)"></i></div><b>${p.peuple||50}</b></div>

  const rangs = Object.keys(etat.monde).map(n => ({n, s: scorePays(etat.monde[n])})).sort((a,b)=>b.s-a.s);
  const medailles = ["🥇","🥈","🥉","4ᵉ","5ᵉ","6ᵉ"];
  carte(`<div class="titre">🏆 Classement régional des pays</div>
    <div class="detail">Score = développement + économie + éducation − corruption.</div>` +
    rangs.map((r,i)=>`<div class="pays-stat"><label>${medailles[i]||i+1+"ᵉ"} ${r.n}${r.n===etat.pays?" ⭐":""}</label>
      <div class="jauge"><i style="width:${Math.max(4,Math.min(100,Math.round(r.s/2.6)))}%;background:${r.n===etat.pays?"var(--accent)":"var(--line)"}"></i></div><b>${r.s}</b></div>`).join(""));

  if(etat.age>=18){
    const cI = carte(`<div class="titre">🏗️ Construire pour mon pays</div>
      <div class="detail">Investis ta fortune personnelle dans le développement du pays. Le peuple s'en souvient${etat.politique?" (et les électeurs aussi)":""}${etat.royaume?" (le prestige de la couronne grandit)":""}.</div>
      <div class="actions"></div>`);
    action(cI, "École (10 000 €)", "", () => {
      if(dejaFait("investEcole")){ ecrire("L'école financée cette année est déjà en chantier."); fermerFeuille(); return; }
      etat.argent -= 10000;
      p.edu = Math.min(95,(p.edu||50)+2); p.peuple = Math.min(95,(p.peuple||50)+1);
      etat.bonheur = borne(etat.bonheur+5); etat.karma = borne((etat.karma||60)+6); etat.constructions = (etat.constructions||0)+1;
      if(etat.politique) etat.politique.pop = borne(etat.politique.pop+6);
      if(etat.royaume) etat.royaume.prestige = borne(etat.royaume.prestige+4);
      ecrire(`J'ai financé la construction d'une école (10 000 €). L'éducation du pays progresse.`, "bon");
      fermerFeuille();
    }, etat.argent < 10000);
    action(cI, "Dispensaire (15 000 €)", "", () => {
      if(dejaFait("investDisp")){ ecrire("Le dispensaire de cette année est déjà en construction."); fermerFeuille(); return; }
      etat.argent -= 15000;
      p.dev = Math.min(95,p.dev+2); p.peuple = Math.min(95,(p.peuple||50)+2);
      etat.bonheur = borne(etat.bonheur+5); etat.karma = borne((etat.karma||60)+7); etat.constructions = (etat.constructions||0)+1;
      if(etat.politique) etat.politique.pop = borne(etat.politique.pop+7);
      if(etat.royaume) etat.royaume.prestige = borne(etat.royaume.prestige+5);
      ecrire(`J'ai financé un dispensaire (15 000 €). Les familles du quartier me bénissent.`, "bon");
      fermerFeuille();
    }, etat.argent < 15000);
    action(cI, "Centre numérique & IA (25 000 €)", "or", () => {
      if(dejaFait("investIA")){ ecrire("Le centre numérique financé cette année sort déjà de terre."); fermerFeuille(); return; }
      etat.argent -= 25000;
      p.edu = Math.min(95,(p.edu||50)+3); p.eco = Math.min(95,p.eco+2);
      etat.intel = borne(etat.intel+2); etat.bonheur = borne(etat.bonheur+5); etat.karma = borne((etat.karma||60)+8); etat.constructions = (etat.constructions||0)+1;
      if(etat.politique) etat.politique.pop = borne(etat.politique.pop+8);
      if(etat.royaume) etat.royaume.prestige = borne(etat.royaume.prestige+6);
      ecrire(`J'ai financé un centre de formation numérique & IA (25 000 €). La jeunesse code, le pays avance.`, "bon");
      fermerFeuille();
    }, etat.argent < 25000);
  }

  /* --- politique & royaume --- */
  section("Politique & Royaume");
  if(etat.prison>0){
    carte(`<div class="titre">🔒 En prison</div><div class="detail">Pas de politique depuis une cellule.</div>`);
  } else if(etat.royaume){
    const R = etat.royaume;
    const c = carte(`<div class="titre">👑 ${R.nom}</div>
      <div class="detail">${etat.age>=18 ? (etat.genre==="F"?"Reine":"Roi")+" depuis "+R.annees+" an"+(R.annees>1?"s":"") : "Sous régence jusqu'à tes 18 ans"} ·
        ${R.sujets.toLocaleString("fr-FR")} sujets · Trésor royal : ${euros(R.tresor)}</div>
      <div class="pays-stat"><label>Prestige</label><div class="jauge"><i style="width:${R.prestige}%;background:var(--celeb)"></i></div><b>${R.prestige}</b></div>
      <div class="detail" style="margin-top:6px">Chaque année : le trésor encaisse les impôts, la couronne touche sa liste civile, et tu prends les grandes décisions du royaume. Le trône se transmet à tes héritiers. Si le prestige s'effondre, gare à la révolution…</div>
      <div class="actions"></div>`);
    if(etat.age>=18){
      action(c, "Don au peuple (5 000 €)", "", () => {
        if(dejaFait("donpeuple")){ ecrire("J'ai déjà fait une largesse royale cette année."); fermerFeuille(); return; }
        etat.argent -= 5000; R.prestige = borne(R.prestige+4);
        ecrire("Largesse royale : vivres et étoffes distribués au peuple. Mon prestige grandit.", "bon");
        fermerFeuille();
      }, etat.argent<5000);
      action(c, "Puiser dans le trésor (20 000 €)", "gris", () => {
        if(dejaFait("puiser")){ ecrire("Le chambellan refuse d'ouvrir le trésor deux fois la même année."); fermerFeuille(); return; }
        const g = Math.min(R.tresor, 20000);
        R.tresor -= g; etat.argent += g; R.prestige = borne(R.prestige-3);
        ecrire(`J'ai puisé ${euros(g)} dans le trésor royal pour mes dépenses personnelles.`, "argent");
        fermerFeuille();
      }, R.tresor<=0);
      action(c, "Abdiquer", "rouge", () => {
        ecrire(`J'abdique. ${R.nom} redevient une république et la couronne entre dans l'histoire.`, "mauvais");
        etat.royaume = null; fermerFeuille();
      });
    }
  } else if(!etat.politique){
    if(etat.age>=18){
      const c = carte(`<div class="titre">🏛️ Entrer en politique</div>
        <div class="detail">Adhère à un parti et gravis les échelons : maire, député, ministre… jusqu'à la présidence de ${etat.pays}.</div>
        <div class="actions"></div>`);
      action(c, "Adhérer à un parti", "", () => {
        etat.politique = {niveau:0, pop: borne(15 + charisme()/3), annees:0, anneesMandat:0};
        ecrire(`Je m'engage en politique : me voilà militant${etat.genre==="F"?"e":""} de parti.`, "bon");
        fermerFeuille();
      });
    } else {
      carte(`<div class="detail">La politique sera accessible à 18 ans.</div>`);
    }
  } else {
    const P = etat.politique;
    const c = carte(`<div class="titre">🏛️ ${NIVEAUX_POL[P.niveau]}${P.niveau>0?" — "+(P.niveau===1?etat.ville:etat.pays):""}</div>
      <div class="detail">Popularité : ${P.pop}/100 · Charisme : ${charisme()}/100 · ${P.annees} an${P.annees>1?"s":""} en politique</div>
      <div class="mini-jauge"><i style="width:${P.pop}%"></i></div>
      <div class="actions"></div>`);
    action(c, "Meeting de campagne (500 €)", "gris", () => {
      if(dejaFait("meeting")){ ecrire("J'ai déjà fait le tour des places publiques cette année."); fermerFeuille(); return; }
      etat.argent -= 500;
      P.pop = borne(P.pop + 3 + Math.round(charisme()/25));
      ecrire("Grand meeting : les militants sont chauds, ma popularité grimpe.", "bon");
      fermerFeuille();
    }, etat.argent<500);
    action(c, "Don caritatif (1 000 €)", "gris", () => {
      if(dejaFait("don")){ ecrire("Déjà fait un grand don cette année."); fermerFeuille(); return; }
      etat.argent -= 1000;
      P.pop = borne(P.pop+4); etat.bonheur = borne(etat.bonheur+4);
      ecrire("Don aux orphelinats et aux écoles : le geste est remarqué.", "bon");
      fermerFeuille();
    }, etat.argent<1000);

    if(P.niveau===0){
      action(c, "Municipales (2 000 €)", "", () => {
        etat.argent -= 2000;
        if(alea(100) < 25 + P.pop/2 + charisme()/5){
          P.niveau=1; etat.emploi={titre:"Maire de "+etat.ville, salaire:SALAIRES_POL[1], annees:0, politique:true};
          ecrire(`ÉLU·E maire de ${etat.ville} ! Indemnité : ${euros(SALAIRES_POL[1])}/an.`, "bon");
          P.pop = borne(P.pop+10);
        } else { P.pop=borne(P.pop-5); ecrire("Défaite aux municipales. Il faudra retravailler le terrain.", "mauvais"); }
        fermerFeuille();
      }, etat.argent<2000);
    }
    if(P.niveau===1){
      action(c, "Législatives (5 000 €)", "", () => {
        etat.argent -= 5000;
        if(alea(100) < 15 + P.pop/2 + charisme()/6){
          P.niveau=2; etat.emploi={titre:"Député", salaire:SALAIRES_POL[2], annees:0, politique:true};
          ecrire("ÉLU·E député ! Direction l'Assemblée nationale.", "bon");
          P.pop = borne(P.pop+8);
        } else { P.pop=borne(P.pop-5); ecrire("Battu·e aux législatives. Je reste maire.", "mauvais"); }
        fermerFeuille();
      }, etat.argent<5000);
    }
    if(P.niveau===2){
      action(c, "Briguer un ministère", "", () => {
        if(dejaFait("ministere")){ ecrire("Le président ne me recevra pas deux fois la même année."); fermerFeuille(); return; }
        if(P.pop>=50 && alea(3)>0){
          P.niveau=3; etat.emploi={titre:"Ministre", salaire:SALAIRES_POL[3], annees:0, politique:true};
          ecrire("Nommé·e MINISTRE ! J'entre au gouvernement.", "bon");
        } else ecrire("Pas de maroquin cette fois : il faut plus de popularité (50+).", "mauvais");
        fermerFeuille();
      });
    }
    if(P.niveau===4){
      action(c, "🏛️ Gouverner (budget national) ›", "", () => ouvrirFeuille("gouvernement", null, "pays"));
      const okPop = P.pop>=75, okAns = P.annees>=15, okArg = etat.argent>=500000, okPeuple = (p.peuple||50)>=60;
      const cM = carte(`<div class="titre">👑 Proclamer la monarchie</div>
        <div class="ligne-info"><span>Popularité ≥ 75</span><b>${okPop?"✅":"❌"} ${P.pop}</b></div>
        <div class="ligne-info"><span>15 ans de carrière politique</span><b>${okAns?"✅":"❌"} ${P.annees}</b></div>
        <div class="ligne-info"><span>Peuple acquis ≥ 60</span><b>${okPeuple?"✅":"❌"} ${p.peuple||50}</b></div>
        <div class="ligne-info"><span>Fortune personnelle ≥ 500 000 €</span><b>${okArg?"✅":"❌"} ${euros(etat.argent)}</b></div>
        <div class="detail" style="margin-top:6px">Renverser la république pour te couronner est le pari d'une vie. En cas d'échec : destitution et longue prison.</div>
        <div class="actions"></div>`);
      action(cM, "Tenter le coup", "rouge", () => {
        if(alea(100) < P.pop*0.7){
          etat.royaume = {nom:"Royaume "+etat.nom, tresor:150000, prestige:55, sujets:250000+alea(400000), annees:0};
          etat.politique = null; etat.emploi = null;
          ecrire(`👑 COUP DE TONNERRE : j'ai proclamé la monarchie ! ${etat.pays} devient le ${etat.royaume.nom}, et moi ${etat.genre==="F"?"sa première Reine":"son premier Roi"}. La couronne se transmettra à mes héritiers.`, "bon");
        } else {
          etat.prison = 4+alea(4); etat.politique = null; etat.emploi = null;
          etat.bonheur = borne(etat.bonheur-30);
          ecrire(`Coup de force raté : l'armée refuse de suivre. Destitution et ${etat.prison} ans de prison.`, "mauvais");
        }
        fermerFeuille();
      }, !okPop || !okAns || !okArg || !okPeuple);
    }
    if(P.niveau===3){
      action(c, "Présidentielle (20 000 €)", "or", () => {
        etat.argent -= 20000;
        if(alea(100) < P.pop*0.8 + charisme()/8){
          P.niveau=4; P.anneesMandat=0;
          etat.emploi={titre:"Président·e de "+etat.pays, salaire:SALAIRES_POL[4], annees:0, politique:true};
          ecrire(`🎉 ÉLU·E PRÉSIDENT·E de ${etat.pays} ! Le destin du pays est entre mes mains.`, "bon");
          P.pop = borne(P.pop+10);
        } else { P.pop=borne(P.pop-8); ecrire("Défaite à la présidentielle. Le suffrage est cruel.", "mauvais"); }
        fermerFeuille();
      }, etat.argent<20000);
    }
    action(c, "Quitter la politique", "rouge", () => {
      ecrire("Je me retire de la vie politique.");
      etat.politique = null;
      if(etat.emploi && etat.emploi.politique) etat.emploi = null;
      fermerFeuille();
    });
  }

  // fonder un royaume par la fortune : acheter une île (très exigeant)
  if(!etat.royaume && etat.age>=25 && etat.prison<=0){
    const PRIX_ILE = 2000000;
    const patri = valeurPatrimoine();
    const okArg = etat.argent >= PRIX_ILE;
    const okPat = patri >= 1000000;
    const okCeleb = etat.celebrite >= 40;
    const okEnt = (etat.entreprises||[]).some(x => (x.taille||0) >= 2);
    const c = carte(`<div class="titre">🏝️ Fonder ton propre royaume</div>
      <div class="ligne-info"><span>Liquidités ≥ 2 000 000 €</span><b>${okArg?"✅":"❌"} ${euros(etat.argent)}</b></div>
      <div class="ligne-info"><span>Patrimoine ≥ 1 000 000 €</span><b>${okPat?"✅":"❌"} ${euros(patri)}</b></div>
      <div class="ligne-info"><span>Célébrité ≥ 40</span><b>${okCeleb?"✅":"❌"} ${etat.celebrite}</b></div>
      <div class="ligne-info"><span>Diriger au moins un Groupe</span><b>${okEnt?"✅":"❌"}</b></div>
      <div class="detail" style="margin-top:6px">Acheter une île souveraine et s'y faire couronner : il faut une fortune colossale, un nom connu et un empire économique derrière soi.</div>
      <div class="actions"></div>`);
    action(c, "Acheter l'île et me couronner", "or", () => {
      etat.argent -= PRIX_ILE;
      etat.royaume = {nom:"Royaume "+etat.nom, tresor:80000, prestige:45, sujets:8000+alea(20000), annees:0};
      if(etat.politique){ etat.politique = null; if(etat.emploi && etat.emploi.politique) etat.emploi = null; }
      ecrire(`🏝️👑 J'ai acheté une île souveraine et proclamé le ${etat.royaume.nom} ! ${etat.royaume.sujets.toLocaleString("fr-FR")} sujets vivent désormais sous ma couronne.`, "bon");
      fermerFeuille();
    }, !okArg || !okPat || !okCeleb || !okEnt);
  }
}

/* ----- actifs : patrimoine, immobilier, véhicules ----- */

function feuilleActifs(){
  const patrimoine = valeurPatrimoine();
  carte(`<div class="titre">Patrimoine — Génération ${etat.generation}</div>
    <div class="detail">Banque : ${euros(etat.argent)} · Biens et entreprise : ${euros(patrimoine)} · Total : <b>${euros(etat.argent+patrimoine)}</b><br>
    À ta mort, la succession (moins ${Math.round(diff().frais*100)} % de frais) sera partagée entre tes enfants.</div>`);

  section("Mes biens");
  if(!etat.biens.length) carte(`<div class="detail">Aucun bien pour l'instant.</div>`);
  for(const b of etat.biens){
    const estImmo = b.type==="immobilier";
    const c = carte(`<div class="titre">${b.ico} ${b.nom}${b.loue?" · 🔑 En location":""}</div>
      <div class="detail">Valeur actuelle : ${euros(b.valeur)}${estImmo? " · Entretien 1 %/an" + (b.loue? " · Loyer ≈ "+euros(Math.round(b.valeur*0.05))+"/an brut" : "") : ""}</div>
      <div class="actions"></div>`);
    if(estImmo){
      action(c, b.loue ? "Reprendre le logement" : "Mettre en location", b.loue?"gris":"", () => {
        b.loue = !b.loue;
        ecrire(b.loue ? `J'ai mis ${b.nom.toLowerCase()} en location (≈ 5 % de rendement).` : `J'ai repris ${b.nom.toLowerCase()} pour y habiter.`);
        fermerFeuille();
      });
    }
    action(c, "Vendre ("+euros(Math.round(b.valeur*0.85))+")", "gris", () => {
      etat.argent += Math.round(b.valeur*0.85);
      ecrire(`J'ai vendu ${b.nom.toLowerCase()} pour ${euros(Math.round(b.valeur*0.85))}.`, "argent");
      etat.biens = etat.biens.filter(x=>x!==b);
      fermerFeuille();
    });
  }

  if(etat.age>=18){
    section("📈 Placements", false);
    const pf = etat.placements || (etat.placements = {});
    const totalPl = Object.values(pf).reduce((a,b) => a + (b.montant||0), 0);
    carte(`<div class="detail">Portefeuille total : <b>${euros(totalPl)}</b>. Les cours évoluent chaque année : investis ce que tu peux laisser dormir.</div>`);
    for(const def of PLACEMENTS){
      const pos = pf[def.cle] || {montant:0, investi:0};
      const pv = pos.montant - pos.investi;
      const c = carte(`<div class="titre">${def.ico} ${def.nom}</div>
        <div class="detail">${def.desc}<br>Volatilité ${def.vol} % · tendance +${def.tend} %/an · minimum ${euros(def.min)}
        ${pos.montant ? `<br>Position : <b>${euros(pos.montant)}</b> · investi ${euros(pos.investi)} · <b style="color:${pv>=0?"var(--accent)":"var(--danger)"}">${pv>=0?"+":""}${euros(pv)}</b>` : ""}</div>
        <div class="actions"></div>`);
      for(const m of [def.min, def.min*5, def.min*20]){
        action(c, "Investir " + euros(m), "gris", () => {
          etat.argent -= m;
          pf[def.cle] = {montant: (pos.montant||0) + m, investi: (pos.investi||0) + m};
          ecrire(`${def.ico} J'ai placé ${euros(m)} en ${def.nom.toLowerCase()}.`, "argent");
          fermerFeuille();
        }, etat.argent < m);
      }
      if(pos.montant > 0){
        action(c, "Tout vendre (" + euros(pos.montant) + ")", "or", () => {
          etat.argent += pos.montant;
          const gain = pos.montant - pos.investi;
          if(def.cle === "crypto" && gain > 0){
            etat.gainCrypto = (etat.gainCrypto||0) + gain;
            if(etat.gainCrypto >= 100000) debloquer("crypto");
          }
          ecrire(`${def.ico} J'ai soldé ma position en ${def.nom.toLowerCase()} : ${euros(pos.montant)} récupérés (${gain>=0?"+":""}${euros(gain)}).`,
                 gain>=0 ? "argent" : "mauvais");
          delete pf[def.cle];
          fermerFeuille();
        });
      }
    }
    section("Acheter — Immobilier", false);
    for(const m of IMMOBILIER){
      if(etat.biens.some(x=>x.nom===m.nom)) continue;
      const c = carte(`<div class="titre">${m.ico} ${m.nom}</div><div class="detail">Prix : ${euros(m.prix)} · Peut être habité ou mis en location.</div><div class="actions"></div>`);
      action(c, "Acheter", "", () => {
        etat.argent -= m.prix;
        etat.biens.push({nom:m.nom, ico:m.ico, valeur:m.prix, type:"immobilier", loue:false});
        etat.bonheur = borne(etat.bonheur+8);
        ecrire(`Achat immobilier : ${m.nom.toLowerCase()} pour ${euros(m.prix)}. ${m.ico}`, "argent");
        fermerFeuille();
      }, etat.argent < m.prix);
    }
    section("Acheter — Véhicules & bateaux", false);
    for(const v of VEHICULES){
      if(etat.biens.some(x=>x.nom===v.nom)) continue;
      const c = carte(`<div class="titre">${v.ico} ${v.nom}</div><div class="detail">Prix : ${euros(v.prix)}</div><div class="actions"></div>`);
      action(c, "Acheter", "", () => {
        etat.argent -= v.prix;
        etat.biens.push({nom:v.nom, ico:v.ico, valeur:Math.round(v.prix*0.9), type:"vehicule"});
        etat.bonheur = borne(etat.bonheur+6);
        ecrire(`Nouvel achat : ${v.nom.toLowerCase()} pour ${euros(v.prix)}. ${v.ico}`, "argent");
        fermerFeuille();
      }, etat.argent < v.prix);
    }
  } else {
    carte(`<div class="detail">Les achats seront possibles à 18 ans.</div>`);
  }
}

/* ===================== ÉCRAN DÉDIÉ : GOUVERNEMENT ===================== */

function feuilleGouvernement(){
  const p = pays(), G = normaliserGouv(p), P = etat.politique;
  const budget = budgetNational(p);
  const somme = G.edu+G.sante+G.infra+G.ia+G.secu+G.fonction;
  const part = x => Math.round(x/somme*100);
  const mt = x => euros(Math.round(budget * x/somme));

  carte(`<div class="titre">🏛️ République de ${etat.pays}</div>
    <div class="kpis">
      <div class="kpi"><span>Budget annuel</span><b class="or">${euros(budget)}</b></div>
      <div class="kpi"><span>Popularité</span><b class="${P.pop>=50?"pos":"neg"}">${P.pop}/100</b></div>
      <div class="kpi"><span>Mandat</span><b>an ${P.anneesMandat}/5</b></div>
    </div>
    <div class="kpis">
      <div class="kpi"><span>Développement</span><b>${p.dev}</b></div>
      <div class="kpi"><span>Économie</span><b>${p.eco}</b></div>
      <div class="kpi"><span>Éducation</span><b>${p.edu||50}</b></div>
    </div>
    <div class="kpis">
      <div class="kpi"><span>Peuple</span><b class="${(p.peuple||50)>=50?"pos":"neg"}">${p.peuple||50}</b></div>
      <div class="kpi"><span>Corruption</span><b class="${p.corr>=50?"neg":"pos"}">${p.corr}</b></div>
      <div class="kpi"><span>Impôts</span><b>${Math.round(tauxImpot()*100)} %</b></div>
    </div>`);

  section("Répartition du budget");
  const postes = [
    ["edu", "🏫 Éducation"], ["sante", "🏥 Santé"], ["infra", "🛣️ Infrastructures"],
    ["ia", "🤖 IA & numérique"], ["secu", "🛡️ Sécurité & justice"], ["fonction", "🏢 Fonction publique"],
  ];
  for(const [cle, lib] of postes){
    const c = carte(`<div class="ligne-info"><span>${lib}</span><b>${part(G[cle])} % · ${mt(G[cle])}</b></div>
      <div class="mini-jauge"><i style="width:${part(G[cle])*2}%"></i></div>
      <div class="actions"></div>`);
    action(c, "− 5", "gris", () => { G[cle] = Math.max(0, G[cle]-5); rafraichirFeuille(); }, G[cle]<=0);
    action(c, "+ 5", "", () => { G[cle] += 5; rafraichirFeuille(); });
  }
  carte(`<div class="detail">Les parts sont relatives : augmenter un poste réduit mécaniquement la part des autres. Les effets s'appliquent chaque année à ton pays.</div>`);

  section("Grands leviers de l'État", false);
  const cSmic = carte(`<div class="ligne-info"><span>💵 Salaire minimum</span><b>${euros(G.smic)}/mois</b></div>
    <div class="detail">Un SMIC élevé rend le peuple heureux mais freine l'économie. Trop bas : colère sociale.</div>
    <div class="actions"></div>`);
  action(cSmic, "− 50 €", "gris", () => { G.smic = Math.max(50, G.smic-50); rafraichirFeuille(); });
  action(cSmic, "+ 50 €", "", () => { G.smic += 50; rafraichirFeuille(); });

  const NIV_MIN = ["Très bas","Bas","Correct","Élevé","Somptueux"];
  const cMin = carte(`<div class="ligne-info"><span>👔 Salaires des ministres</span><b>${NIV_MIN[G.salMinistres]}</b></div>
    <div class="detail">Payer très mal ses ministres nourrit la corruption ; les payer comme des rois indigne le peuple.</div>
    <div class="actions"></div>`);
  action(cMin, "Réduire", "gris", () => { G.salMinistres = Math.max(0, G.salMinistres-1); rafraichirFeuille(); }, G.salMinistres<=0);
  action(cMin, "Augmenter", "", () => { G.salMinistres = Math.min(4, G.salMinistres+1); rafraichirFeuille(); }, G.salMinistres>=4);

  const cImp = carte(`<div class="ligne-info"><span>🧾 Pression fiscale</span><b>${Math.round(tauxImpot()*100)} %</b></div>
    <div class="detail">Tu paies aussi ces impôts sur tes propres revenus et ceux de tes entreprises.</div>
    <div class="actions"></div>`);
  action(cImp, "Baisser (−3 pts)", "gris", () => { G.impot = (G.impot||0)-3; p.eco = Math.min(95,p.eco+1); rafraichirFeuille(); });
  action(cImp, "Augmenter (+3 pts)", "", () => { G.impot = (G.impot||0)+3; p.peuple = Math.max(5,(p.peuple||50)-2); rafraichirFeuille(); });

  section("Grands projets nationaux", false);
  const projets = [
    ["🏗️ Nouveau port en eau profonde", 2, ()=>{ p.eco=Math.min(95,p.eco+6); p.dev=Math.min(95,p.dev+3); ecrire("Inauguration du nouveau port en eau profonde : les porte-conteneurs accostent enfin chez nous.", "bon"); }],
    ["🎓 Université nationale", 2, ()=>{ p.edu=Math.min(95,(p.edu||50)+7); p.dev=Math.min(95,p.dev+2); ecrire("L'université nationale ouvre ses portes : notre jeunesse n'aura plus à partir pour étudier.", "bon"); }],
    ["🤖 Institut national d'IA", 3, ()=>{ p.edu=Math.min(95,(p.edu||50)+5); p.eco=Math.min(95,p.eco+6); ecrire("L'Institut national d'intelligence artificielle est né : nos ingénieurs forment le pays au futur.", "bon"); }],
    ["☀️ Centrale solaire nationale", 2, ()=>{ p.eco=Math.min(95,p.eco+5); p.dev=Math.min(95,p.dev+4); ecrire("La centrale solaire nationale met fin aux coupures d'électricité. Historique.", "bon"); }],
    ["🏥 Hôpital central moderne", 2, ()=>{ p.dev=Math.min(95,p.dev+5); p.peuple=Math.min(95,(p.peuple||50)+6); ecrire("Le nouvel hôpital central sauve des vies dès sa première semaine.", "bon"); }],
  ];
  for(const [lib, cout, effet] of projets){
    const prix = budget*cout;
    const c = carte(`<div class="titre">${lib}</div>
      <div class="detail">Coût : ${euros(prix)} (${cout} ans de budget). Un grand projet par mandat.</div>
      <div class="actions"></div>`);
    action(c, "Lancer le chantier", "or", () => {
      if(dejaFait("projet")){ ecrire("Un seul grand chantier par an : les caisses ne suivraient pas."); return; }
      p.peuple = Math.min(95,(p.peuple||50)+3);
      P.pop = borne(P.pop+6);
      effet();
      rafraichirFeuille();
    });
  }

  section("Sous la table", false);
  const cCorr = carte(`<div class="detail">Le pouvoir ouvre des portes… et des tiroirs. Plus le pays est corrompu, plus le risque d'être pris est faible — mais la chute serait terrible.</div><div class="actions"></div>`);
  action(cCorr, "Détourner des fonds", "rouge", () => {
    if(dejaFait("detour")){ ecrire("Deux fois la même année ? Même le trésorier trouverait ça gros."); return; }
    const detour = Math.round(budget*0.03) + alea(50000);
    etat.argent += detour;
    p.corr = Math.min(95, p.corr+7);
    p.peuple = Math.max(5,(p.peuple||50)-4);
    P.pop = borne(P.pop-4);
    ecrire(`J'ai détourné ${euros(detour)} du budget de l'État…`, "argent");
    if(alea(100) < (100-p.corr)/1.6){
      etat.prison = 3+alea(5);
      etat.politique = null; etat.emploi = null;
      etat.bonheur = borne(etat.bonheur-30);
      ecrire(`SCANDALE D'ÉTAT ! Le détournement éclate au grand jour : destitution et ${etat.prison} ans de prison.`, "mauvais");
      fermerFeuille();
    } else rafraichirFeuille();
  });
}

/* ----- relations ----- */
const LIBELLE_REL ={mere:"Mère", pere:"Père", frere:"Frère", soeur:"Sœur", ami:"Ami(e)", partenaire:"Partenaire", conjoint:"Époux/Épouse", enfant:"Enfant"};

function fortuneDe(r){
  let v = r.argent || 0;
  if(r.entreprise) v += Math.round(r.entreprise.valeur * 0.9);
  return v;
}

function feuilleRelations(){
  /* --- classement des fortunes de tout le monde --- */
  section("💰 Fortunes du clan");
  const gens = [{nom: etat.prenom+" "+etat.nom, det:"Moi", moi:true,
                 f: etat.argent + valeurPatrimoine(),
                 sit: (etat.entreprises||[]).length
                      ? (etat.entreprises.length>1 ? etat.entreprises.length+" entreprises" : "Patron·ne")
                      : (etat.emploi ? etat.emploi.titre : etat.pension ? "Retraité·e" : "Sans emploi")}]
    .concat(etat.relations.filter(r=>r.vivant).map(r => ({
      nom: r.nom, det: LIBELLE_REL[r.type], f: fortuneDe(r), r,
      sit: r.sdf ? "💔 à la rue"
         : r.entreprise ? r.entreprise.ico+" patron·ne de « "+r.entreprise.nom+" »"
         : r.metier ? r.metier
         : r.statut === "étudiant" ? "à l'université"
         : r.age < 18 ? "à l'école" : "sans emploi"
    })));
  // mes PDG et mes employés extérieurs comptent aussi dans le classement
  for(const ent of (etat.entreprises||[])){
    if(ent.pdg && !ent.pdg.famille)
      gens.push({nom: ent.pdg.nom, det:"👔 Mon PDG", f: ent.pdg.argent||0,
                 sit:`PDG de « ${ent.nom} » · ${euros(ent.pdg.salaire)}/an`});
    for(const emp of (ent.employes||[])) if(emp.externe)
      gens.push({nom: emp.nom, det:"🧾 Mon employé·e", f: emp.argent||0,
                 sit:`${emp.poste} chez « ${ent.nom} » · ${euros(emp.salaire)}/an`});
  }
  gens.sort((a,b) => b.f - a.f);
  const maxF = Math.max(1, ...gens.map(g => g.f));
  const total = gens.reduce((s,g) => s + g.f, 0);
  const medailles = ["🥇","🥈","🥉"];

  carte(`<div class="titre">Patrimoine total de la famille</div>
    <div class="kpis">
      <div class="kpi"><span>Clan entier</span><b class="or">${euros(total)}</b></div>
      <div class="kpi"><span>Ma part</span><b>${Math.round(gens.find(g=>g.moi).f / Math.max(1,total) * 100)} %</b></div>
      <div class="kpi"><span>Mon rang</span><b>${gens.findIndex(g=>g.moi)+1}ᵉ / ${gens.length}</b></div>
    </div>`);

  for(const [i,g] of gens.entries()){
    const c = carte(`<div class="ligne-info">
        <span>${medailles[i] || (i+1)+"ᵉ"} <b>${g.nom}</b>${g.moi ? ' <span class="badge">⭐ moi</span>' : ""}</span>
        <b class="${g.f>0?"":"neg"}">${euros(g.f)}</b>
      </div>
      <div class="mini-jauge"><i style="width:${Math.max(2, Math.round(Math.max(0,g.f)/maxF*100))}%;background:${g.moi?"var(--accent)":"var(--money)"}"></i></div>
      <div class="detail">${g.det} · ${g.sit}${g.r && g.r.riche ? " · 🌟 fortune faite seul·e" : ""}</div>`);
    if(g.r && g.r.type==="enfant" && g.f > (etat.argent||0) && g.f > 100000)
      c.insertAdjacentHTML("beforeend", `<div class="detail" style="color:var(--accent)">Plus riche que moi. La relève est assurée.</div>`);
  }

  section("Ma famille et mes proches");
  if(etat.age>=18 && !etat.relations.some(r=>r.vivant && (r.type==="partenaire"||r.type==="conjoint"))){
    const c = carte(`<div class="titre">💘 Célibataire</div><div class="detail">Envie de rencontrer quelqu'un ?</div><div class="actions"></div>`);
    action(c, "Rencontrer quelqu'un", "", () => {
      if(alea(100) < 35 + etat.look/2 + etat.celebrite/4){
        const g = etat.genre==="F" ? "M" : "F";
        const nom = parmi(g==="F"?PRENOMS_F:PRENOMS_M)+" "+parmi(NOMS);
        etat.relations.push(rel("partenaire", nom, Math.max(18, etat.age+alea(7)-3), g));
        ecrire(`Je suis en couple avec ${nom} ! ❤️`, "bon");
      } else ecrire("Rencontre ratée… ce n'était pas la bonne personne.", "mauvais");
      fermerFeuille();
    });
  }
  for(const r of etat.relations){
    if(!r.vivant) continue;
    let detail = LIBELLE_REL[r.type]+" · "+r.age+" an"+(r.age>1?"s":"");
    if(r.type==="enfant"){
      const situation = r.sdf ? "💔 sans domicile, en grande difficulté"
        : r.age<3 ? "bébé"
        : r.age<18 ? "à l'école"
        : r.statut==="étudiant" ? "à l'université"
        : r.entreprise ? `${r.entreprise.ico} patron·ne de « ${r.entreprise.nom} » (${euros(r.entreprise.valeur)})`
        : r.metier ? r.metier + (r.salaire ? " (" + euros(r.salaire) + "/an)" : "")
        : r.statut==="diplômé" ? "diplômé·e, cherche un emploi"
        : "cherche un emploi";
      detail += `<br>📌 ${situation}`;
      if(r.marie) detail += `<br>💍 marié·e${r.conjoint?" à "+r.conjoint:""}${r.enfants?" · "+r.enfants+" enfant"+(r.enfants>1?"s":""):""}`;
      detail += `<br>💰 Fortune personnelle : <b>${euros(r.argent||0)}</b>`;
      if(r.riche) detail += ` <span class="badge">🌟 A réussi seul·e</span>`;
      if(r.competence!=null) detail += `<br>🛠️ Compétence : ${r.competence}/100`;
    }
    if((r.type==="frere"||r.type==="soeur"||r.type==="ami") && (r.metier||r.riche)){
      detail += `<br>📌 ${r.metier||"—"}${r.riche?" · 🌟 fortune faite ("+euros(r.argent||0)+")":""}`;
    }
    if(r.type==="conjoint" && r.metier)
      detail += `<br>💼 ${r.metier} · ${euros(r.salaire)}/an (contribue 30 % au ménage)`;
    const c = carte(`<div class="titre">${r.nom}</div>
      <div class="detail">${detail}</div>
      <div class="mini-jauge"><i style="width:${r.barre}%"></i></div>
      <div class="actions"></div>`);
    if(r.type==="enfant" && r.age>=4 && r.age<18){
      const ECOLES = {
        publique: {nom:"École publique", cout:0, gain:1},
        privee:   {nom:"École privée", cout:2500, gain:3},
        etranger: {nom:"Études à l'étranger", cout:9000, gain:5},
      };
      const ec = r.ecole || "publique";
      action(c, "Scolarité : "+ECOLES[ec].nom, "gris", () => {
        fileEvenements.push({
          titre:"Scolarité de "+r.nom,
          texte:`Compétence actuelle : ${competence(r)}/100. Une meilleure école la fait progresser plus vite chaque année — et coûte plus cher.`,
          choix: Object.keys(ECOLES).map(k => ({label:`${ECOLES[k].nom}${ECOLES[k].cout?" — "+euros(ECOLES[k].cout)+"/an":" — gratuite"} (+${ECOLES[k].gain}/an)`, effet(){
            r.ecole = k;
            ecrire(`J'ai inscrit ${r.nom} à ${ECOLES[k].nom.toLowerCase()}.`, k==="publique"?"":"argent");
          }})).concat([{label:"Annuler", effet(){}}])
        });
        fermerFeuille(); prochaineModale();
      });
      action(c, "Cours de soutien (800 €)", "", () => {
        if(dejaFait("soutien_"+r.nom)){ ecrire(`${r.nom} a déjà eu ses cours de soutien cette année.`); fermerFeuille(); return; }
        etat.argent -= 800;
        r.competence = Math.min(95, competence(r)+5); r.barre = borne(r.barre+5);
        ecrire(`Cours de soutien pour ${r.nom} : ${r.genre==="F"?"elle":"il"} rattrape son retard (compétence ${r.competence}).`, "bon");
        fermerFeuille();
      }, etat.argent<800);
    }
    if(r.type==="enfant" && etat.age>=18){
      action(c, "Donner 1 000 €", "or", () => {
        etat.argent -= 1000; r.argent = (r.argent||0)+1000; r.barre = borne(r.barre+10);
        ecrire(`J'ai donné 1 000 € à ${r.nom} pour l'aider dans la vie.`, "argent");
        fermerFeuille();
      }, etat.argent<1000);
      if(r.sdf){
        action(c, "Le sortir de la rue (5 000 €)", "rouge", () => {
          etat.argent -= 5000; r.sdf = false; r.echecs = 0;
          r.argent = (r.argent||0)+2000; r.barre = borne(r.barre+30);
          r.competence = Math.min(95, competence(r)+8);
          etat.bonheur = borne(etat.bonheur+12);
          ecrire(`J'ai sorti ${r.nom} de la rue : un toit, des vêtements propres, une formation. ${r.genre==="F"?"Elle":"Il"} repart du bon pied.`, "bon");
          fermerFeuille();
        }, etat.argent<5000);
      }
      if(r.age>=22 && !r.entreprise && !r.sdf){
        action(c, "Financer son entreprise (15 000 €)", "or", () => {
          etat.argent -= 15000;
          const t = parmi(TYPES_ENTREPRISE);
          r.entreprise = {type:t.type, ico:t.ico, nom:r.nom.split(" ")[0]+" "+parmi(["& Fils","Group","Océan","Invest"]), valeur:15000};
          r.metier = "Patron·ne — "+t.type; r.salaire = 0; r.barre = borne(r.barre+20);
          etat.bonheur = borne(etat.bonheur+10);
          ecrire(`J'ai financé l'entreprise de ${r.nom} : ${t.ico} « ${r.entreprise.nom} ». À ${r.genre==="F"?"elle":"lui"} de jouer.`, "argent");
          fermerFeuille();
        }, etat.argent<15000);
      }
    }
    action(c, "Passer du temps", "gris", () => {
      r.barre = borne(r.barre+12); etat.bonheur = borne(etat.bonheur+4);
      ecrire(`Bon moment passé avec ${r.nom}.`, "bon"); fermerFeuille();
    });
    action(c, "Cadeau (100 €)", "gris", () => {
      etat.argent -= 100; r.barre = borne(r.barre+18);
      ecrire(`J'ai offert un cadeau à ${r.nom}.`); fermerFeuille();
    }, etat.argent<100);
    if(r.type==="partenaire" && etat.age>=18){
      action(c, "Demander en mariage 💍", "", () => {
        if(r.barre>50 || alea(2)){
          r.type="conjoint"; r.barre=borne(r.barre+15); etat.bonheur=borne(etat.bonheur+20);
          etat.argent -= 2000;
          const m = parmi(EMPLOIS.slice(0,7));
          r.metier = m.titre; r.salaire = m.salaire;
          ecrire(`${r.nom} a dit OUI ! Grand mariage à ${etat.ville} (2 000 € de festivités). 💍`, "bon");
          ecrire(`Mon ${r.genre==="F"?"épouse":"époux"} travaille comme ${m.titre.toLowerCase()} et contribue au ménage.`);
        } else {
          etat.bonheur=borne(etat.bonheur-15);
          ecrire(`${r.nom} a refusé ma demande en mariage…`, "mauvais");
        }
        fermerFeuille();
      });
      action(c, "Rompre", "rouge", () => {
        ecrire(`J'ai rompu avec ${r.nom}.`);
        etat.relations = etat.relations.filter(x=>x!==r);
        etat.bonheur=borne(etat.bonheur-8); fermerFeuille();
      });
    }
    if(r.type==="conjoint"){
      action(c, "Divorcer", "rouge", () => {
        const pension = Math.round(Math.max(0, etat.argent) * 0.35);
        etat.argent -= pension;
        etat.divorces = (etat.divorces||0)+1;
        etat.bonheur = borne(etat.bonheur-18);
        etat.karma = borne((etat.karma||60)-4);
        for(const e of etat.relations) if(e.type==="enfant" && e.vivant) e.barre = borne(e.barre-12);
        ecrire(`⚖️ Divorce prononcé d'avec ${r.nom}. La prestation compensatoire me coûte ${euros(pension)}.`, "mauvais");
        etat.relations = etat.relations.filter(x => x !== r);
        fermerFeuille();
      });
      action(c, "Avoir une aventure", "gris", () => {
        if(dejaFait("aventure")){ ecrire("Déjà assez joué avec le feu cette année."); fermerFeuille(); return; }
        etat.karma = borne((etat.karma||60)-10);
        if(alea(100) < 45 + etat.look/4){
          etat.bonheur = borne(etat.bonheur+8);
          ecrire("J'ai eu une aventure. Personne n'en sait rien… pour l'instant.");
        } else {
          r.barre = borne(r.barre-40); etat.bonheur = borne(etat.bonheur-15);
          etat.celebrite = borne(etat.celebrite+3);
          ecrire(`💥 ${r.nom} a découvert mon infidélité ! Scandale à la maison, la confiance est brisée.`, "mauvais");
          if(alea(2)){
            etat.divorces = (etat.divorces||0)+1;
            const p = Math.round(Math.max(0, etat.argent) * 0.4);
            etat.argent -= p;
            ecrire(`${r.nom} demande le divorce et obtient ${euros(p)}.`, "mauvais");
            etat.relations = etat.relations.filter(x => x !== r);
          }
        }
        fermerFeuille();
      });
      action(c, "Faire un enfant 👶", "", () => {
        if(dejaFait("bebe")){ ecrire("Un heureux événement à la fois : on verra l'an prochain."); fermerFeuille(); return; }
        if(alea(2)){
          const g = alea(2)?"F":"M";
          const bb = parmi(g==="F"?PRENOMS_F:PRENOMS_M)+" "+etat.nom;
          etat.relations.push(rel("enfant", bb, 0, g));
          etat.bonheur=borne(etat.bonheur+18);
          ecrire(`Naissance de ${g==="F"?"ma fille":"mon fils"} ${bb} ! 👶 (un enfant coûte 1 000 €/an)`, "bon");
        } else ecrire("Pas de bébé cette année, on garde espoir.");
        fermerFeuille();
      });
    }
  }
}

/* ----- vie : quotidien, formations, star, risques ----- */

function feuilleVie(){
  if(etat.prison > 0){
    section("⛓️ En prison");
    carte(`<div class="titre">Peine en cours</div>
      <div class="detail">Il me reste <b>${etat.prison} an${etat.prison>1?"s":""}</b> à purger. Karma : ${etat.karma||60}/100.<br>
      Derrière les barreaux, tout se joue sur trois choix : filer doux, se battre pour survivre, ou tenter le mur.</div>`);
    const cE = carte(`<div class="titre">🪜 Tenter l'évasion</div>
      <div class="detail">Risqué : en cas d'échec, la peine s'alourdit. La forme physique et les arts martiaux aident.</div>
      <div class="actions"></div>`);
    action(cE, "S'évader", "rouge", () => {
      if(dejaFait("evasion")){ ecrire("Les gardiens sont sur les dents, pas deux fois la même année."); fermerFeuille(); return; }
      const ch = 22 + Math.round(etat.sante/6) + (etat.arts ? 12 : 0) + Math.round((etat.intel-50)/8);
      if(alea(100) < ch){
        etat.prison = 0; etat.bonheur = borne(etat.bonheur+15);
        etat.karma = borne((etat.karma||60)-5);
        debloquer("evasion");
        ecrire("🪜 ÉVASION RÉUSSIE ! Par les toits, dans la nuit. Je suis libre.", "bon");
      } else {
        etat.prison += 1 + alea(3); etat.sante = borne(etat.sante-10); etat.bonheur = borne(etat.bonheur-15);
        ecrire("Évasion ratée : rattrapé au grillage, tabassé, et la peine s'allonge.", "mauvais");
      }
      fermerFeuille();
    });
    const cB = carte(`<div class="titre">😇 Bonne conduite</div>
      <div class="detail">Se tenir tranquille, travailler à l'atelier : la peine peut être réduite.</div>
      <div class="actions"></div>`);
    action(cB, "Filer doux", "", () => {
      if(dejaFait("conduite")){ ecrire("Déjà fait cette année."); fermerFeuille(); return; }
      etat.karma = borne((etat.karma||60)+6);
      etat.compPro = borne((etat.compPro||0)+2);
      if(alea(100) < 40){
        etat.prison = Math.max(0, etat.prison-1);
        ecrire("Bonne conduite récompensée : un an de remise de peine !", "bon");
      } else ecrire("Je me tiens à carreau. L'atelier m'apprend même un métier.");
      fermerFeuille();
    });
    const cF = carte(`<div class="titre">👊 Se battre</div>
      <div class="detail">La cour de promenade a ses règles. Gagner impose le respect, perdre coûte cher.</div>
      <div class="actions"></div>`);
    action(cF, "Répondre aux coups", "gris", () => {
      if(dejaFait("bagarre")){ ecrire("Une bagarre par an, sinon c'est le mitard."); fermerFeuille(); return; }
      if(alea(100) < 40 + (etat.arts?25:0) + Math.round(etat.sante/8)){
        etat.bonheur = borne(etat.bonheur+6); etat.look = borne(etat.look-2);
        ecrire("👊 J'ai gagné la bagarre : on me laisse tranquille désormais.", "bon");
      } else {
        etat.sante = borne(etat.sante-14); etat.look = borne(etat.look-5); etat.prison += 1;
        ecrire("👊 Passage à tabac dans la cour. Blessé, et un an de plus au mitard.", "mauvais");
      }
      fermerFeuille();
    });
    if(etat.argent >= 8000){
      const cA = carte(`<div class="titre">⚖️ Payer un bon avocat (8 000 €)</div>
        <div class="detail">Un ténor du barreau peut faire réviser ta peine en appel.</div>
        <div class="actions"></div>`);
      action(cA, "Faire appel", "or", () => {
        if(dejaFait("appel")){ ecrire("Un appel par an, la cour ne suivrait pas."); fermerFeuille(); return; }
        etat.argent -= 8000;
        if(alea(100) < 45 + Math.round((etat.karma||60)/5)){
          const remise = 1 + alea(3);
          etat.prison = Math.max(0, etat.prison - remise);
          ecrire(`⚖️ Appel gagné : ${remise} an${remise>1?"s":""} de moins à purger${etat.prison===0?" — je sors aujourd'hui !":"."}`, "bon");
        } else ecrire("⚖️ Appel rejeté. 8 000 € d'honoraires pour rien.", "mauvais");
        fermerFeuille();
      });
    }
    return;
  }
  if(etat.maladie){
    section("🏥 Urgent — Santé");
    const m = etat.maladie;
    const c = carte(`<div class="titre">🏥 Soigner ${m.nom}</div>
      <div class="detail">Traitement à l'hôpital : ${euros(m.cout)}. Sans soin, la maladie ronge la santé chaque année (−${m.degats}/an).</div>
      <div class="actions"></div>`);
    action(c, `Se faire soigner (${euros(m.cout)})`, "", () => {
      etat.argent -= m.cout;
      if(alea(100) < 85){
        etat.maladie = null; etat.sante = borne(etat.sante+10);
        ecrire(`Guéri${etat.genre==="F"?"e":""} de ${m.nom} après un bon traitement à l'hôpital.`, "bon");
      } else {
        ecrire(`Le traitement contre ${m.nom} n'a pas suffi. Il faudra retenter l'an prochain.`, "mauvais");
      }
      fermerFeuille();
    }, etat.argent < m.cout);
  }
  section("Quotidien");
  const A = [];
  A.push(["📚 Bibliothèque", "Gratuit · +Intelligence", 0, () => {
    etat.intel = borne(etat.intel+4);
    ecrire("J'ai passé du temps à la bibliothèque. Je me sens plus intelligent"+(etat.genre==="F"?"e":"")+".", "bon");
  }]);
  A.push(["🏖️ Journée plage", "Gratuit · +Bonheur", 0, () => {
    etat.bonheur = borne(etat.bonheur+7);

  {

        <div class="detail" style="${ok?"":"opacity:.55"}">${su.desc}</div>`);
    }
  }

  if(etat.age>=16){
    section("✈️ Voyages", false);
    const DESTINATIONS = [
      ["🏝️ Mohéli, week-end", 250, {bonheur:8, sante:2}, "Plage de Nioumachoua, tortues et silence."],
      ["🌶️ Zanzibar", 700, {bonheur:12, sante:3}, "Stone Town, les épices et l'océan turquoise."],
      ["🕌 Istanbul", 1600, {bonheur:14, intel:3}, "Bosphore, bazars et mosquées."],
      ["🕋 La Mecque (Omra)", 2600, {bonheur:22, sante:4}, "Le voyage d'une vie. La famille en parle encore."],
      ["🗼 Paris", 2200, {bonheur:14, look:4}, "Musées, vitrines et cafés."],
      ["🏙️ Dubaï", 3200, {bonheur:16, look:5, celebrite:4}, "Gratte-ciel, or et démesure."],
      ["🌍 Tour du monde", 12000, {bonheur:30, intel:6, look:5, celebrite:8}, "Six mois, quatre continents. Une autre personne au retour."],

    for(const [titre, cout, effets, desc] of DESTINATIONS){
      const c = carte(`<div class="titre">${titre}</div>
        <div class="detail">${euros(cout)} · ${desc}</div><div class="actions"></div>`);
      action(c, "Partir", "", () => {
        if(dejaFait("voyage")){ ecrire("Un grand voyage par an, il faut aussi travailler."); fermerFeuille(); return; }
        etat.argent -= cout;
        for(const k in effets) etat[k] = borne((etat[k]||0) + effets[k]);
        etat.voyages = (etat.voyages||0)+1;
        for(const r of etat.relations) if(r.vivant && (r.type==="conjoint"||r.type==="enfant")) r.barre = borne(r.barre+6);

        <div class="detail">3 000 € · Salons, clients étrangers, fournisseurs : la réputation de tes entreprises grimpe et des contrats peuvent tomber.</div>
        <div class="actions"></div>`);

        } else ecrire("💼 Voyage d'affaires : beaucoup de cartes de visite, peu de résultats immédiats.");
        etat.compPro = borne((etat.compPro||0)+2);
        fermerFeuille();

  if(etat.age>=15){
    section("🎓 Formations & compétences", false);
    carte(`<div class="detail">🛠️ Compétence pro actuelle : <b>${borne(etat.compPro||0)}/100</b> · Expérience : ${etat.anneesTravail||0} an${(etat.anneesTravail||0)>1?"s":""}. Se former aide à décrocher les meilleurs postes, les augmentations, et à mieux gérer ses entreprises.</div>`);
    const F = [];
    F.push(["📖 Cours du soir", "500 € · 1×/an · +4 Intelligence", "coursSoir", 500, () => {

      ecrire("Cours du soir toute l'année : je me sens plus affûté"+(etat.genre==="F"?"e":"")+".", "bon");
