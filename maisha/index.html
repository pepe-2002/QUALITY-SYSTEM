          etat.bonheur=borne(etat.bonheur+18);
          ecrire(`Naissance de ${g==="F"?"ma fille":"mon fils"} ${bb} ! 👶 (un enfant coûte 1 000 €/an)`, "bon");
        } else ecrire("Pas de bébé cette année, on garde espoir.");
        fermerFeuille();
      });
    }
  }
}

/* ----- activités : quotidien, star, risques ----- */

function feuilleActivites(){
  if(etat.maladie){
    section("🏥 Urgent — Santé");
    const m = etat.maladie;
    const c = carte(`<div class="titre">🏥 Soigner ${m.nom}</div>
      <div class="detail">Traitement à l'hôpital : ${euros(m.cout)}. Sans soin, la maladie ronge la santé chaque année (−${m.degats}/an).</div>
      <div class="actions"></div>`);
    action(c, `Se faire soigner (${euros(m.cout)})`, "", () => {
      etat.argent -= m.cout;
      if(alea(100) < 85){
        etat.maladie = null; etat.sante = borne(etat.sante+10);
        ecrire(`Guéri${etat.genre==="F"?"e":""} de ${m.nom} après un bon traitement à l'hôpital.`, "bon");
      } else {
        ecrire(`Le traitement contre ${m.nom} n'a pas suffi. Il faudra retenter l'an prochain.`, "mauvais");
      }
      fermerFeuille();
    }, etat.argent < m.cout);
  }
  section("Quotidien");
  const A = [];
  A.push(["📚 Bibliothèque", "Gratuit · +Intelligence", 0, () => {
    etat.intel = borne(etat.intel+4);
    ecrire("J'ai passé du temps à la bibliothèque. Je me sens plus intelligent"+(etat.genre==="F"?"e":"")+".", "bon");
  }]);
  A.push(["🏖️ Journée plage", "Gratuit · +Bonheur", 0, () => {
    etat.bonheur = borne(etat.bonheur+7);
    ecrire("Journée parfaite à la plage, l'océan Indien à perte de vue.", "bon");
  }]);
  if(etat.age>=12) A.push(["🏋️ Salle de sport", "50 € · +Santé +Apparence", 50, () => {
    etat.sante = borne(etat.sante+5); etat.look = borne(etat.look+4);
    ecrire("Séances de sport régulières : je suis en pleine forme.", "bon");
  }]);
  if(etat.age>=15) A.push(["🎬 Cinéma", "15 € · +Bonheur", 15, () => {
    etat.bonheur = borne(etat.bonheur+5);
    ecrire("Bonne soirée cinéma.");
  }]);
  A.push(["🩺 Médecin", "150 € · Soigne la santé", 150, () => {
    etat.sante = borne(etat.sante+15);
    ecrire("Visite chez le médecin : traitement efficace, je vais mieux.", "bon");
  }]);
  for(const [titre, detail, cout, fn] of A){
    const c = carte(`<div class="titre">${titre}</div><div class="detail">${detail}</div><div class="actions"></div>`);
    action(c, "Y aller", "", () => { if(cout) etat.argent -= cout; fn(); fermerFeuille(); }, cout>etat.argent && cout>0);
  }

  if(etat.age>=14){
    section("⭐ Carrière de star");
    const S = [];
    S.push(["🎤 Chanter aux mariages", "1×/an · Petit cachet + célébrité", "mariages", 0, () => {
      const gain = 150+alea(350); etat.argent += gain;
      etat.celebrite = borne(etat.celebrite+3);
      ecrire(`J'ai animé des mariages : ${euros(gain)} de cachets et un début de réputation.`, "argent");
    }]);
    S.push(["📱 Poster des clips en ligne", "1×/an · +Célébrité (selon l'apparence)", "clips", 0, () => {
      if(alea(100) < 30 + etat.look/2){
        etat.celebrite = borne(etat.celebrite + 6 + Math.round(etat.look/12));
        ecrire("Mes clips cartonnent en ligne, les abonnés affluent !", "bon");
      } else { etat.bonheur=borne(etat.bonheur-4); ecrire("Mes clips ont fait un bide. Les commentaires piquent.", "mauvais"); }
    }]);
    if(etat.celebrite>=20) S.push(["💿 Sortir un single", "1 500 € de studio · 1×/an", "single", 1500, () => {
      if(alea(100) < 25 + etat.celebrite/2 + etat.look/4){
        const gain = Math.round(etat.celebrite*80); etat.argent += gain;
        etat.celebrite = borne(etat.celebrite+10);
        ecrire(`Mon single est un tube ! ${euros(gain)} de royalties.`, "argent");
      } else ecrire("Le single est passé inaperçu. 1 500 € de studio envolés.", "mauvais");
    }]);
    if(etat.celebrite>=40) S.push(["🎫 Tournée régionale", "8 000 € de production · 1×/an", "tournee", 8000, () => {
      const gain = Math.round(etat.celebrite*350*(0.7+alea(60)/100));
      etat.argent += gain; etat.sante = borne(etat.sante-6);
      etat.celebrite = borne(etat.celebrite+8);
      ecrire(`Tournée Moroni–Mamoudzou–Tana : ${euros(gain)} de recettes, mais quelle fatigue.`, "argent");
    }]);
    if(etat.celebrite>=60) S.push(["📺 Contrat publicitaire", "1×/an · Gros cachet", "pub", 0, () => {
      const gain = Math.round(etat.celebrite*250); etat.argent += gain;
      ecrire(`Une marque m'a payé ${euros(gain)} pour une campagne de pub.`, "argent");
    }]);
    for(const [titre, detail, cle, cout, fn] of S){
      const c = carte(`<div class="titre">${titre}</div><div class="detail">${detail}</div><div class="actions"></div>`);
      action(c, "Le faire", "or", () => {
        if(dejaFait(cle)){ ecrire("Déjà fait cette année. La suite l'an prochain."); fermerFeuille(); return; }
        if(cout) etat.argent -= cout;
        fn(); fermerFeuille();
      }, cout>etat.argent && cout>0);
    }
  }

  if(etat.age>=16){
    section("Zone à risque");
    const c = carte(`<div class="titre">🕶️ Vol à l'étalage</div><div class="detail">1×/an · Risqué : la prison n'est jamais loin.</div><div class="actions"></div>`);
    action(c, "Tenter le coup", "rouge", () => {
      if(dejaFait("vol")){ ecrire("Ne tentons pas le diable deux fois la même année."); fermerFeuille(); return; }
      if(alea(100)<45){
        const g = 50+alea(300); etat.argent += g;
        ecrire(`Vol à l'étalage réussi : ${euros(g)}. Pas très fier${etat.genre==="F"?"ère":""} de moi.`, "argent");
      } else {
        etat.prison = 1+alea(2); etat.bonheur = borne(etat.bonheur-20);
        if(etat.politique){ ecrire("Ma carrière politique s'effondre avec ce délit.", "mauvais"); etat.politique=null; if(etat.emploi&&etat.emploi.politique) etat.emploi=null; }
        ecrire(`Pris en flagrant délit de vol ! Condamné${etat.genre==="F"?"e":""} à ${etat.prison} an${etat.prison>1?"s":""} de prison.`, "mauvais");
      }
      fermerFeuille();
    });
  }
}

/* ---------------- écran d'accueil (choix du personnage) ---------------- */

let choixGenre = "";

function ecranAccueil(){
  $("plein").innerHTML = `
    <div class="cadre">
      <div class="embleme">🌺</div>
      <h1>Maisha</h1>
      <div class="sous">Le simulateur de vie et de dynastie.<br>Étudie, travaille, entreprends, deviens star ou président… puis transmets ton héritage à tes enfants.</div>
      <div class="champ">
        <label>Ton prénom (laisser vide = au hasard)</label>
        <input id="in-prenom" maxlength="20" placeholder="Ex. : Nayam">
      </div>
      <div class="champ">
        <label>Fille ou garçon ?</label>
        <div class="genres">
          <button id="g-f">👧 Fille</button>
          <button id="g-m">👦 Garçon</button>
          <button id="g-a" class="actif">🎲 Au hasard</button>
        </div>
      </div>
      <div class="champ">
        <label>Lieu de naissance</label>
        <select id="in-lieu">
          <option value="">🎲 Au hasard</option>
          ${VILLES.map((v,i)=>`<option value="${i}">${v[0]}, ${v[1]}</option>`).join("")}
        </select>
      </div>
      <button class="grand" id="btn-commencer">🍼 Commencer une vie</button>
    </div>`;
  $("plein").classList.add("ouvert");
  choixGenre = "";
  const majGenres = () => {
    $("g-f").classList.toggle("actif", choixGenre==="F");
    $("g-m").classList.toggle("actif", choixGenre==="M");
    $("g-a").classList.toggle("actif", choixGenre==="");
  };
  $("g-f").onclick = () => { choixGenre="F"; majGenres(); };
  $("g-m").onclick = () => { choixGenre="M"; majGenres(); };
  $("g-a").onclick = () => { choixGenre="";  majGenres(); };
  $("btn-commencer").onclick = () => {
    const iLieu = $("in-lieu").value;
    nouvelleVie({
      genre: choixGenre || null,
      prenom: $("in-prenom").value,
      lieu: iLieu==="" ? null : VILLES[+iLieu],
    });
  };
}

/* ---------------- branchements ---------------- */

$("btn-age").onclick = () => { fermerFeuille(); vieillir(); };
$("voile").onclick = fermerFeuille;
$("feuille-fermer").onclick = fermerFeuille;
for(const b of document.querySelectorAll("#nav button[data-sheet]")){
  b.onclick = () => ouvrirFeuille(b.dataset.sheet);
}

if(charger() && etat && !etat.mort && etat.monde){
  toutAfficher();
} else {
  ecranAccueil();
}
</script>
