<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Maisha — Simulateur de vie</title>
<style>
  :root{
    --bg:#0d1b2a; --panel:#13263a; --panel2:#0f2032; --line:#1e3a55;
    --ink:#eaf2f8; --ink-dim:#8fa8bc;
    --accent:#18b89b; --accent-ink:#062b24;
    --money:#ffb74a; --danger:#ff6b6b;
    --sante:#ff6b81; --bonheur:#ffc14a; --intel:#4aa8ff; --look:#c77dff; --celeb:#ffd700;
    --sheet:#112438; --shadow:0 -8px 30px rgba(0,0,0,.45);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#eef4f2; --panel:#ffffff; --panel2:#f2f7f5; --line:#d8e4e0;
      --ink:#122b33; --ink-dim:#5b7480;
      --accent:#0e9e85; --accent-ink:#ffffff;
      --money:#c07f00; --danger:#d94848; --celeb:#b8860b;
      --sheet:#ffffff; --shadow:0 -8px 30px rgba(20,40,50,.18);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1b2a; --panel:#13263a; --panel2:#0f2032; --line:#1e3a55;
    --ink:#eaf2f8; --ink-dim:#8fa8bc;
    --accent:#18b89b; --accent-ink:#062b24;
    --money:#ffb74a; --danger:#ff6b6b; --celeb:#ffd700;
    --sheet:#112438; --shadow:0 -8px 30px rgba(0,0,0,.45);
  }
  :root[data-theme="light"]{
    --bg:#eef4f2; --panel:#ffffff; --panel2:#f2f7f5; --line:#d8e4e0;
    --ink:#122b33; --ink-dim:#5b7480;
    --accent:#0e9e85; --accent-ink:#ffffff;
    --money:#c07f00; --danger:#d94848; --celeb:#b8860b;
    --sheet:#ffffff; --shadow:0 -8px 30px rgba(20,40,50,.18);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display:flex; justify-content:center; overflow:hidden;
  }
  #app{
    width:100%; max-width:480px; height:100dvh;
    display:flex; flex-direction:column; position:relative;
    background:var(--bg);
  }
  /* ---------- entête ---------- */
  header{
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:10px 14px; display:flex; align-items:center; gap:12px; flex:0 0 auto;
  }
  #avatar{
    width:46px; height:46px; border-radius:50%; flex:0 0 auto;
    background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:800;
  }
  #who{flex:1 1 auto; min-width:0}
  #who .nom{font-weight:800; font-size:15px; letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #who .sub{color:var(--ink-dim); font-size:11.5px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #bank{text-align:right; flex:0 0 auto}
  #bank .argent{color:var(--money); font-weight:800; font-size:15px; font-variant-numeric:tabular-nums}
  #bank .argent.negatif{color:var(--danger)}
  #bank .sub{color:var(--ink-dim); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em}
  /* ---------- journal ---------- */
  #journal{flex:1 1 auto; overflow-y:auto; padding:14px 14px 90px; scroll-behavior:smooth}
  .annee{margin-bottom:14px}
  .annee h3{
    font-size:12px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.1em;
    margin-bottom:6px; display:flex; align-items:center; gap:8px;
  }
  .annee h3::after{content:""; flex:1; height:1px; background:var(--line)}
  .annee p{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:9px 12px; font-size:14px; line-height:1.45; margin-bottom:6px;
  }
  .annee p.bon{border-left:3px solid var(--accent)}
  .annee p.mauvais{border-left:3px solid var(--danger)}
  .annee p.argent{border-left:3px solid var(--money)}
  .annee p.info{border-left:3px solid var(--intel); font-size:12.5px; color:var(--ink-dim)}
  /* ---------- pied : stats + nav ---------- */
  footer{
    flex:0 0 auto; background:var(--panel); border-top:1px solid var(--line);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  #stats{display:grid; grid-template-columns:1fr 1fr; gap:5px 14px; padding:2px 4px 8px}
  .stat{display:flex; align-items:center; gap:8px; font-size:11px}
  .stat label{width:74px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.05em; flex:0 0 auto}
  .jauge{flex:1; height:8px; background:var(--panel2); border-radius:99px; overflow:hidden}
  .jauge i{display:block; height:100%; border-radius:99px; transition:width .4s}
  .stat b{width:26px; text-align:right; font-variant-numeric:tabular-nums; font-size:11px}
  #ligne-celeb{display:none; grid-column:1 / -1}
  #nav{display:flex; align-items:center; gap:5px}
  #nav button{
    flex:1; background:var(--panel2); color:var(--ink); border:1px solid var(--line);
    border-radius:11px; padding:7px 1px 6px; font-size:9.5px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0;
  }
  #nav button span.ico{font-size:16px; line-height:1}
  #nav #btn-age{
    flex:0 0 64px; height:58px; border-radius:50%/40%;
    background:var(--accent); color:var(--accent-ink); border:none;
    font-weight:800; font-size:14px; box-shadow:0 4px 14px rgba(24,184,155,.35);
  }
  #nav #btn-age:active{transform:scale(.95)}
  #ligne-comppro{display:none; grid-column:1 / -1}
  /* ---------- feuilles (bottom sheets) ---------- */
  #voile{
    position:absolute; inset:0; background:rgba(0,0,0,.55);
    opacity:0; pointer-events:none; transition:opacity .25s; z-index:20;
  }
  #voile.ouvert{opacity:1; pointer-events:auto}
  .feuille{
    position:absolute; left:0; right:0; bottom:0; z-index:21;
    background:var(--sheet); border-radius:18px 18px 0 0; box-shadow:var(--shadow);
    max-height:80%; display:flex; flex-direction:column;
    transform:translateY(105%); transition:transform .28s ease;
  }
  .feuille.ouvert{transform:translateY(0)}
  .feuille .tete{
    padding:14px 16px 10px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; flex:0 0 auto;
  }
  .feuille .tete h2{font-size:16px; font-weight:800; letter-spacing:.2px}
  .feuille .tete button{background:none; border:none; color:var(--ink-dim); font-size:22px; cursor:pointer; padding:0 4px}
  .feuille .corps{overflow-y:auto; padding:12px 14px calc(16px + env(safe-area-inset-bottom))}
  .section-titre{
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.1em;
    margin:14px 2px 8px; display:flex; align-items:center; gap:8px;
  }
  .section-titre::after{content:""; flex:1; height:1px; background:var(--line)}
  .section-titre:first-child{margin-top:2px}
  .carte{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:11px 13px; margin-bottom:9px;
  }
  .carte .titre{font-weight:700; font-size:14px}
  .carte .detail{color:var(--ink-dim); font-size:12px; margin-top:2px; line-height:1.5}
  .carte .actions{display:flex; flex-wrap:wrap; gap:7px; margin-top:9px}
  .carte .actions:empty{display:none}
  .bouton{
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:8px;
    padding:6px 10px; font-size:11.5px; font-weight:600; cursor:pointer; letter-spacing:.1px;
  }
  /* ---- interface pro : KPI, boutons compacts, segments ---- */
  .kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:10px}
  .kpi{background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:7px 8px}
  .kpi span{display:block; font-size:9.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em}
  .kpi b{display:block; font-size:13px; font-variant-numeric:tabular-nums; margin-top:2px}
  .kpi b.pos{color:var(--accent)} .kpi b.neg{color:var(--danger)} .kpi b.or{color:var(--money)}
  .grille{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:9px}
  .grille .bouton{width:100%; text-align:center; padding:8px 4px}
  .segment{display:flex; flex-wrap:wrap; gap:5px; margin-top:9px}
  .segment button{
    flex:1 1 auto; min-width:78px; background:var(--panel2); color:var(--ink);
    border:1px solid var(--line); border-radius:8px; padding:7px 6px; font-size:11px; cursor:pointer;
  }
  .segment button.actif{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700}
  .segment button:disabled{opacity:.4; cursor:default}
  .ligne-info{display:flex; justify-content:space-between; gap:8px; font-size:12px; padding:4px 0; border-bottom:1px dashed var(--line)}
  .ligne-info:last-child{border-bottom:none}
  .ligne-info b{font-variant-numeric:tabular-nums}
  .feuille .tete .retour{
    background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    border-radius:8px; font-size:12px; padding:5px 9px; margin-right:8px; cursor:pointer;
  }
  .feuille .tete .gauche{display:flex; align-items:center; min-width:0; flex:1}
  .feuille .tete h2{font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .bouton.gris{background:var(--panel2); color:var(--ink); border:1px solid var(--line)}
  .bouton.rouge{background:var(--danger); color:#fff}
  .bouton.or{background:var(--money); color:#3a2500}
  .bouton:disabled{opacity:.4; cursor:default}
  .mini-jauge{height:6px; background:var(--panel2); border-radius:99px; overflow:hidden; margin-top:8px}
  .mini-jauge i{display:block; height:100%; background:var(--accent)}
  .pays-stat{display:flex; align-items:center; gap:8px; font-size:11px; margin-top:7px}
  .pays-stat label{width:104px; color:var(--ink-dim); flex:0 0 auto}
  .pays-stat b{width:26px; text-align:right; font-variant-numeric:tabular-nums}
  .badge{
    display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:99px;
    background:var(--panel2); border:1px solid var(--line); margin:6px 4px 0 0;
  }
  /* ---------- modale événement ---------- */
  #modale{
    position:absolute; inset:0; z-index:30; display:none;
    align-items:center; justify-content:center; padding:22px;
    background:rgba(0,0,0,.6);
  }
  #modale.ouvert{display:flex}
  #modale .boite{
    background:var(--sheet); border:1px solid var(--line); border-radius:16px;
    padding:20px 18px; width:100%; max-width:360px; max-height:80%; overflow-y:auto;
  }
  #modale h2{font-size:17px; margin-bottom:8px; text-wrap:balance}
  #modale .texte{font-size:14px; line-height:1.5; margin-bottom:16px}
  #modale .choix{display:flex; flex-direction:column; gap:8px}
  #modale .choix button{
    background:var(--panel); border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:11px 12px; font-size:14px; text-align:left; cursor:pointer;
  }
  #modale .choix button:hover{border-color:var(--accent)}
  /* ---------- écrans pleins (accueil / mort) ---------- */
  #plein{position:absolute; inset:0; z-index:40; display:none; background:var(--bg); overflow-y:auto; padding:30px 24px}
  #plein.ouvert{display:block}
  #plein .cadre{max-width:380px; margin:0 auto; text-align:center}
  #plein .embleme{font-size:50px; margin-bottom:10px}
  #plein h1{font-size:26px; margin-bottom:4px; letter-spacing:.3px}
  #plein .sous{color:var(--ink-dim); font-size:14px; margin-bottom:20px; line-height:1.5}
  #plein .fiche{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; text-align:left; margin-bottom:14px; font-size:14px; line-height:1.9;
  }
  #plein .fiche b{font-variant-numeric:tabular-nums}
  #plein .grand{
    width:100%; background:var(--accent); color:var(--accent-ink); border:none;
    border-radius:12px; padding:13px; font-size:15px; font-weight:800; cursor:pointer; margin-bottom:10px;
  }
  #plein .grand.secondaire{background:var(--panel2); color:var(--ink); border:1px solid var(--line)}
  #plein .champ{margin-bottom:12px; text-align:left}
  #plein .champ label{display:block; font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:5px}
  #plein input, #plein select{
    width:100%; background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:11px 12px; font-size:15px;
  }
  #plein .genres{display:flex; gap:8px}
  #plein .genres button{
    flex:1; background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:11px 6px; font-size:14px; cursor:pointer;
  }
  #plein .genres button.actif{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700}
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important; scroll-behavior:auto !important}
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div id="avatar">?</div>
    <div id="who"><div class="nom">—</div><div class="sub">—</div></div>
    <div id="bank"><div class="argent">0 €</div><div class="sub">Banque</div></div>
  </header>

  <main id="journal"></main>

  <footer>
    <div id="stats">
      <div class="stat"><label>Santé</label><div class="jauge"><i id="j-sante" style="background:var(--sante)"></i></div><b id="v-sante">0</b></div>
      <div class="stat"><label>Bonheur</label><div class="jauge"><i id="j-bonheur" style="background:var(--bonheur)"></i></div><b id="v-bonheur">0</b></div>
      <div class="stat"><label>Intelligence</label><div class="jauge"><i id="j-intel" style="background:var(--intel)"></i></div><b id="v-intel">0</b></div>
      <div class="stat"><label>Apparence</label><div class="jauge"><i id="j-look" style="background:var(--look)"></i></div><b id="v-look">0</b></div>
      <div class="stat" id="ligne-celeb"><label>Célébrité</label><div class="jauge"><i id="j-celeb" style="background:var(--celeb)"></i></div><b id="v-celeb">0</b></div>
      <div class="stat" id="ligne-comppro"><label>Compét. pro</label><div class="jauge"><i id="j-comppro" style="background:var(--accent)"></i></div><b id="v-comppro">0</b></div>
    </div>
    <div id="nav">
      <button data-sheet="travail"><span class="ico">💼</span>Travail</button>
      <button data-sheet="actifs"><span class="ico">🏠</span>Actifs</button>
      <button data-sheet="pays"><span class="ico">🏛️</span>Pays</button>
      <button id="btn-age">+ Âge</button>
      <button data-sheet="relations"><span class="ico">❤️</span>Relations</button>
      <button data-sheet="vie"><span class="ico">🌴</span>Vie</button>
    </div>
  </footer>

  <div id="voile"></div>
  <section class="feuille" id="feuille">
    <div class="tete">
      <div class="gauche"><button class="retour" id="feuille-retour" hidden>‹ Retour</button><h2 id="feuille-titre">—</h2></div>
      <button id="feuille-fermer" aria-label="Fermer">✕</button>
    </div>
    <div class="corps" id="feuille-corps"></div>
  </section>

  <div id="modale"><div class="boite"><h2 id="mod-titre"></h2><div class="texte" id="mod-texte"></div><div class="choix" id="mod-choix"></div></div></div>

  <div id="plein"></div>
</div>

<script>
"use strict";
/* =====================================================================
   MAISHA v2 — simulateur de vie et de dynastie (façon BitLife).
   Économie réaliste (impôts, coût de la vie, découvert), entreprise,
   immobilier locatif, célébrité, politique et gestion du pays,

  "Magnat de l'import-export","Fondatrice d'une startup à succès","Armateur de la flotte du canal"];
const VEHICULES = [

/* ---------------- utilitaires d'état ---------------- */

function rel(type, nom, age, genre){
  return {type, nom, age, genre: genre || (alea(2)?"F":"M"), barre: 60+alea(41), vivant:true,
          argent:0, metier:null, salaire:0, statut:null, marie:false};
}
function pays(){ return etat.monde[etat.pays]; }
function tauxImpot(){
  const p = pays();
  const base = 10 + p.dev/4;
  const ajust = (p.gouv && p.gouv.impot!=null) ? p.gouv.impot : 0;
  return Math.max(0.03, Math.min(0.60, (base + ajust) / 100));
}
function dejaFait(cle){
  if(etat.faits[cle]) return true;
  etat.faits[cle] = true;
  return false;
}
function charisme(){ return Math.round((etat.look + etat.intel)/2); }
function competence(r){
  if(r.competence==null){
    let c = 30 + alea(45);
    if(r.statut==="diplômé") c += 15;
    if(r.type==="conjoint" && r.metier) c += 10;
    r.competence = Math.min(95, c);
  }
  return r.competence;
}
function normaliserEntreprise(e){
  if(e.caisse==null) e.caisse = 0;
  if(e.monSalaire==null) e.monSalaire = 0;
  if(!e.employes) e.employes = [];
  if(!e.strategie) e.strategie = "equilibre";
  if(e.stock==null) e.stock = 40;
  if(e.qualite==null) e.qualite = 45;
  if(e.reputation==null) e.reputation = 30;
  if(e.taille==null) e.taille = 0;
  if(e.dette==null) e.dette = 0;
  if(e.produits==null) e.produits = [];
  if(e.dernier==null) e.dernier = null;
  return e;
}
function tailleEnt(e){ return TAILLES[e.taille||0]; }
function employeDe(nom){ return (etat.entreprises||[]).some(e => (e.employes||[]).some(x=>x.nom===nom)); }
function libererEmployes(e){
  for(const emp of (e.employes||[])){
    if(emp.externe) continue;
    const r = etat.relations.find(x=>x.nom===emp.nom);
    if(r){ r.metier = null; r.salaire = 0; }
  }
  e.employes = [];
}
function candidatsDuJour(){
  if(!etat.candidats || etat.candidats.age !== etat.age){
    const liste = [];
    for(let i=0;i<3;i++){
      const g = alea(2)?"F":"M";
      const comp = 25+alea(70);
      liste.push({
        nom: parmi(g==="F"?PRENOMS_F:PRENOMS_M)+" "+parmi(NOMS),
        genre:g, age:20+alea(30), competence:comp,
        pretention: Math.round((comp*130 + alea(3000))/500)*500
      });
    }
    etat.candidats = {age: etat.age, liste};
  }
  return etat.candidats.liste;
}
function estPolitique(){ return !!etat.politique; }
function enfants(){ return etat.relations.filter(r=>r.type==="enfant" && r.vivant); }

function sauver(){ try{ localStorage.setItem(CLE, JSON.stringify(etat)); }catch(e){} }
function charger(){
  try{
    const brut = localStorage.getItem(CLE);
    if(brut){
      etat = JSON.parse(brut);
      // migration des anciennes sauvegardes
      if(etat){
        if(etat.entreprise){ etat.entreprises = [etat.entreprise]; delete etat.entreprise; }
        if(!etat.entreprises) etat.entreprises = [];
        for(const e of etat.entreprises) normaliserEntreprise(e);
        if(etat.compPro==null) etat.compPro = 10;
        if(!etat.difficulte) etat.difficulte = "normal";
        if(etat.monde) for(const n in etat.monde){
          const p = etat.monde[n];
          if(p.edu==null) p.edu = p.dev;
          if(p.peuple==null) p.peuple = 50;
        }
      }
      return true;
    }
  }catch(e){}
  return false;
}

/* ---------------- création d'une vie ---------------- */

function nouvelleVie(opts){
  opts = opts || {};
  const genre = opts.genre || (alea(2) ? "F" : "M");
  const prenom = (opts.prenom && opts.prenom.trim()) || parmi(genre==="F" ? PRENOMS_F : PRENOMS_M);
  const nom = opts.nom || parmi(NOMS);
  const [ville, paysNom] = opts.lieu || parmi(VILLES);
  const monde = {};
  for(const p in PAYS_DEF) monde[p] = {...PAYS_DEF[p]};
  const dif = DIFFICULTES[opts.difficulte] ? opts.difficulte : "normal";
  const D = DIFFICULTES[dif];
  etat = {
    difficulte: dif,
    prenom, nom, genre, ville, pays:paysNom, age:0, generation:1,
    sante: Math.round((70+alea(31)) * (dif==="survie"?0.8:dif==="difficile"?0.9:1)),
    bonheur: 70+alea(31),
    intel: 30+alea(51), look: 30+alea(51), celebrite: 0, compPro: 5+alea(10), mba:false, anda:false,
    argent: D.depart, emploi:null, filiere:null,
    etude:"aucune", anneesEtude:0, diplome:false,
    entreprises:[], politique:null, royaume:null,
    pension:0, maladie:null, petitsEnfants:0, anneesTravail:0, candidats:null,
    prison:0, faits:{}, relations:[], biens:[], journal:[], monde, mort:false
  };
  const nomMere = parmi(PRENOMS_F)+" "+nom, nomPere = parmi(PRENOMS_M)+" "+nom;
  etat.relations.push(rel("mere", nomMere, 20+alea(18), "F"));
  etat.relations.push(rel("pere", nomPere, 22+alea(20), "M"));
  if(alea(2)){ const g = alea(2)?"F":"M"; etat.relations.push(rel(g==="F"?"soeur":"frere", parmi(g==="F"?PRENOMS_F:PRENOMS_M)+" "+nom, alea(10), g)); }
  nouvelleAnnee();
  ecrire(`Je m'appelle ${prenom} ${nom}. Je suis née${genre==="F"?"":""} ${genre==="F"?"fille":"garçon"} à ${ville}, ${paysNom}.`.replace("née g","né g"), "bon");
  ecrire(`Ma mère est ${nomMere} et mon père est ${nomPere}.`);
  ecrire(`${D.ico} Mode ${D.nom} — ${D.desc}`, "info");
  if(D.depart) ecrire(`Ma famille m'a ouvert un livret avec ${euros(D.depart)}.`, "argent");
  sauver(); toutAfficher();
  $("plein").classList.remove("ouvert");
}

function nouvelleAnnee(){ etat.journal.push({age: etat.age, lignes: []}); if(etat.journal.length>90) etat.journal.shift(); }
function ecrire(txt, classe){ etat.journal[etat.journal.length-1].lignes.push({txt, classe: classe||""}); }

function afficherJournal(){
  const J = $("journal");
  J.innerHTML = etat.journal.map(an => `
    <div class="annee">
      <h3>${an.age === 0 ? "Naissance" : an.age + " an" + (an.age>1?"s":"")}</h3>
      ${an.lignes.map(l => `<p class="${l.classe}">${l.txt}</p>`).join("")}
    </div>`).join("");
  J.scrollTop = J.scrollHeight;
}

/* ---------------- affichage global ---------------- */

function libelleEtat(){
  if(etat.prison>0) return "En prison ("+etat.prison+" an"+(etat.prison>1?"s":"")+" restants)";
  if(etat.royaume) return etat.age>=18
    ? (etat.genre==="F"?"Reine":"Roi")+" — "+etat.royaume.nom
    : (etat.genre==="F"?"Princesse héritière":"Prince héritier");
  if(etat.politique && etat.politique.niveau>0) return NIVEAUX_POL[etat.politique.niveau];
  if(etat.pension && !etat.emploi) return "Retraité"+(etat.genre==="F"?"e":"");
  if(etat.emploi) return etat.emploi.titre;
  if(etat.entreprises && etat.entreprises.length)
    return "Patron·ne · "+(etat.entreprises.length>1 ? etat.entreprises.length+" entreprises" : etat.entreprises[0].type);
  if(etat.celebrite>=50) return "Star ⭐";
  if(etat.etude==="universite") return "Étudiant"+(etat.genre==="F"?"e":"")+" en "+etat.filiere;
  if(etat.etude!=="aucune" && etat.age<18) return "Scolarisé"+(etat.genre==="F"?"e":"");
  return "Sans emploi";
}

function toutAfficher(){
  $("avatar").textContent = etat.prenom[0];

  elArgent.classList.toggle("negatif", etat.argent < 0);

    $("v-"+id).textContent = borne(etat[cle]||0);

  $("ligne-comppro").style.display = (etat.compPro||0)>15 ? "flex" : "none";
  afficherJournal();
}

/* ---------------- moteur : vieillir d'un an ---------------- */

function vieillir(){
  if(etat.mort) return;
  etat.age++;
  etat.faits = {};
  nouvelleAnnee();

  // dérive naturelle
  etat.bonheur = borne(etat.bonheur + alea(7) - 3);
  if(etat.age > 45) etat.sante = borne(etat.sante - (1 + alea(Math.max(1,(etat.age-45)/8))));
  if(etat.age > 30) etat.look = borne(etat.look - alea(2));
  if(etat.celebrite > 0) etat.celebrite = borne(etat.celebrite - (3+alea(4)));

  // maladie non soignée
  if(etat.maladie){
    etat.maladie.annees = (etat.maladie.annees||0)+1;
    etat.sante = borne(etat.sante - etat.maladie.degats);
    ecrire(`Je souffre toujours de ${etat.maladie.nom}. Il faut me soigner à l'hôpital (${euros(etat.maladie.cout)}).`, "mauvais");
  }

  // le monde évolue
  evolutionMonde();

  // prison : année blanche
  if(etat.prison > 0){
    etat.prison--;
    etat.bonheur = borne(etat.bonheur - 8);
    ecrire("J'ai passé l'année derrière les barreaux."+(etat.prison===0?" Je suis enfin libre !":""), "mauvais");
    finDeTour(); return;
  }

  // scolarité
  ecole();

  /* ----- revenus ----- */
  let revenus = 0, depenses = 0;
  const imp = tauxImpot();

  // retraite à 65 ans
  if(etat.age>=65 && etat.emploi && !etat.emploi.politique){
    etat.pension = Math.round(etat.emploi.salaire * (etat.anneesTravail>=10 ? 0.4 : 0.25));
    ecrire(`À 65 ans, je prends ma retraite de ${etat.emploi.titre}. Pension : ${euros(etat.pension)}/an.`, "bon");
    etat.emploi = null;
  }
  if(etat.pension && !etat.emploi) revenus += Math.round(etat.pension*(1-imp/2));

  if(etat.emploi){
    const brut = etat.emploi.salaire;
    revenus += Math.round(brut*(1-imp));
    etat.anneesTravail++;
    etat.compPro = borne((etat.compPro||0) + 1); // l'expérience forge la compétence
    etat.emploi.annees++;
    if(!etat.emploi.politique && etat.emploi.annees % 4 === 0 && alea(2)){
      const augm = Math.round(brut * 0.12);
      etat.emploi.salaire += augm;
      ecrire(`Promotion au travail : +${euros(augm)} brut/an.`, "argent");
    }
  }

  const faillites = [];
  for(const e of (etat.entreprises||[])){
    e.employes = (e.employes||[]).filter(emp => {
      if(emp.externe) return true;
      const r = etat.relations.find(x=>x.nom===emp.nom);
      return r && r.vivant;
    });

    // chiffre du fonds de commerce + production des employés
    normaliserEntreprise(e);
    const S = STRATEGIES[e.strategie] || STRATEGIES.equilibre;

    // le stock limite l'activité
    const dispo = Math.min(100, e.stock);
    const tauxAct = dispo < 20 ? 0.35 : dispo < 45 ? 0.7 : 1;
    if(dispo < 20) ecrire(`📦 « ${e.nom} » tourne au ralenti : les rayons sont vides, il faut racheter du stock !`, "mauvais");
    e.stock = Math.max(0, e.stock - (18 + e.taille*6));

    // qualité et réputation dérivent selon la stratégie
    e.qualite = borne(e.qualite + S.qual - 1);
    e.reputation = borne(e.reputation + S.repu - 2 + Math.round((e.qualite-50)/20));

    const facteurRepu = 0.6 + e.reputation/100;      // 0.6 → 1.6
    const facteurQual = 0.7 + e.qualite/160;         // 0.7 → 1.3
    const marge = ((alea(31)-8) + e.niveau*3 + (pays().eco-50)/5) * diff().marge * S.marge;
    const chiffre = Math.round(e.valeur * marge/100 * S.ca * facteurRepu * facteurQual * tauxAct);
    let prod = 0;
    const demissionnaires = [];
    for(const emp of e.employes){
      const r = emp.externe ? null : etat.relations.find(x=>x.nom===emp.nom);
      const comp = emp.externe ? emp.competence : competence(r);
      const poste = POSTES.find(p=>p.nom===emp.poste) || POSTES[POSTES.length-1];
      const alaHauteur = comp >= poste.req;
      prod += Math.round(comp * 260 * poste.mult * (alaHauteur ? 1 : 0.45));
      // l'expérience fait progresser la compétence
      emp.exp = (emp.exp||0)+1;
      if(emp.exp % 3 === 0){
        if(emp.externe) emp.competence = Math.min(95, emp.competence+1);
        else if(r) r.competence = Math.min(95, competence(r)+1);
      }
      if(r){ r.salaire = emp.salaire; r.barre = borne(r.barre + 2); }
      if(!alaHauteur && alea(3)===0)
        ecrire(`⚠️ ${emp.nom} n'a pas le niveau pour le poste de ${emp.poste.toLowerCase()} (compétence ${comp}, requis ${poste.req}) : la production s'en ressent.`, "mauvais");
      if(emp.salaire < comp*120){
        if(r) r.barre = borne(r.barre - 10);
        if(alea(3)===0) demissionnaires.push(emp);
      }
    }
    for(const emp of demissionnaires){
      const r = emp.externe ? null : etat.relations.find(x=>x.nom===emp.nom);
      ecrire(`${emp.nom} claque la porte de « ${e.nom} » : trop mal payé${(r?r.genre:emp.genre)==="F"?"e":""} pour ses compétences.`, "mauvais");
      if(r){ r.metier = null; r.salaire = 0; r.barre = borne(r.barre-8); }
      e.employes = e.employes.filter(x=>x!==emp);
    }

    const masse = (e.monSalaire||0) + e.employes.reduce((s,x)=>s+x.salaire,0);
    prod = Math.round(prod * tauxAct);
    const ca = Math.max(0, chiffre) + prod;
    const interets = Math.round((e.dette||0) * 0.08);
    if(e.dette){
      const rembours = Math.min(e.dette, Math.round(e.dette*0.15));
      e.dette -= rembours;
      e.caisse -= rembours;
    }
    let resultat = chiffre + prod - masse - interets;
    if(resultat > 0) resultat = Math.round(resultat*(1-imp));
    e.caisse = (e.caisse||0) + resultat;

    // mon salaire de dirigeant (versé par la caisse, imposé comme un salaire)
    if(e.monSalaire) revenus += Math.round(e.monSalaire*(1-imp));

    // l'entreprise capitalise si elle est bénéficiaire (surtout en expansion)
    if(resultat > 0) e.valeur += Math.round(resultat * (e.strategie==="expansion" ? 0.35 : 0.15));

    e.dernier = {ca, masse, interets, resultat, caisse:e.caisse};
    ecrire(`${e.ico} « ${e.nom} » (${tailleEnt(e).nom}) : CA ${euros(ca)}, salaires ${euros(masse)}${interets?", intérêts "+euros(interets):""}, résultat ${resultat>=0?"+":""}${euros(resultat)} → trésorerie ${euros(e.caisse)}.`, resultat>=0?"argent":"mauvais");

    if(e.caisse < 0){
      e.pertes = (e.pertes||0)+1;
      ecrire(`⚠️ La caisse de « ${e.nom} » est dans le rouge (${e.pertes}/3 avant la faillite). Renfloue, ajuste les salaires ou licencie !`, "mauvais");
      if(e.pertes >= 3){
        ecrire(`Faillite de « ${e.nom} ». L'entreprise est liquidée et les employés remerciés.`, "mauvais");
        libererEmployes(e);
        etat.argent += Math.max(0, Math.round(e.valeur*0.3) + e.caisse);
        faillites.push(e);
        etat.bonheur = borne(etat.bonheur-15);
      }
    } else e.pertes = 0;
  }
  if(faillites.length) etat.entreprises = etat.entreprises.filter(x=>!faillites.includes(x));

  // loyers des biens mis en location
  for(const b of etat.biens){
    if(b.type==="immobilier"){
      b.valeur = Math.max(5000, Math.round(b.valeur * (1 + (alea(9)-3 + (pays().eco-50)/10)/100)));
      if(b.loue){
        if(alea(100) < 18){
          ecrire(`${b.ico} ${b.nom} : pas de locataire cette année.`, "mauvais");
        } else {
          const loyer = Math.round(b.valeur*0.05*(1-imp));
          revenus += loyer;
          ecrire(`${b.ico} Loyers de ${b.nom.toLowerCase()} : ${euros(loyer)} (net).`, "argent");
        }
      }
    }
  }

  // salaire du conjoint : contribution de 30 % au ménage
  const cj = etat.relations.find(r=>r.vivant && r.type==="conjoint");
  if(cj && cj.salaire){
    revenus += Math.round(cj.salaire*0.3);
  }

  // royaume : impôts du royaume, trésor et liste civile du souverain
  if(etat.royaume && etat.age>=18){
    const R = etat.royaume;
    R.tresor += R.sujets*2;
    const liste = Math.min(R.tresor, 30000 + R.prestige*300);
    R.tresor -= liste;
    revenus += liste;
    ecrire(`👑 Liste civile de la couronne : ${euros(liste)} (trésor royal : ${euros(R.tresor)}).`, "argent");
  }

  /* ----- dépenses ----- */
  if(etat.age >= 18){
    const V = diff().vie;
    depenses += Math.round(2000*V); // vie courante
    const logements = etat.biens.filter(b=>b.type==="immobilier" && !b.loue);
    if(etat.age >= 20 && !logements.length) depenses += Math.round(3000*V); // locataire soi-même
    for(const b of etat.biens) if(b.type==="immobilier") depenses += Math.round(b.valeur*0.01); // entretien
    depenses += Math.round(enfants().filter(e=>e.age<18).length * 1000 * V);
    if(etat.etude==="universite") depenses += 1500;
  }

  etat.argent += revenus - depenses;
  if(etat.age>=18 && (revenus||depenses))
    ecrire(`💶 Bilan de l'année : +${euros(revenus)} de revenus, −${euros(depenses)} de dépenses (impôts ${Math.round(imp*100)} %).`, "info");

  // découvert
  if(etat.argent < 0){
    const agios = Math.round(-etat.argent*0.10);
    etat.argent -= agios;
    etat.bonheur = borne(etat.bonheur-6);
    ecrire(`Compte à découvert : la banque prélève ${euros(agios)} d'agios.`, "mauvais");
    if(etat.argent < -10000 && etat.biens.length){
      const saisi = etat.biens.shift();
      etat.argent += Math.round(saisi.valeur*0.7);
      ecrire(`L'huissier a saisi ${saisi.nom.toLowerCase()} pour éponger mes dettes.`, "mauvais");
    }
  }

  // relations
  for(const r of etat.relations){
    if(!r.vivant) continue;
    r.age++;
    r.barre = borne(r.barre - alea(4));
    if((r.type==="mere"||r.type==="pere") && r.age > 60 && alea(100) < (r.age-55)){
      r.vivant = false;
      etat.bonheur = borne(etat.bonheur - 25);
      ecrire(`${r.nom}, ${r.type==="mere"?"ma mère":"mon père"}, est décédé${r.type==="mere"?"e":""} à ${r.age} ans. Repose en paix.`, "mauvais");
    }
  }

  // la vie de mes enfants
  vieEnfants();

  // politique : vie du mandat
  politiqueAnnuelle();

  // royaume : la couronne gouverne
  royauteAnnuelle();

  // événements aléatoires
  evenementsAleatoires();

  // mortalité
  if(etat.sante <= 0){ mourir("de maladie"); return; }
  if(etat.age > 60){
    const risque = (etat.age-60) * (etat.sante < 30 ? 2.4 : 1.1);
    if(alea(100) < risque){ mourir("de vieillesse"); return; }
  }

  finDeTour();
}

function finDeTour(){ sauver(); toutAfficher(); prochaineModale(); }

/* ---------------- le monde ---------------- */

function evolutionMonde(){
  for(const nomP in etat.monde){
    const p = etat.monde[nomP];
    p.eco = Math.max(5, Math.min(95, p.eco + alea(7)-3));
    p.dev = Math.max(5, Math.min(95, p.dev + (p.eco > p.dev ? 1 : (alea(3)===0 ? -1 : 0))));
    p.corr = Math.max(5, Math.min(95, p.corr + alea(5)-2));
    p.edu = Math.max(5, Math.min(95, (p.edu==null?p.dev:p.edu) + (p.dev > p.edu ? 1 : 0) - (alea(4)===0 ? 1 : 0)));
    p.peuple = Math.max(5, Math.min(95, Math.round((p.peuple==null?50:p.peuple) + (p.eco-50)/15 + (45-p.corr)/25 + alea(5)-2)));
  }
  const p = pays();
  if(alea(12)===0){
    const evs = [
      ()=>{ p.eco = Math.max(5,p.eco-10); ecrire(`📰 Crise économique en ${etat.pays} : les affaires tournent au ralenti.`, "mauvais"); },
      ()=>{ p.eco = Math.min(95,p.eco+8); ecrire(`📰 Boom touristique en ${etat.pays}, l'économie repart !`, "bon"); },
      ()=>{ p.corr = Math.min(95,p.corr+8); ecrire(`📰 Scandale de corruption au sommet de l'État en ${etat.pays}.`, "mauvais"); },
    ];
    if(etat.pays==="Comores"||etat.pays==="Mayotte"||etat.pays==="Madagascar")
      evs.push(()=>{ p.eco=Math.max(5,p.eco-6); p.dev=Math.max(5,p.dev-2); ecrire("📰 Un cyclone a frappé l'archipel. Reconstruction en cours.", "mauvais"); });
    parmi(evs)();
  }
}

function libellePays(p){
  const b = [];
  b.push(p.dev>=70 ? "Pays développé" : p.dev>=45 ? "En développement" : "Peu développé");
  b.push(p.corr>=60 ? "Très corrompu" : p.corr>=40 ? "Corruption notable" : "Institutions saines");
  b.push(p.eco>=65 ? "Économie florissante" : p.eco>=40 ? "Économie stable" : "Économie fragile");
  b.push((p.edu||50)>=70 ? "Peuple très éduqué" : (p.edu||50)>=45 ? "Éducation moyenne" : "Éducation faible");
  b.push((p.peuple||50)>=65 ? "😊 Peuple heureux" : (p.peuple||50)<=35 ? "😠 Peuple en colère" : "😐 Peuple partagé");
  return b;
}
function scorePays(p){ return p.dev + p.eco + (p.edu||50) - p.corr; }
function budgetNational(p){ return Math.round((p.eco*8 + p.dev*6) * 1000); }
function normaliserGouv(p){
  if(!p.gouv) p.gouv = {edu:20, sante:20, infra:20, ia:5, secu:15, fonction:20,
                        smic:Math.round(120 + p.dev*4), salMinistres:2, impot:null};
  return p.gouv;
}

/* ---------------- scolarité ---------------- */

function ecole(){
  const g = etat.genre==="F";
  if(etat.age===3){ etat.etude="maternelle"; ecrire("Première rentrée à l'école maternelle."); }
  if(etat.age===6){ etat.etude="primaire"; ecrire("J'entre à l'école primaire."); }
  if(etat.age===11){ etat.etude="college"; ecrire("Direction le collège !"); }
  if(etat.age===15){ etat.etude="lycee"; ecrire("Me voilà au lycée."); }
  if(etat.age===18 && etat.etude==="lycee"){
    const reussite = etat.intel > 35 || alea(3)>0;
    if(reussite){
      etat.etude="bac"; ecrire("J'ai obtenu mon baccalauréat !", "bon");
      fileEvenements.push({
        titre:"Et maintenant ?",
        texte:"Le bac en poche, il faut choisir la suite. L'université coûte 1 500 € par an.",
        choix: FILIERES.slice(0,4).map(f => ({label:"Étudier : "+f, effet(){
          etat.etude="universite"; etat.filiere=f; etat.anneesEtude=0;
          ecrire("Je m'inscris à l'université en "+f+".", "bon");
        }})).concat([{label:"Travailler directement", effet(){
          etat.etude="fini"; ecrire("Pas d'études pour moi, je me lance dans la vie active.");
        }}])
      });
    } else {
      etat.etude="fini";
      ecrire("J'ai raté le bac… La vie active commence plus tôt que prévu.", "mauvais");
    }
  }
  if(etat.etude==="universite"){
    etat.anneesEtude++;
    etat.intel = borne(etat.intel + 2 + alea(3));
    if(etat.anneesEtude>=4){
      etat.etude="fini"; etat.diplome=true;
      ecrire(`Diplômé${g?"e":""} de l'université en ${etat.filiere} ! 🎓`, "bon");
    }
  }
  if(etat.etude!=="aucune" && etat.age>=3 && etat.age<18) etat.intel = borne(etat.intel + 1 + alea(2));
}

/* ---------------- politique ---------------- */

function politiqueAnnuelle(){
  if(!etat.politique) return;
  const P = etat.politique, p = pays();
  P.annees++;
  // popularité : suit la santé du pays et le moral du peuple
  P.pop = borne(P.pop + (p.eco-50)/12 + ((p.peuple||50)-50)/10 - 1 + alea(5)-2);

  if(P.niveau === 4){ // Président : gouverner
    P.anneesMandat++;
    appliquerBudget();
    fileEvenements.push({
      titre:`Gouverner ${etat.pays} — an ${P.anneesMandat}`,
      texte:`Développement ${p.dev} · Économie ${p.eco} · Éducation ${p.edu||50} · Corruption ${p.corr} · Moral du peuple ${p.peuple||50}. Quelle est la priorité du budget cette année ?`,
      choix:[
        {label:"🏫 Écoles et hôpitaux", effet(){ p.dev=Math.min(95,p.dev+3); p.edu=Math.min(95,(p.edu||50)+3); p.peuple=Math.min(95,(p.peuple||50)+3); P.pop=borne(P.pop+4);
          ecrire("J'ai investi le budget dans les écoles et les hôpitaux. Le pays progresse et le peuple respire.", "bon"); }},
        {label:"🛣️ Grands travaux (routes, port, électricité)", effet(){ p.eco=Math.min(95,p.eco+4); p.dev=Math.min(95,p.dev+2); p.peuple=Math.min(95,(p.peuple||50)+1); P.pop=borne(P.pop+2);
          ecrire("Les grands chantiers sont lancés : routes, port, électricité pour tous.", "bon"); }},
        {label:"🎓 Universités et recherche", effet(){ p.edu=Math.min(95,(p.edu||50)+5); p.dev=Math.min(95,p.dev+2); P.pop=borne(P.pop+3);
          ecrire("Nouvelles universités, bourses, laboratoires : la jeunesse du pays s'élève.", "bon"); }},
        {label:"🤖 Plan national IA & numérique", effet(){ p.edu=Math.min(95,(p.edu||50)+4); p.eco=Math.min(95,p.eco+4); P.pop=borne(P.pop+2);
          ecrire("Lancement du plan national IA & numérique : formation massive, fibre, startups. Le pays entre dans le futur.", "bon"); }},
        {label:"⚖️ Lutte anticorruption", effet(){ p.corr=Math.max(5,p.corr-7); p.peuple=Math.min(95,(p.peuple||50)+3); P.pop=borne(P.pop+3);
          ecrire("Opération mains propres : plusieurs ministres limogés, le peuple applaudit.", "bon"); }},
        {label:"💰 Détourner des fonds publics", effet(){
          const detour = 30000+alea(70000);
          etat.argent += detour; p.corr=Math.min(95,p.corr+8); p.peuple=Math.max(5,(p.peuple||50)-5); P.pop=borne(P.pop-4);
          ecrire(`J'ai discrètement détourné ${euros(detour)} des caisses de l'État…`, "argent");
          if(alea(100) < p.corr/2){
            etat.prison = 3+alea(5);
            etat.politique = null; etat.emploi = null;
            etat.bonheur = borne(etat.bonheur-30);
            ecrire(`SCANDALE ! Le détournement est révélé : destitution et ${etat.prison} ans de prison.`, "mauvais");
          }
        }},
      ]
    });
    if(P.anneesMandat >= 5){
      P.anneesMandat = 0;
      fileEvenements.push({
        titre:"Élection présidentielle",
        texte:`Fin du mandat. Popularité : ${P.pop}/100. Se représenter coûte 10 000 € de campagne.`,
        choix:[
          {label:"Se représenter (10 000 €)", effet(){
            etat.argent -= 10000;
            if(alea(100) < P.pop){ ecrire("RÉÉLU·E à la présidence ! Le peuple m'a renouvelé sa confiance.", "bon"); }
            else {
              ecrire("Battu·e dans les urnes. Je quitte le palais présidentiel la tête haute.", "mauvais");
              P.niveau = 2; etat.emploi = {titre:"Député", salaire:SALAIRES_POL[2], annees:0, politique:true};
            }
          }},
          {label:"Se retirer de la vie politique", effet(){
            ecrire("Je me retire après mon mandat présidentiel. Place à la relève.");
            etat.politique = null; etat.emploi = null;
          }},
        ]
      });
    }
  }
}

/* ---------------- la vie des enfants ---------------- */

const NIVEAUX_POL_PROCHE = ["conseiller municipal","maire","député","ministre","président"];

function vieEnfants(){
  for(const r of etat.relations){
    if(!r.vivant) continue;
    if(r.type==="enfant") vieEnfant(r);
    else if(r.type==="frere" || r.type==="soeur" || r.type==="ami") vieProche(r);
  }
  reunionFamiliale();
}

/* --- un enfant vit sa vie tout seul : études, métier, entreprise, politique,
       mariage, enfants, réussite… ou la rue --- */
function vieEnfant(e){
  e.argent = e.argent||0;
  e.enfants = e.enfants||0;
  const g = e.genre==="F";
  // scolarité choisie par les parents
  if(e.age>=4 && e.age<18){
    const gains = {publique:1, privee:3, etranger:5}, couts = {publique:0, privee:2500, etranger:9000};
    const ec = e.ecole || "publique";
    e.competence = Math.min(95, competence(e) + gains[ec]);
    if(couts[ec]) etat.argent -= couts[ec];
    if(e.age===17 && ec!=="publique")
      ecrire(`🎓 ${e.nom} termine sa scolarité (${ec==="etranger"?"études à l'étranger":"école privée"}) avec une compétence de ${e.competence}/100.`, "bon");
  }
  const comp = competence(e);

  if(e.age===18){
    if(alea(100) < 30 + comp/3){ e.statut="étudiant"; ecrire(`🎒 ${e.nom} entre à l'université.`, "bon"); }
    else { e.statut="cherche"; ecrire(`${e.nom} a fini l'école et cherche du travail.`); }
  }
  if(e.statut==="étudiant" && e.age>=22){
    e.statut="diplômé"; e.competence = Math.min(95, comp+10);
    ecrire(`🎓 ${e.nom} décroche son diplôme universitaire !`, "bon");
  }

  // chercher du travail — l'échec répété mène à la précarité
  if(e.age>=18 && !e.metier && !e.entreprise && e.statut!=="étudiant"){
    const chance = 35 + comp/2 + diff().embauche;
    if(alea(100) < chance){
      const dispo = EMPLOIS.filter(x => (e.statut==="diplômé" || !x.diplome) && (x.intel||0) <= comp+15);
      const m = parmi(dispo.length?dispo:EMPLOIS.slice(0,3));
      e.metier = m.titre; e.salaire = m.salaire; e.echecs = 0;
      if(e.sdf){ e.sdf=false; ecrire(`🙏 ${e.nom} a retrouvé du travail (${m.titre.toLowerCase()}) et un toit. Quel soulagement.`, "bon"); }
      else ecrire(`💼 ${e.nom} a été embauché${g?"e":""} comme ${m.titre.toLowerCase()} (${euros(m.salaire)}/an).`, "bon");
    } else {
      e.echecs = (e.echecs||0)+1;
      if(e.echecs===3 && !e.sdf) ecrire(`😟 ${e.nom} enchaîne les refus et commence à désespérer.`, "mauvais");
      if(e.echecs>=5 && !e.sdf && e.argent<500){
        e.sdf = true; etat.bonheur = borne(etat.bonheur-15);
        ecrire(`💔 ${e.nom} est à la rue. Sans travail ni économies, ${g?"elle":"il"} dort chez des connaissances. Aide-${g?"la":"le"} !`, "mauvais");
      }
    }
  }

  // revenus du travail
  if(e.metier){
    e.argent += Math.round(e.salaire*0.35);
    if(alea(8)===0 && !employeDe(e.nom)){
      e.salaire = Math.round(e.salaire*1.1);
      if(alea(3)===0) ecrire(`📈 ${e.nom} a été augmenté${g?"e":""} : ${euros(e.salaire)}/an.`, "bon");
    }
    // licenciement si compétence faible
    if(!employeDe(e.nom) && comp<35 && alea(14)===0){
      ecrire(`${e.nom} a perdu son poste de ${e.metier.toLowerCase()}. La vie est dure.`, "mauvais");
      e.metier = null; e.salaire = 0;
    }
  }

  // créer sa propre entreprise
  if(e.age>=24 && !e.entreprise && !e.sdf && comp>=50 && e.argent>=12000 && alea(9)===0){
    const t = parmi(TYPES_ENTREPRISE);
    e.entreprise = {type:t.type, ico:t.ico, nom:e.nom.split(" ")[0]+" "+parmi(["& Fils","Group","Océan","Invest"]), valeur:10000};
    e.argent -= 10000; e.metier = "Patron·ne — "+t.type; e.salaire = 0;
    etat.bonheur = borne(etat.bonheur+8);
    ecrire(`🏭 ${e.nom} a créé sa propre entreprise : ${t.ico} « ${e.entreprise.nom} » (${t.type}) ! Quelle fierté.`, "bon");
  }
  if(e.entreprise){
    const res = Math.round(e.entreprise.valeur * ((alea(45)-12) + comp/4) / 100 * diff().marge);
    e.entreprise.valeur = Math.max(2000, e.entreprise.valeur + Math.round(res*0.4));
    e.argent += Math.max(0, Math.round(res*0.6));
    if(res>0 && alea(3)===0) ecrire(`💰 L'entreprise de ${e.nom} tourne bien : ${euros(res)} de bénéfices cette année.`, "argent");
    if(res<0 && alea(3)===0) ecrire(`📉 L'entreprise de ${e.nom} traverse une mauvaise passe (${euros(res)}).`, "mauvais");
    if(e.entreprise.valeur<=2500 && alea(3)===0){
      ecrire(`${e.nom} a dû fermer « ${e.entreprise.nom} ». ${g?"Elle":"Il"} repart de zéro.`, "mauvais");
      e.entreprise = null; e.metier = null;
    }
    // voyage d'affaires
    if(alea(7)===0) ecrire(`✈️ ${e.nom} est parti${g?"e":""} en voyage d'affaires à ${parmi(["Dubaï","Nairobi","Istanbul","Paris","Dar es Salam"])} pour développer son business.`);
  }

  // richesse remarquable
  if(!e.riche && e.argent>=200000){
    e.riche = true; etat.bonheur = borne(etat.bonheur+12);
    ecrire(`🌟 ${e.nom} est devenu${g?"e":""} riche par ${g?"elle":"lui"}-même : plus de ${euros(e.argent)} de fortune personnelle !`, "bon");
  }

  // carrière politique autonome
  if(e.age>=25 && !e.sdf && comp>=55 && alea(11)===0){
    e.polit = (e.polit==null) ? 0 : Math.min(4, e.polit+1);
    const titre = NIVEAUX_POL_PROCHE[e.polit];
    e.metier = titre.charAt(0).toUpperCase()+titre.slice(1);
    e.salaire = [8000,15000,30000,45000,80000][e.polit];
    etat.celebrite = borne(etat.celebrite + (e.polit>=3?6:2));
    if(e.polit===4){
      const p = pays();
      p.peuple = Math.min(95,(p.peuple||50)+3);
      ecrire(`🏛️🎉 ${e.nom} A ÉTÉ ÉLU${g?"E":""} PRÉSIDENT${g?"E":""} DE ${etat.pays.toUpperCase()} ! Mon enfant dirige le pays.`, "bon");
      etat.bonheur = borne(etat.bonheur+25);
    } else ecrire(`🏛️ ${e.nom} est devenu${g?"e":""} ${titre} !`, "bon");
  }

  // mariage et petits-enfants, sans que j'aie mon mot à dire
  if(e.age>=24 && !e.marie && !e.sdf && alea(7)===0){
    e.marie = true; e.conjoint = parmi(e.genre==="F"?PRENOMS_M:PRENOMS_F)+" "+parmi(NOMS);
    etat.bonheur = borne(etat.bonheur+10);
    ecrire(`💍 ${e.nom} s'est marié${g?"e":""} avec ${e.conjoint} ! Grande fête de famille.`, "bon");
  }
  if(e.marie && e.enfants<4 && alea(6)===0){
    e.enfants++; etat.petitsEnfants = (etat.petitsEnfants||0)+1;
    etat.bonheur = borne(etat.bonheur+6);
    ecrire(`👶 ${e.nom} m'a donné un petit-enfant ! (${etat.petitsEnfants} au total)`, "bon");
  }

  // l'enfant rend à ses parents
  if(e.argent>=30000 && e.barre>50 && alea(6)===0){
    const don = Math.round(Math.min(e.argent*0.1, 8000));
    e.argent -= don; etat.argent += don;
    etat.bonheur = borne(etat.bonheur+8);
    ecrire(`❤️ ${e.nom} m'a envoyé ${euros(don)} : « Tiens ${etat.genre==="F"?"maman":"papa"}, c'est grâce à toi. »`, "argent");
  }
  if(e.argent>=60000 && e.barre>60 && etat.age>=50 && alea(9)===0){
    const cout = 3000; e.argent -= cout;
    etat.bonheur = borne(etat.bonheur+15); etat.sante = borne(etat.sante+3);
    ecrire(`✈️ ${e.nom} m'a offert un voyage à ${parmi(["La Mecque","Dubaï","Paris","Zanzibar","Maurice"])} — tout payé. Des larmes de joie.`, "bon");
  }
  if(e.entreprise && etat.age>=60 && e.barre>55 && alea(12)===0){
    etat.bonheur = borne(etat.bonheur+10);
    ecrire(`🏡 ${e.nom} a fait construire une maison pour la famille au village. Le nom ${etat.nom} est respecté.`, "bon");
  }
}

/* --- frères, sœurs et amis vivent aussi leur vie --- */
function vieProche(r){
  r.argent = r.argent||0;
  const g = r.genre==="F";
  if(r.age>=20 && !r.metier && alea(4)===0){
    const m = parmi(EMPLOIS);
    r.metier = m.titre; r.salaire = m.salaire;
  }
  if(r.metier && !employeDe(r.nom)) r.argent += Math.round(r.salaire*0.3);
  if(!r.riche && r.argent>=150000){
    r.riche = true;
    ecrire(`🌟 ${r.nom} (${LIBELLE_REL[r.type].toLowerCase()}) a fait fortune : ${g?"elle":"il"} est aujourd'hui riche.`, "bon");
  }
  // un proche riche peut aider… ou pas
  if(r.riche && alea(9)===0){
    if(r.barre>55){
      const don = 2000+alea(6000); r.argent -= don; etat.argent += don;
      ecrire(`💵 ${r.nom} m'a aidé${g?"e":""} : ${euros(don)} pour la famille.`, "argent");
    } else if(alea(2)===0){
      ecrire(`${r.nom} roule sur l'or mais ne partage rien. « Chacun sa route. »`, "mauvais");
      etat.bonheur = borne(etat.bonheur-4);
    }
  }
  // décès d'un proche : héritage seulement s'il vous aimait
  if(r.age>60 && alea(100) < (r.age-58)){
    r.vivant = false;
    etat.bonheur = borne(etat.bonheur-15);
    if(r.riche && r.barre>50){
      const leg = Math.round(r.argent*0.5);
      etat.argent += leg;
      ecrire(`${r.nom} nous a quittés à ${r.age} ans. ${g?"Elle":"Il"} m'a légué ${euros(leg)} par testament. 🕊️`, "argent");
    } else if(r.riche){
      ecrire(`${r.nom} est décédé${g?"e":""} à ${r.age} ans, riche — mais tout est allé à d'autres. Nous n'étions pas assez proches.`, "mauvais");
    } else {
      ecrire(`${r.nom} nous a quittés à ${r.age} ans. Repose en paix. 🕊️`, "mauvais");
    }
  }
}

/* --- réunion de famille : tout le clan se retrouve, et ça a un impact --- */
function reunionFamiliale(){
  if(etat.age<25 || etat.age%5!==0) return;
  const clan = etat.relations.filter(x=>x.vivant);
  if(clan.length<3) return;
  const riches = clan.filter(x=>x.riche).length;
  const cout = 1500 + clan.length*200;
  fileEvenements.push({
    titre:"🍲 Réunion de famille",
    texte:`Tout le clan ${etat.nom} se retrouve : ${clan.length} personnes, dont ${riches} qui ont réussi. On attend de toi que tu prennes ta part. Repas et frais : ${euros(cout)}.`,
    choix:[
      {label:`Tout payer et recevoir dignement (${euros(cout)})`, effet(){
        etat.argent -= cout;
        for(const x of clan) x.barre = borne(x.barre+14);
        etat.bonheur = borne(etat.bonheur+12);
        ecrire("J'ai reçu toute la famille : marmites, nattes, rires jusqu'au bout de la nuit. Le clan est soudé.", "bon");
      }},
      {label:"Partager les frais avec les autres", effet(){
        etat.argent -= Math.round(cout/3);
        for(const x of clan) x.barre = borne(x.barre+5);
        etat.bonheur = borne(etat.bonheur+5);
        ecrire("Chacun a mis sa part pour la réunion de famille. Correct, sans plus.");
      }},

function royauteAnnuelle(){
  if(!etat.royaume) return;
  const R = etat.royaume;
  R.annees++;
  if(etat.age < 18){
    ecrire(`👑 Le conseil de régence gouverne ${R.nom} en attendant ma majorité.`);
    return;
  }
  R.prestige = borne(R.prestige + alea(3)-1);
  R.sujets = Math.max(1000, Math.round(R.sujets * (1 + (R.prestige-40)/500)));

  if(R.prestige < 15 && alea(2)){
    ecrire(`RÉVOLUTION ! Le peuple de ${R.nom} renverse la couronne. Je pars en exil, dépouillé${etat.genre==="F"?"e":""} du trône.`, "mauvais");
    etat.royaume = null;
    etat.bonheur = borne(etat.bonheur-30);

  }

  const pR = pays();
  fileEvenements.push({
    titre:`👑 ${R.nom} — an ${R.annees} de règne`,
    texte:`Sujets : ${R.sujets.toLocaleString("fr-FR")} · Prestige : ${R.prestige}/100 · Trésor royal : ${euros(R.tresor)} · Moral du peuple : ${pR.peuple||50}/100. Que décide la couronne cette année ?`,
    choix:[
      {label:"🏗️ Bâtir écoles et hôpitaux", effet(){
        const c = Math.min(R.tresor, 50000); R.tresor -= c;
        R.prestige = borne(R.prestige+4); R.sujets = Math.round(R.sujets*1.03);
        pR.edu = Math.min(95,(pR.edu||50)+3); pR.dev = Math.min(95,pR.dev+2); pR.peuple = Math.min(95,(pR.peuple||50)+3);
        ecrire(`J'ai fait bâtir écoles et hôpitaux pour ${euros(c)}. Le royaume prospère et attire de nouveaux sujets.`, "bon"); }},
      {label:"🤖 Cité royale du numérique & IA", effet(){
        const c = Math.min(R.tresor, 60000); R.tresor -= c;
        R.prestige = borne(R.prestige+3);
        pR.edu = Math.min(95,(pR.edu||50)+4); pR.eco = Math.min(95,pR.eco+4);
        ecrire(`J'ai investi ${euros(c)} dans une cité du numérique : formation IA, fibre, jeunes codeurs du royaume.`, "bon"); }},
      {label:"🎉 Grande fête royale", effet(){
        const c = Math.min(R.tresor, 20000); R.tresor -= c;
        R.prestige = borne(R.prestige+2); etat.bonheur = borne(etat.bonheur+8);
        pR.peuple = Math.min(95,(pR.peuple||50)+2);
        ecrire("Fête royale somptueuse : trois jours de tambours, de festins et de feux d'artifice.", "bon"); }},
      {label:"💰 Alourdir l'impôt royal", effet(){
        const g = Math.round(R.sujets*1.5); etat.argent += g;
        R.prestige = borne(R.prestige-6);
        pR.peuple = Math.max(5,(pR.peuple||50)-5);
        ecrire(`J'ai alourdi l'impôt royal : ${euros(g)} pour ma cassette personnelle. Le peuple gronde.`, "argent"); }},
      {label:"🕊️ Année de clémence fiscale", effet(){
        R.tresor = Math.max(0, R.tresor - R.sujets);
        R.prestige = borne(R.prestige+5);
        pR.peuple = Math.min(95,(pR.peuple||50)+4);
        ecrire("J'ai allégé les impôts du royaume. Les sujets bénissent leur souverain.", "bon"); }},
    ]
  });
}

/* --- effets annuels du budget voté par le président --- */
function appliquerBudget(){
  const p = pays(), G = normaliserGouv(p);
  const somme = G.edu+G.sante+G.infra+G.ia+G.secu+G.fonction;
  const n = x => somme ? x/somme : 0;   // part relative de chaque poste
  p.edu    = Math.max(5, Math.min(95, (p.edu||50)  + (n(G.edu)   -0.18)*22 + (n(G.ia)-0.05)*12));
  p.dev    = Math.max(5, Math.min(95, p.dev        + (n(G.sante) -0.18)*14 + (n(G.infra)-0.18)*16));
  p.eco    = Math.max(5, Math.min(95, p.eco        + (n(G.infra) -0.18)*16 + (n(G.ia)-0.05)*18 - (G.smic>320?1.5:0)));
  p.corr   = Math.max(5, Math.min(95, p.corr       + (G.salMinistres>=4?2.5:G.salMinistres<=1?-2:0) - (n(G.secu)-0.15)*8));
  p.peuple = Math.max(5, Math.min(95, (p.peuple||50)
              + (n(G.sante)-0.18)*12 + (n(G.edu)-0.18)*10
              + (G.smic>=250?3:G.smic<=150?-4:0)
              - (G.salMinistres>=4?4:G.salMinistres<=1?2:0)
              - ((G.impot||0)>10?3:(G.impot||0)<-5?2:0)));
  p.edu=Math.round(p.edu); p.dev=Math.round(p.dev); p.eco=Math.round(p.eco);
  p.corr=Math.round(p.corr); p.peuple=Math.round(p.peuple);
  if(etat.politique) etat.politique.pop = borne(etat.politique.pop + (p.peuple>60?2:p.peuple<40?-3:0));
}
