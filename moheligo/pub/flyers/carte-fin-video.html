<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
@import url('fonts/local-fonts.css');
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; font-family:'Inter'; color:#fff; overflow:hidden; }

.carte { position:relative; width:1080px; height:1920px; background:#0f2a5c;
  background-image:
    radial-gradient(900px 620px at 50% 14%, rgba(56,120,220,.30) 0%, rgba(15,42,92,0) 70%),
    radial-gradient(760px 520px at 50% 96%, rgba(246,188,28,.16) 0%, rgba(15,42,92,0) 72%);
  display:flex; flex-direction:column; align-items:center; }

/* vague décorative en bas */
.vague { position:absolute; left:0; right:0; bottom:0; height:360px; opacity:.26; }

.marque { margin-top:168px; display:flex; flex-direction:column; align-items:center; gap:30px; }
.tuile { width:188px; height:188px; border-radius:48px; background:#fff;
  display:flex; align-items:center; justify-content:center; box-shadow:0 26px 60px rgba(0,0,0,.45); }
.tuile img { width:150px; height:150px; object-fit:contain; }
.nom { font-family:'Montserrat'; font-weight:900; font-size:78px; letter-spacing:-1.5px; }
.nom em { font-style:normal; color:#f6bc1c; }

.signature { margin-top:132px; text-align:center; padding:0 76px; }
.signature .l1 { font-family:'Montserrat'; font-weight:800; font-size:70px; line-height:1.12;
  color:#dbeafe; letter-spacing:-1px; }
.signature .l2 { font-family:'Montserrat'; font-weight:900; font-size:82px; line-height:1.1;
  margin-top:16px; color:#f6bc1c; letter-spacing:-1.5px; }

.trait { width:190px; height:7px; border-radius:4px; background:#f6bc1c; margin:126px 0 0; opacity:.95; }

.action { margin-top:126px; text-align:center; }
.action small { display:block; font-size:30px; font-weight:600; letter-spacing:6px; color:#93c5fd; }
.action b { display:block; font-family:'Montserrat'; font-weight:900; font-size:112px; margin-top:24px;
  letter-spacing:-2px; text-shadow:0 8px 30px rgba(0,0,0,.4); }

/* le crédit du partenaire : son logo compte autant que son nom */
.credit { position:absolute; left:0; right:0; bottom:92px;
  display:flex; align-items:center; justify-content:center; gap:30px; }
.credit .badge { width:150px; height:150px; border-radius:50%; background:#fff;
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  box-shadow:0 12px 34px rgba(0,0,0,.42); }
.credit .badge img { width:150px; height:150px; object-fit:contain; }
.credit .qui { text-align:left; }
.credit .qui span { display:block; font-size:26px; font-weight:600; letter-spacing:3px; color:#a9c2e4; }
.credit .qui b { display:block; margin-top:8px; font-family:'Montserrat'; font-weight:800;
  font-size:36px; letter-spacing:.5px; color:#fff; }
.credit .qui small { display:block; margin-top:5px; font-size:25px; font-weight:600;
  letter-spacing:.5px; color:#cfe0f6; }
</style></head><body>
<div class="carte">

  <svg class="vague" viewBox="0 0 1080 300" preserveAspectRatio="none">
    <path d="M0,150 C170,84 330,196 540,150 C750,104 900,196 1080,140 L1080,300 L0,300 Z" fill="#f6bc1c"/>
    <path d="M0,196 C190,140 340,238 540,196 C740,154 910,238 1080,190 L1080,300 L0,300 Z" fill="#ffffff" opacity=".35"/>
  </svg>

  <div class="marque">
    <div class="tuile"><img src="../../MoheliGo-logo.png" alt=""></div>
    <div class="nom">Moheli<em>Go</em></div>
  </div>

  <div class="signature">
    <div class="l1">La mer décide.</div>
    <div class="l2">Nous, on te le dit avant.</div>
  </div>

  <div class="trait"></div>

  <div class="action">
    <small>RÉSERVE TA TRAVERSÉE SUR</small>
    <b>moheligo.com</b>
  </div>

  <div class="credit">
    <div class="badge"><img src="../photos-partenaires/young-leader-logo.png" alt=""></div>
    <div class="qui">
      <span>AVEC</span>
      <b>EL FAROUK SAINDOU</b>
      <small>Comité Young Leader Mohéli 2026</small>
    </div>
  </div>

</div>
</body></html>
