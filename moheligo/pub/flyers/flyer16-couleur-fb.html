<!-- Flyer « registre Coca-Cola » — troisième modèle, pour comparer.
     Ce que fait Coca-Cola et qu'Apple ne fait pas : UNE COULEUR POSSÈDE TOUT
     LE CADRE. On reconnaît la marque avant d'avoir lu un mot. Et le message ne
     parle pas du produit : il parle d'un lien entre des gens.
       · le marine remplit le cadre du bord au bord (leur rouge)
       · un ruban clair traverse l'image (leur « dynamic ribbon », notre vague)
       · une phrase d'émotion, aucun argument, aucun prix
       · le logo petit : la couleur a déjà fait la présentation
     Rendu : node render.js flyer16-couleur-fb.html flyer-couleur-facebook.png 1080 1350 2 -->
<meta charset="utf-8">
<style>
@font-face { font-family:'Archivo'; font-weight:900; src:url(fonts/Archivo-900-latin.woff2) format('woff2'); }
@font-face { font-family:'Inter'; font-weight:500; src:url(fonts/Inter-500-latin.woff2) format('woff2'); }
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1350px; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }

.page { position:relative; width:1080px; height:1350px; overflow:hidden;
  background:
    radial-gradient(90% 60% at 20% 12%, rgba(52,110,214,.55) 0%, rgba(52,110,214,0) 60%),
    #0C2454; }

/* le ruban : notre vague, l'équivalent du « dynamic ribbon » */
.ruban { position:absolute; left:-40px; right:-40px; bottom:0; height:580px; }

.emb { position:absolute; top:74px; left:78px; display:flex; align-items:center; gap:15px; }
.emb img { width:60px; height:60px; border-radius:15px; display:block; }
.emb b { font-family:'Archivo',sans-serif; font-weight:900; font-size:25px; color:#fff;
  letter-spacing:-.6px; }
.emb b i { color:#F6BC1C; font-style:normal; }

.phrase { position:absolute; left:78px; top:300px; width:840px; z-index:3;
  font-family:'Archivo',sans-serif; font-weight:900; font-size:126px; line-height:.98;
  letter-spacing:-5px; color:#fff; text-shadow:0 14px 40px rgba(4,12,38,.5); }
.phrase span { color:#F6BC1C; }

.site { position:absolute; left:78px; bottom:88px; z-index:3;
  font-family:'Archivo',sans-serif; font-weight:900; font-size:27px; color:#fff;
  letter-spacing:-.6px; }
.site small { display:block; font-family:'Inter',sans-serif; font-weight:500; font-size:15px;
  letter-spacing:2.6px; color:rgba(255,255,255,.72); margin-top:9px; }
</style>

<div class="page">
  <svg class="ruban" viewBox="0 0 1160 420" fill="none" preserveAspectRatio="none">
    <path d="M0 232 C 250 118, 470 320, 720 214 C 900 138, 1030 190, 1160 158 L1160 420 L0 420 Z"
          fill="rgba(255,255,255,.055)"/>
    <path d="M0 232 C 250 118, 470 320, 720 214 C 900 138, 1030 190, 1160 158"
          stroke="#F6BC1C" stroke-width="9" stroke-linecap="round"/>
    <path d="M0 288 C 250 174, 470 376, 720 270 C 900 194, 1030 246, 1160 214"
          stroke="rgba(255,255,255,.5)" stroke-width="4" stroke-linecap="round"/>
  </svg>

  <div class="emb">
    <img src="logo-emblem.png" alt="">
    <b>Moheli<i>Go</i></b>
  </div>

  <div class="phrase">On se voit<br><span>de l'autre côté.</span></div>

  <div class="site">moheligo.com<small>TRAVERSÉES MARITIMES DES COMORES</small></div>
</div>
