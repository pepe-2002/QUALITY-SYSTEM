<!-- LE MODÈLE DE SIGNATURE, ENRICHI — « on doit avoir envie » (patron, 11/08/2026).
     Ce qui change par rapport à flyer17 : la phrase « On se voit de l'autre côté »
     n'est plus seulement affirmée, elle est MONTRÉE. L'autre côté est là, en bas,
     en photo, dans ses vraies couleurs. Le désir vient de l'image ; la tenue vient
     du vide et de la typographie.
     Recette de découpe (README, section « la vague ») : la photo occupe le bas, et
     une VAGUE SVG remplie de la couleur du fond vient la couper proprement. Le
     trait doré court exactement sur la coupe.
     Les quatre influences, conservées : coin de logo (Royal Air), le marine qui
     possède le cadre + une phrase de lien (Coca-Cola), le vide et l'absence de
     prix (Apple), l'or métallique et le reflet (Yas).
     ⚠️ Photo en couleurs RÉELLES : « la mer doit être vraie » (consigne du 09/08).
     Rendu : node render.js flyer18-envie-fb.html flyer-envie-facebook.png 1080 1350 2 -->
<meta charset="utf-8">
<style>
@font-face { font-family:'Archivo'; font-weight:900; src:url(fonts/Archivo-900-latin.woff2) format('woff2'); }
@font-face { font-family:'Inter'; font-weight:500; src:url(fonts/Inter-500-latin.woff2) format('woff2'); }
@font-face { font-family:'Inter'; font-weight:700; src:url(fonts/Inter-700-latin.woff2) format('woff2'); }
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1350px; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }

.page { position:relative; width:1080px; height:1350px; overflow:hidden;
  background:
    radial-gradient(86% 54% at 78% 12%, rgba(70,132,235,.55) 0%, rgba(70,132,235,0) 62%),
    #0C2454; }

/* l'autre côté : la photo, couleurs réelles */
.photo { position:absolute; left:0; right:0; bottom:0; height:660px; overflow:hidden; }
.photo img { width:100%; height:100%; object-fit:cover; object-position:center 62%; display:block; }
/* juste assez d'ombre en pied pour que l'adresse reste lisible */
.photo::after { content:''; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(12,36,84,0) 46%, rgba(8,24,58,.82) 100%); }

/* la vague qui coupe la photo, remplie de la couleur du fond */
.vague { position:absolute; left:0; right:0; bottom:472px; height:250px; }

/* YAS : le reflet qui donne envie de regarder */
.eclat { position:absolute; left:0; right:0; top:0; height:700px;
  background:linear-gradient(116deg, rgba(255,255,255,0) 42%, rgba(255,255,255,.13) 51%,
    rgba(255,255,255,0) 58%); }

/* ROYAL AIR : le coin blanc en biais */
.coin { position:absolute; top:0; left:0; width:404px; height:180px; background:#fff;
  clip-path:polygon(0 0, 100% 0, 78% 100%, 0 100%); z-index:5;
  display:flex; align-items:center; gap:15px; padding:22px 0 30px 40px;
  box-shadow:0 20px 48px rgba(4,12,40,.4); }
.coin img { width:70px; height:70px; border-radius:17px; display:block; }
.coin b { font-family:'Archivo',sans-serif; font-weight:900; font-size:30px; color:#0F2A5C;
  letter-spacing:-.9px; line-height:1; display:block; }
.coin b i { color:#F6BC1C; font-style:normal; }
.coin small { display:block; font-size:10px; font-weight:700; letter-spacing:2px;
  color:#5C6E8B; margin-top:5px; }

/* COCA-COLA + APPLE : une phrase, et du vide autour */
.phrase { position:absolute; left:80px; top:286px; width:920px; z-index:4;
  font-family:'Archivo',sans-serif; font-weight:900; font-size:114px; line-height:.97;
  letter-spacing:-4.6px; color:#fff; text-shadow:0 16px 44px rgba(4,12,38,.55); }
.phrase span { display:block;
  background:linear-gradient(178deg, #FFF3C4 4%, #F6BC1C 34%, #C98A05 62%, #FFDD73 96%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 10px 26px rgba(150,100,4,.45)); }

/* le seul objet rassurant : le billet. Manuel, règle 5. */
.billet { position:absolute; right:76px; bottom:196px; z-index:6; display:flex;
  align-items:center; gap:13px; background:rgba(255,255,255,.93); border-radius:18px;
  padding:13px 18px; box-shadow:0 22px 50px rgba(4,12,40,.44); }
.billet img { width:54px; height:54px; display:block; border-radius:8px; }
.billet b { font-family:'Archivo',sans-serif; font-weight:900; font-size:16px; color:#0F2A5C;
  letter-spacing:-.3px; line-height:1.15; display:block; }
.billet small { display:block; font-size:12px; color:#5C6E8B; margin-top:3px; }

.pied { position:absolute; left:80px; right:80px; bottom:74px; z-index:6;
  display:flex; align-items:flex-end; justify-content:space-between; }
.pied .site { font-family:'Archivo',sans-serif; font-weight:900; font-size:29px; color:#fff;
  letter-spacing:-.7px; text-shadow:0 4px 18px rgba(4,12,38,.6); }
.pied .site small { display:block; font-family:'Inter',sans-serif; font-weight:500;
  font-size:14px; letter-spacing:2.4px; color:rgba(255,255,255,.82); margin-top:8px; }
.pied .ports { font-size:13.5px; font-weight:700; letter-spacing:2.1px;
  color:rgba(255,255,255,.8); text-align:right; text-shadow:0 3px 14px rgba(4,12,38,.7); }
</style>

<div class="page">
  <div class="photo"><img src="nioumachoua-plein.jpg" alt=""></div>

  <svg class="vague" viewBox="0 0 1080 250" fill="none" preserveAspectRatio="none">
    <path d="M0 0 L1080 0 L1080 96 C 860 44, 690 178, 470 150 C 300 128, 150 178, 0 138 Z"
          fill="#0C2454"/>
    <path d="M1080 96 C 860 44, 690 178, 470 150 C 300 128, 150 178, 0 138"
          stroke="#F6BC1C" stroke-width="8" stroke-linecap="round"/>
    <path d="M1080 142 C 860 90, 690 224, 470 196 C 300 174, 150 224, 0 184"
          stroke="rgba(255,255,255,.34)" stroke-width="3.5" stroke-linecap="round"/>
  </svg>

  <div class="eclat"></div>

  <div class="coin">
    <img src="logo-emblem.png" alt="">
    <div><b>Moheli<i>Go</i></b><small>TRAVERSÉES MARITIMES</small></div>
  </div>

  <div class="phrase">On se voit<span>de l'autre côté.</span></div>

  <div class="billet">
    <img src="qr-moheligo.png" alt="">
    <div><b>Ton billet QR</b><small>dès le paiement MVola</small></div>
  </div>

  <div class="pied">
    <div class="site">moheligo.com<small>RÉSERVATION EN DEUX MINUTES</small></div>
    <div class="ports">OUROVENI · CHINDINI<br>HOANI · FOMBONI</div>
  </div>
</div>
