<!-- LA REPRISE — le visuel du jour où les vedettes repartent.
     Le patron, 12/08/2026 : « fais un flyer de reprise alors, mais pas de date au
     cas où. Ne le donne pas au robot, donne-le-moi, je le publierai. »

     SENTIMENT : LA CONFIANCE

     ✅ UTILISÉ POUR DE VRAI LE 01/09/2026 — première sortie. Fermeture du 26/08
     au 01/09, sept jours. Le patron : « les traversées sont ouvertes ».

     ⬛ MIS AUX NORMES LE 01/09/2026, AVANT DE SERVIR. Il dormait depuis le 12/08
     et le contrôle l’a refusé sur trois points le jour où on en avait besoin :
     5 apostrophes droites, aucun SENTIMENT déclaré, et surtout **aucun appel à
     l’action que la machine puisse lire** — le bandeau d’or disait « TA PLACE,
     MAINTENANT », qui n’est pas un verbe. C’est devenu « PRENDS TA PLACE ».
     📌 LA LEÇON : un visuel qu’on garde « prêt pour le jour J » n’est pas prêt.
     La norme a bougé après lui ; c’est LUI qui doit la rattraper, et le seul
     moment où on s’en aperçoit est le pire — celui où il faut publier vite.
     ⚠️ RESTE UNE RÉSERVE ASSUMÉE (alerte, pas refus) : pas de vague dorée de
     74 px. En ajouter une obligerait à déplacer le pied de page, un jour de
     reprise, sur le visuel le plus important du mois. On ne redessine pas dans
     l’urgence ce qui n’est pas faux.

     🚨 CELUI-LÀ NE PART PAS TOUT SEUL, ET C'EST VOULU.
     Il est dans `page.py` (pour que le patron l'ait sous la main) mais **PAS dans
     `calendrier.py`** : le robot publie à heure fixe, or une reprise ne se décide
     pas à 12h07 — elle se décide quand la vedette part vraiment. Un visuel qui
     annonce la reprise une heure trop tôt est exactement la promesse qu'on a
     passé la semaine à ne pas faire. ⛔ NE PAS l'ajouter à `calendrier.py`.

     ⚠️ AUCUNE DATE, AUCUN JOUR, AUCUNE HEURE dans l'image — sa seule condition
     d'usage : il est vrai le jour où le patron le publie, et il le restera à la
     prochaine fermeture. C'est ce qui le rend réutilisable sans être refait.

     POURQUOI IL REVIENT AU BLEU NORMAL (#0F2A5C) et pas au marine profond des
     avis (#0A1D42) : le changement de fond EST le message. Les jours d'avis, le
     fond s'assombrit ; le jour de la reprise, la marque reprend ses couleurs.
     Celui qui a vu les deux le comprend sans lire.

     LA LIGNE QUI PORTE TOUT : « Tu l’as su le jour où ça s’est arrêté. Tu le sais
     le jour où ça repart. » C'est le paiement de toute la semaine d'honnêteté :
     on n'a rien vendu pendant la fermeture, donc on est cru maintenant (§ 3 du
     manuel, levier réciprocité, et § 1 : la régularité est l'actif).

     ET C'EST LE SEUL JOUR OÙ L'APPEL COMMERCIAL EST PLEIN : QR, adresse,
     paiement. Les jours d'avis on ne demandait rien — ici on demande, une fois,
     clairement.

<meta charset="utf-8">
<style>
@font-face { font-family:'Cormorant'; font-weight:400; src:url(fonts/Cormorant-400-latin.woff2) format('woff2'); }
@font-face { font-family:'Archivo'; font-weight:900; src:url(fonts/Archivo-900-latin.woff2) format('woff2'); }
@font-face { font-family:'Archivo'; font-weight:700; src:url(fonts/Archivo-700-latin.woff2) format('woff2'); }

* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1350px; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }

/* le bleu de tous les jours : la marque a repris ses couleurs */
.page { position:relative; width:1080px; height:1350px; overflow:hidden; background:#0F2A5C; }
/* 🚩 02/09/2026 — ENTRÉE DANS LA FAMILLE (`famille.js`). Le visuel était à
   0/5 : aucune photo, et son appel à l'action vivait DANS une large barre
   dorée — donc ni sur la verticale de gauche, ni en pied partagé.
   📷 LA PHOTO DIT CE QUE LE TITRE DIT : une anse ouverte, la mer plate. « La
   mer est calme, on repart », montré au lieu d'être affirmé. */
/* ✂️ 02/09/2026 — LE BLOC DENSE DU BAS EST SUPPRIMÉ. Le patron : « il y a des
   flyers avec beaucoup d'info en bas ; laisse la photo et supprime le bas avec
   beaucoup d'info, fais notre style premium. »
   ⛔ CE VISUEL ÉTAIT OCCUPÉ À 39 %% DE SA SURFACE (`respiration.js`), contre
   16 % pour nos meilleurs. La grande carte blanche à liste était un héritage
   d'avant la photo : quand le visuel n'avait rien à regarder, il fallait bien
   remplir. Depuis qu'il porte une photo, cette carte ne comble plus un vide —
   elle en prend la place.
   📌 **ON N'AJOUTE PAS UNE IMAGE À UNE PAGE PLEINE : ON REMPLACE CE QUI LA
   REMPLISSAIT.** Sinon on additionne deux façons de tenir la page, et la page
   devient plus lourde qu'avant.
   ✅ Le détail pratique n'est pas perdu : il vit dans le TEXTE DU POST, qui a
   la place de l'expliquer. Le visuel dit une chose et une seule ; le texte
   développe. C'est la répartition normale entre les deux. */
.photo { position:absolute; top:0; left:0; width:1080px; height:700px; z-index:1;
  overflow:hidden; }
.photo img { width:100%; height:100%; object-fit:cover; object-position:50% 46%;
  display:block; }
.voile { position:absolute; left:0; top:0; width:1080px; height:220px; z-index:2;
  background:linear-gradient(180deg, rgba(10,29,66,.78) 0%, rgba(10,29,66,0) 100%); }
.fondu { position:absolute; left:0; top:520px; width:1080px; height:180px; z-index:2;
  background:linear-gradient(180deg, rgba(15,42,92,0) 0%, rgba(15,42,92,.46) 100%); }
.couture { position:absolute; left:0; top:626px; width:1080px; height:86px; z-index:3; }

.eclat { position:absolute; inset:0; background:linear-gradient(116deg,
  rgba(255,255,255,0) 40%, rgba(255,255,255,.085) 50%, rgba(255,255,255,0) 60%); }

.coin { position:absolute; top:0; left:0; width:404px; height:172px; background:#fff;
  clip-path:polygon(0 0, 100% 0, 78% 100%, 0 100%); z-index:4;
  display:flex; align-items:center; gap:16px; padding:18px 0 28px 40px;
  box-shadow:0 20px 48px rgba(4,12,40,.4); }
.coin img { width:74px; height:74px; border-radius:16px; display:block;  object-fit:contain;}
.coin b { font-family:'Archivo',sans-serif; font-weight:900; font-size:31px; color:#0F2A5C;
  letter-spacing:-.9px; line-height:1; display:block; }
.coin b i { color:#F6BC1C; font-style:normal; }
.coin small { display:block; font-size:10.3px; font-weight:700; letter-spacing:1.9px;
  color:#5C6E8B; margin-top:5px; }

.ligne { position:absolute; top:66px; right:76px; z-index:4; text-align:right;
  font-size:12px; font-weight:700; letter-spacing:2.6px; line-height:1.7;
  color:rgba(255,255,255,.94); }

.sur { position:absolute; left:76px; top:782px; z-index:3; font-size:14px;
  font-weight:700; letter-spacing:3.4px; color:#F6BC1C; }

/* ⚠️ MESURÉ, PAS ESTIMÉ. La règle « 0,47 × la taille par caractère » donnait 82px
   pour « La houle est retombée. » (22 caractères) — et à 82px la ligne ne tient
   pas dans les 920 px : elle passe à la ligne et recouvre le bloc suivant. À 78px
   elle mesure 876px. La règle sert à viser ; c'est `verifier.js` qui tranche.
   Ne pas remonter cette taille sans remesurer. */
.acc { position:absolute; left:76px; top:820px; width:920px; z-index:3;
  font-family:'Cormorant',serif; font-weight:400; font-size:88px; line-height:1.1;
  letter-spacing:5.0px; color:#fff; }
.acc span { display:block; color:#F6BC1C; }

.dit { position:absolute; left:76px; top:1058px; width:880px; z-index:3;
  font-size:26px; line-height:1.44; color:#CFDDF3; }
.dit b { color:#fff; font-weight:700; }

/* la carte claire : l'objet regardé, comme tous les jours de la semaine */

/* le bandeau d'or : le seul jour de la semaine où on demande vraiment */
/* 🚩 LA LARGE BARRE DORÉE A DISPARU. Elle contenait le QR, l'appel, l'adresse
   et le moyen de paiement — quatre choses dans un même bloc, occupant toute la
   largeur. C'était la silhouette qui séparait ce visuel de tous les autres.
   📌 Un bloc qui rassemble tout ne met rien en avant. L'appel à l'action reprend
   sa place à gauche, l'adresse la sienne à droite, comme partout ailleurs. */
.cta { position:absolute; left:76px; top:1120px; z-index:3;
  background:#F6BC1C; border-radius:16px; padding:18px 26px; display:inline-block;
  font-family:'Inter',sans-serif; font-weight:700; font-size:19px;
  color:#0A1D42; letter-spacing:2.4px; white-space:nowrap;
  box-shadow:0 10px 24px rgba(150,100,4,.24); }
.web { position:absolute; right:76px; top:1138px; z-index:3; text-align:right;
  font-family:'Inter',sans-serif; font-weight:700; font-size:25px; color:#fff;
  letter-spacing:.2px; }
.web small { display:block; font-family:'Inter',sans-serif; font-weight:700;
  font-size:10.5px; letter-spacing:2.4px; color:#8FA8CC; margin-bottom:4px; }

.pied { position:absolute; left:76px; right:76px; bottom:56px; z-index:3;
  border-top:2px solid rgba(246,188,28,.5); padding-top:18px;
  display:flex; justify-content:space-between; align-items:flex-start; gap:30px;
  font-size:14px; line-height:1.5; color:rgba(255,255,255,.62); }
.pied b { color:#F6BC1C; font-family:'Archivo',sans-serif; font-weight:900;
  font-size:16px; letter-spacing:-.2px; }
.pied .d { max-width:320px; text-align:right; font-size:11.5px;
  color:rgba(255,255,255,.44); }
