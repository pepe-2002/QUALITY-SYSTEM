<!-- ON NE VISITE PAS MOHÉLI, ON Y REVIENT — le registre DESTINATION.

     SENTIMENT : LA PROXIMITÉ
     Fait le 28/08/2026 à la demande du patron : « c'est mon neveu, il peut faire
     les pubs », puis « son père a accepté ».

     👦 LA PHOTO EST CELLE D'UN ENFANT, ET ÇA CHANGE DEUX CHOSES
     · l'accord vient du PÈRE (accord oral rapporté par le patron le 28/08,
       consigné dans ../photos/CREDITS-FAMILLE.md — c'est la seule trace) ;
     · le fichier d'origine reste HORS du dépôt public. Ce qui est versionné,
       c'est la photo nettoyée qui sert au visuel, rien d'autre.

     🎯 POURQUOI CE REGISTRE ET PAS « LA DIGITALISATION »
     Le patron voulait d'abord son neveu sur le flyer « l'ère de la
     digitalisation ». Refusé, et pas pour une raison de droit : cette pub-là
     montre quelqu'un qui RÉSERVE ET QUI PAIE depuis son téléphone. Un enfant de
     cinq ans ne réserve pas de traversée, donc le lecteur ne peut pas se
     reconnaître dans ce visage. Ici, au contraire, le sujet EST l'île — et un
     enfant qui rentre avec une goyave dit Mohéli mieux qu'une plage vide.

     ⚠️ AUCUNE DATE, AUCUNE MENTION DE FERMETURE SUR L'IMAGE. Leçon du 26/08 :
     un visuel qui grave « peut-être mardi » devient inutilisable le mercredi.
     La mention de fermeture va dans le TEXTE du post (service.avec_mention),
     qui, lui, se régénère à chaque publication.

     Rendu : node render.js flyer38-revenir-fb.html flyer-revenir-facebook.png 1080 1350 2 -->
<meta charset="utf-8">
<style>
@font-face { font-family:'Archivo'; font-weight:900; src:url(fonts/Archivo-900-latin.woff2) format('woff2'); }
@font-face { font-family:'Inter'; font-weight:500; src:url(fonts/Inter-500-latin.woff2) format('woff2'); }
@font-face { font-family:'Inter'; font-weight:700; src:url(fonts/Inter-700-latin.woff2) format('woff2'); }
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1350px; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }

.page { position:relative; width:1080px; height:1350px; overflow:hidden; background:#0F2A5C; }

/* LA PHOTO — cadrée sur l'enfant (42 % du haut : la tête et la goyave tiennent). */
.photo { position:absolute; top:0; left:0; width:1080px; height:840px; overflow:hidden; }
.photo img { width:100%; height:100%; object-fit:cover; object-position:50% 42%; display:block; }
/* le marine remonte DANS la photo : sans ce fondu, la coupure se voit comme un collage */
.fondu { position:absolute; left:0; top:558px; width:1080px; height:300px; z-index:2;
  background:linear-gradient(180deg, rgba(15,42,92,0) 0%, rgba(15,42,92,.55) 46%,
             rgba(15,42,92,.94) 82%, #0F2A5C 100%); }

.coin { position:absolute; top:0; left:0; width:404px; height:172px; background:#fff;
  clip-path:polygon(0 0, 100% 0, 78% 100%, 0 100%); z-index:6;
  display:flex; align-items:center; gap:16px; padding:18px 0 28px 40px;
  box-shadow:0 20px 48px rgba(4,12,40,.4); }
.coin img { width:74px; height:74px; border-radius:16px; display:block; object-fit:contain; }
.coin b { font-family:'Archivo',sans-serif; font-weight:900; font-size:31px; color:#0F2A5C;
  letter-spacing:-.9px; line-height:1; display:block; }
.coin b i { color:#F6BC1C; font-style:normal; }
/* ⚠️ L'espacement se règle ICI, PAS en écrivant « T R A V E R S É E S » dans le
   texte : les deux se cumulent, et le « S » final passait sous la diagonale du
   coin. Même défaut qu'en août sur l'en-tête du bulletin. */
.coin small { display:block; font-size:10.3px; font-weight:700; letter-spacing:3.4px;
  color:#5C6E8B; margin-top:5px; }

.sur { position:absolute; left:76px; top:800px; z-index:5; font-size:14px;
  font-weight:700; letter-spacing:3.4px; color:#F6BC1C; }

/* mesuré au rendu : « ON NE VISITE PAS MOHÉLI. » tient dans 928 px à 62 px */
.acc { position:absolute; left:76px; top:838px; width:928px; z-index:5;
  font-family:'Archivo',sans-serif; font-weight:900; font-size:62px; line-height:1.02;
  letter-spacing:-2.2px; color:#fff; }
.acc span { display:block;
  background:linear-gradient(178deg, #FFF3C4 4%, #F6BC1C 34%, #C98A05 62%, #FFDD73 96%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 8px 22px rgba(150,100,4,.38)); }

.dit { position:absolute; left:76px; top:1000px; width:840px; z-index:5;
  font-size:27px; line-height:1.48; color:#CFDDF3; }
.dit b { color:#fff; font-weight:700; }

/* le trait d'or : le même séparateur que sur les autres visuels de la marque */
.trait { position:absolute; left:76px; top:1140px; width:96px; height:6px;
  border-radius:3px; background:#F6BC1C; z-index:5; }

/* 🎯 L'APPEL À L'ACTION. Il manquait, et c'était le vrai défaut du visuel : on
   donnait une adresse (moheligo.com) sans jamais donner de VERBE. Une adresse
   dit où aller ; elle ne dit pas quoi faire, ni pourquoi maintenant.
   La pastille dorée porte l'action, l'adresse reste dessous en second. */
/* Le pied est PARTAGÉ, comme sur tous les visuels de la famille : l'appel à
   l'action à gauche sur la marge de 76, l'adresse à droite sur la même marge.
   Avant, les deux étaient collés à gauche l'un contre l'autre — même contenu,
   mais une silhouette différente de celle des autres visuels, et c'est la
   silhouette qu'on reconnaît de loin. */
.cta { position:absolute; left:76px; top:1176px; z-index:5;
  background:#F6BC1C; border-radius:16px; padding:18px 26px; display:inline-block;
  font-family:'Archivo',sans-serif; font-weight:900; font-size:24px;
  color:#0A1D42; letter-spacing:-.8px; white-space:nowrap;
  box-shadow:0 18px 40px rgba(150,100,4,.42); }
.web { position:absolute; right:76px; top:1196px; z-index:5; text-align:right;
  font-family:'Archivo',sans-serif; font-weight:900; font-size:28px;
  color:#fff; letter-spacing:-1.1px; }
.web small { display:block; font-family:'Inter',sans-serif; font-size:10.5px;
  font-weight:700; letter-spacing:2.4px; color:#8FA8CC; margin-bottom:4px; }

/* 🏆 LA VAGUE PASSE DU PIED DE PAGE À LA COUTURE — 02/09/2026.
   Le patron : « tous les flyers hors bulletin doivent se ressembler, être
   reconnaissables. » Mesuré avec `famille.js`, ce visuel était à 3/5 : sa vague
   était en bas, à 512 px de la frontière photo/marine, donc elle ne cousait
   rien. Elle bordait la page comme un liseré.
   📌 La vague est notre seule forme propriétaire : elle doit FAIRE UN TRAVAIL,
   pas décorer un bord. Ici elle tient la page en deux, comme sur `flyer48`. */
.couture { position:absolute; left:0; top:766px; width:1080px; height:86px; z-index:4; }
</style>
