<style>

* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1350px; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }

.page { position:relative; width:1080px; height:1350px; overflow:hidden; background:#0F2A5C; }

/* ⬅️ LA PHOTO EST À GAUCHE, ET C'EST LA PRISE QUI L'A DÉCIDÉ.
   Premier montage : photo à droite, texte à gauche. Au rendu, son visage
   tombait en plein dans le fondu — parce que dans la prise il se tient sur le
   BORD GAUCHE du cadre, avec le mur à sa droite. Aucun réglage de
   `object-position` ne peut le déplacer vers la droite : le recadrage `cover`
   ne montre que ce qui existe.
   📌 On ne force pas une photo dans une maquette : on met la maquette du côté
   où le sujet se trouve déjà. Bénéfice en prime — le fondu recouvre maintenant
   le pan de mur taché et l'ancienne fenêtre, qui étaient le vrai défaut du
   décor. */
.photo { position:absolute; left:0; top:0; width:648px; height:1350px; overflow:hidden; }
.photo img { width:100%; height:100%; object-fit:cover; object-position:0% 40%; display:block; }
.fondu { position:absolute; left:0; top:0; width:648px; height:1350px; z-index:2;
  background:linear-gradient(90deg, rgba(15,42,92,0) 0%, rgba(15,42,92,.10) 30%,
             rgba(15,42,92,.72) 56%, rgba(15,42,92,.97) 80%, #0F2A5C 100%); }
/* un voile par le bas, pour que la vague dorée ne se pose pas sur le carrelage */
.pied-fondu { position:absolute; left:0; bottom:0; width:648px; height:280px; z-index:3;
  background:linear-gradient(180deg, rgba(15,42,92,0) 0%, rgba(15,42,92,.70) 60%, #0F2A5C 100%); }

.coin { position:absolute; top:0; left:0; width:404px; height:172px; background:#fff;
  clip-path:polygon(0 0, 100% 0, 78% 100%, 0 100%); z-index:6;
  display:flex; align-items:center; gap:15px; padding:18px 0 28px 40px;
  box-shadow:0 20px 48px rgba(4,12,40,.4); }
.coin img { width:68px; height:68px; border-radius:16px; display:block; object-fit:contain; }
.coin b { font-family:'Archivo',sans-serif; font-weight:900; font-size:29px; color:#0F2A5C;
  letter-spacing:-.9px; line-height:1; display:block; }
.coin b i { color:#F6BC1C; font-style:normal; }
.coin small { display:block; font-size:9.5px; font-weight:700; letter-spacing:3.4px;
  color:#5C6E8B; margin-top:5px; }

.sur { position:absolute; left:592px; top:392px; z-index:5; font-size:14px;
  font-weight:700; letter-spacing:3.4px; color:#F6BC1C; }

/* colonne de 452 px : « AU PORT. » (9 signes) y tient à 66 px, mesuré */
.acc { position:absolute; left:592px; top:430px; width:412px; z-index:5;
  font-family:'Archivo',sans-serif; font-weight:900; font-size:66px; line-height:1.0;
  letter-spacing:-2.4px; color:#fff; }
.acc span { display:block;

  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 8px 22px rgba(150,100,4,.38)); }

/* UNE seule phrase sous le titre. « Une publicité = une promesse. » */

.dit b { color:#fff; font-weight:700; }

.trait { position:absolute; left:592px; top:920px; width:96px; height:6px;

.cta { position:absolute; left:592px; top:968px; z-index:5;

.web { position:absolute; left:592px; top:1076px; z-index:5;
