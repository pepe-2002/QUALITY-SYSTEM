<!-- TOUT EST LÀ — la SURFACE CLAIRE de la marque, 29/08/2026.
     Le patron, sur le flyer 42 : « c'est toujours pas esthétique. » Il avait
     raison, et le défaut n'était pas la couleur.

     🔍 LES SIX DÉFAUTS DU 42, NOMMÉS AVANT D'ÊTRE CORRIGÉS
     1. photo d'identité : plaqué au mur, centré, bras tendu, face objectif ;
     2. le mur, même corrigé, reste taché, moisi, avec une plinthe sale ;
     3. la tête touchait presque le bord — aucune respiration ;
     4. le fondu coupait le corps à l'horizontale, comme un rideau : ça lisait
        « photo collée sur un rectangle bleu », pas une image ;
     5. le bas était une dalle marine avec quatre blocs de texte empilés ;
     6. deux points de fixation en concurrence : son visage ET le téléphone.

     ✅ CE QUI LES RÈGLE, ET C'EST UN SEUL GESTE : SERRER LE CADRE.
     Un cadre serré tue le mur, la posture et le bord d'un coup. Le visage passe
     dans le flou — présent mais plus concurrent. Et `profondeur()` refabrique
     une mise au point : net sur le téléphone, décroché au-delà. C'est ÇA qui
     sépare une photo de téléphone d'une photo de campagne — un capteur de
     téléphone a tout net, et l'œil lit ça comme « amateur » sans savoir pourquoi.

     ☀️ POURQUOI CLAIR, ET POURQUOI CE N'EST PAS UNE DÉRIVE DE CHARTE
     Le mur derrière lui est clair. Poser un fondu marine dessus, c'était forcer
     la photo dans une maquette — l'erreur déjà faite au flyer 41. Ce fichier
     assume donc la SURFACE CLAIRE : mêmes couleurs, mêmes polices, même vague,
     mêmes marges. Le marine passe du fond au texte, l'or reste l'action.
     ⚠️ Le coin blanc en biais ne peut pas exister sur fond clair : il disparaît.
     Le logotype est donc posé nu, à la même marge de 76 px.
     📌 Deux surfaces déclarées valent mieux qu'une charte qu'on contourne au cas
     par cas — c'est exactement la dérive mesurée le matin même (marge 76/70,
     coin 404/392/412, vague 74/56).

     ⛔ PAS PUBLIABLE TANT QUE le patron n'a pas confirmé qu'il revient sur
     « enlève ma photo, j'aime être discret » (28/08). La photo est hors dépôt.

     Rendu : node render.js flyer43-toutestla-fb.html flyer-toutestla-facebook.png 1080 1350 2 -->
<meta charset="utf-8">
<style>
@font-face { font-family:'Archivo'; font-weight:900; src:url(fonts/Archivo-900-latin.woff2) format('woff2'); }

* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1350px; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }

.page { position:relative; width:1080px; height:1350px; overflow:hidden; background:#F4F7FD; }

/* LA PHOTO À DROITE. Le fondu part de SA GAUCHE vers le fond clair : le mur de
   la photo et le fond de la page sont tous deux clairs, la couture disparaît.
   C'est l'inverse exact du flyer 42, où le marine tranchait net dans la photo. */
/* 🙈 AUCUN VISAGE. Le patron, 29/08/2026 : « je ne veux pas mon visage sur le
   flyer. » La photo est recadrée sous le menton — et même sous le cou : le
   téléphone commence à y=628 dans la prise, le cadre est calé à 604, soit
   24 px d'air. Au-delà on remonte dans son cou.
   📐 `object-position` À 42 %, ET C'EST CALCULÉ, PAS TÂTONNÉ. Dans la photo
   recadrée (1020 px), l'écran occupe x 366→650. Mise à l'échelle en hauteur
   (1350/1275 = 1,0588), il tombe à 387→688 sur une image de 1080 px de large.
   La fenêtre visible fait 614 px, on peut donc décaler de 0 à 466 px ; pour
   que l'écran tienne entier avec de l'air, il faut décaler entre 104 et 357.
   200 px = 42 %. À 8 %, le téléphone sortait par la droite — vu au rendu. */
/* 46 px d'air en haut : sans eux le châssis du téléphone touchait le bord et
   ça se lisait comme un accident, pas comme un cadrage. */
.photo { position:absolute; right:0; top:46px; width:614px; height:1304px; overflow:hidden; }
.photo img { width:100%; height:100%; object-fit:cover; object-position:47% 0%; display:block; }
.fondu { position:absolute; right:0; top:0; width:614px; height:1350px; z-index:2;
  background:linear-gradient(90deg, #F4F7FD 0%, rgba(244,247,253,.82) 11%,
             rgba(244,247,253,.24) 28%, rgba(244,247,253,0) 48%); }

/* le logotype nu : sur fond clair, le coin blanc en biais n'existe plus */
.marque { position:absolute; left:76px; top:88px; z-index:6;
  display:flex; align-items:center; gap:15px; }
.marque img { width:62px; height:62px; object-fit:contain; display:block; }
.marque b { font-family:'Archivo',sans-serif; font-weight:900; font-size:29px;
  color:#0F2A5C; letter-spacing:-.9px; line-height:1; display:block; }
.marque b i { color:#F6BC1C; font-style:normal; }
.marque small { display:block; font-size:9.5px; font-weight:700; letter-spacing:3.4px;
  color:#7C8CA8; margin-top:5px; }

.sur { position:absolute; left:76px; top:452px; z-index:5; font-size:13px;
  font-weight:700; letter-spacing:3.4px; color:#B08405; }

/* 424 px de colonne : « TOUT » tient à 84 px, mesuré. Le titre est GROS et
   court — trois mots, une promesse. C'est la seule chose à lire en trois
   secondes. */
.acc { position:absolute; left:76px; top:492px; width:424px; z-index:5;
  font-family:'Archivo',sans-serif; font-weight:900; font-size:84px; line-height:.98;
  letter-spacing:-3.4px; color:#0F2A5C; }
.acc span { color:#C98A05; }

.dit { position:absolute; left:76px; top:766px; width:400px; z-index:5;
  font-size:23px; line-height:1.5; color:#4A5C78; }
.dit b { color:#0F2A5C; font-weight:700; }

.trait { position:absolute; left:76px; top:892px; width:82px; height:5px;
  border-radius:3px; background:#F6BC1C; z-index:5; }

.cta { position:absolute; left:76px; top:944px; z-index:5;
  background:#F6BC1C; border-radius:16px; padding:19px 28px; display:inline-block;
  font-family:'Archivo',sans-serif; font-weight:900; font-size:26px;
  color:#0A1D42; letter-spacing:-.8px; white-space:nowrap;
  box-shadow:0 16px 34px rgba(150,100,4,.30); }

.web { position:absolute; left:76px; top:1058px; z-index:5;
  font-family:'Archivo',sans-serif; font-weight:900; font-size:31px;
  color:#0F2A5C; letter-spacing:-1.1px; }
.web small { display:block; font-family:'Inter',sans-serif; font-size:11px;
  font-weight:700; letter-spacing:2.4px; color:#8FA0BC; margin-bottom:4px; }

.vague { position:absolute; left:0; bottom:0; width:1080px; height:74px; z-index:7; }
</style>
