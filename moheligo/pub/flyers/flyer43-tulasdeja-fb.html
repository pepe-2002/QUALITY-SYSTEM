<!-- TU L’AS DÉJÀ — le moment PRODUIT de la barre, 29/08, retitré le 30/08/2026.

     SENTIMENT : LE SOULAGEMENT

     🚩 LE TITRE A CHANGÉ, ET C’EST LA NORME QUI L’A EXIGÉ — 30/08/2026.
     Il disait « TOUT EST LÀ. » Le contrôle l’a refusé au § 2 : « le titre ne

     📌 Deux corrections de règle en deux jours, et elles vont dans des sens

     c’est le VISUEL qui était faible, on corrige le VISUEL. La question n’est
     jamais « qui a tort », c’est « lequel des deux est mal écrit ».

     ✅ POURQUOI « TU L’AS DÉJÀ. »
     C’est la même idée (rien à installer, rien à aller chercher), mais dite au
     lecteur, et elle répond à l’objection réelle de notre marché : les gens
     croient qu’il leur manque quelque chose pour réserver en ligne. Non — ils
     l’ont déjà dans la main, et l’image le montre avant que le texte le dise.
     Le titre ne fait que nommer ce que l’image montre (règle du 26/08).
     📐 84 px, et les deux lignes sont MESURÉES dans notre Archivo 900, pas
     estimées : « TU L’AS » = 310 px, « DÉJÀ. » = 257 px, colonne = 424 px.
     Au passage la mesure a écarté « TOUT EST DANS TA MAIN. » — 641 px sur une
     seule ligne, 505 px même à 62 px. On ne rétrécit pas la photo pour loger
     un titre : c’est le titre qui s’adapte au sujet.

     ⬛ L’HISTOIRE DU DESSIN — le patron, sur le flyer 42 : « c'est toujours pas
     esthétique. » Il avait raison, et le défaut n'était pas la couleur.

     🔍 LES SIX DÉFAUTS DU 42, NOMMÉS AVANT D'ÊTRE CORRIGÉS
     1. photo d'identité : plaqué au mur, centré, bras tendu, face objectif ;
     2. le mur, même corrigé, reste taché, moisi, avec une plinthe sale ;
     3. la tête touchait presque le bord — aucune respiration ;
     4. le fondu coupait le corps à l'horizontale, comme un rideau : ça lisait
        « photo collée sur un rectangle bleu », pas une image ;
     5. le bas était une dalle marine avec quatre blocs de texte empilés ;
     6. deux points de fixation en concurrence : son visage ET le téléphone.

     ✅ CE QUI LES RÈGLE, ET C'EST UN SEUL GESTE : SERRER LE CADRE.
     Un cadre serré tue le mur, la posture et le bord d'un coup. Le visage passe
     dans le flou — présent mais plus concurrent. Et `profondeur()` refabrique
     une mise au point : net sur le téléphone, décroché au-delà. C'est ÇA qui
     sépare une photo de téléphone d'une photo de campagne — un capteur de
     téléphone a tout net, et l'œil lit ça comme « amateur » sans savoir pourquoi.

     🎨 LE MUR EST DEVENU NOTRE MARINE — et c'était la bonne question.
     Le patron : « on utilise toujours nos couleurs, on cherche la solution sur
     le mur. » J'avais contourné le problème en passant le flyer sur fond clair
     pour épouser le mur gris. C'était se soumettre au décor. La vraie réponse
     est de SUPPRIMER le décor : `remplacer_mur()` sépare le mur du sujet sur
     deux critères mesurés — clair ET désaturé (mur : lum 210-238, sat 0,02-0,11 ;
     peau : lum 170, sat 0,30 ; polo : lum 83, sat 0,76). La peau est à trois
     fois la saturation maximale du mur : la marge est confortable.
     ✅ CONSÉQUENCE HEUREUSE : le fond de la photo étant EXACTEMENT #0F2A5C, il

     ➡️ La surface claire est donc abandonnée. On garde une seule surface, la

     ✅ LA RÉSERVE SUR LA PHOTO EST LEVÉE, et voilà comment.

.page { position:relative; width:1080px; height:1350px; overflow:hidden; background:#0F2A5C; }

/* LA PHOTO À DROITE. Le fondu part de SA GAUCHE vers le fond clair : le mur de
   la photo et le fond de la page sont tous deux clairs, la couture disparaît.
   C'est l'inverse exact du flyer 42, où le marine tranchait net dans la photo. */
/* 🙈 AUCUN VISAGE. Le patron, 29/08/2026 : « je ne veux pas mon visage sur le
   flyer. » La photo est recadrée sous le menton — et même sous le cou : le
   téléphone commence à y=628 dans la prise, le cadre est calé à 604, soit
   24 px d'air. Au-delà on remonte dans son cou.
   📐 `object-position` À 42 %, ET C'EST CALCULÉ, PAS TÂTONNÉ. Dans la photo
   recadrée (1020 px), l'écran occupe x 366→650. Mise à l'échelle en hauteur
   (1350/1275 = 1,0588), il tombe à 387→688 sur une image de 1080 px de large.
   La fenêtre visible fait 614 px, on peut donc décaler de 0 à 466 px ; pour
   que l'écran tienne entier avec de l'air, il faut décaler entre 104 et 357.
   200 px = 42 %. À 8 %, le téléphone sortait par la droite — vu au rendu. */
/* 📐 620 px, ET AUCUN FONDU. Le fond de la photo vaut #0F2A5C, la page aussi :
   il n'y a plus de frontière à camoufler. `object-position` à 13 % est calculé —
   l'écran tombe à 138→521 après mise à l'échelle, la fenêtre fait 620 px, donc
   le décalage doit rester sous 108 px ; 60 px = 13 %. */
.photo { position:absolute; right:0; top:46px; width:620px; height:1304px; overflow:hidden; }
.photo img { width:100%; height:100%; object-fit:cover; object-position:9% 0%; display:block; }
/* 🚩 620 px, EXACTEMENT LA LARGEUR DE `.photo` — et c'est une correction, pas
   un détail. Ce voile faisait 614 px alors que la photo en fait 620 : SIX
   PIXELS de photo restaient à nu, et comme le fond de la photo y est un peu
   plus clair que #0F2A5C, ça dessinait un TRAIT VERTICAL CLAIR sur toute la
   hauteur. Signalé par le patron ; mesuré ensuite sur le rendu — R passait de
   15 à 55 puis revenait à 15 en six pixels.
   📌 Deux dimensions qui doivent être égales ne se recopient pas à la main.
   Et un fond « presque » de la bonne couleur est pire qu'un fond franchement
   différent : l'œil ne voit pas une nuance, il voit une frontière.
   ⚠️ Les 4 premiers pour cent restent OPAQUES avant que le fondu commence,
   pour que le bord de la photo soit couvert franchement et non à 84 %. */
.fondu { position:absolute; right:0; top:0; width:620px; height:1350px; z-index:2;
  background:linear-gradient(90deg, #0F2A5C 0%, #0F2A5C 4%,
             rgba(15,42,92,.55) 12%, rgba(15,42,92,0) 26%); }

/* 🚩 LA COUPURE DU HAUT — trouvée le 30/08 en traçant le profil de pixels.
   `.photo` commence à top:46px : au-dessus c'est la page, en dessous c'est
   l'épaule. À x=1900 du rendu, le rouge passait de 15 à 114 EN UN PIXEL — une
   épaule tranchée à l'horizontale sur une bande marine. Ça ne lit pas « photo
   cadrée », ça lit « rectangle collé ».
   ⛔ CE QU'IL NE FALLAIT PAS FAIRE : mettre la photo en pleine hauteur. Essayé,
   rendu, regardé : le téléphone grossit de 3,5 %, son sommet et sa droite
   sortent du cadre et il chevauche le coin blanc. Les 46 px avaient une raison.
   ✅ On dissout au lieu de recadrer. Et c'est EXACT, pas approximatif : le fond
   de la photo vaut #0F2A5C depuis `remplacer_mur()`, la page aussi. Ce voile
   n'est donc pas une teinte « presque » juste posée sur une autre — c'est la
   même couleur qui se retire. 46/150 = 30,7 % : le dégradé ne commence
   qu'après la bande, puis 104 px pour disparaître. */
.haut-fondu { position:absolute; right:0; top:0; width:620px; height:150px; z-index:3;
  background:linear-gradient(180deg, #0F2A5C 0%, #0F2A5C 30.7%,
             rgba(15,42,92,.55) 62%, rgba(15,42,92,0) 100%); }

/* 424 px de colonne, et les deux lignes y sont MESURÉES à 84 px dans notre

.acc { position:absolute; left:76px; top:492px; width:424px; z-index:5;

/* 🚩 `display:block` — ce n’est PAS cosmétique. Dans un `.acc`, un `<span>` est

   du titre en lisant ce `display:block` ; un span resté en ligne y compterait
   pour une ligne de plus et ferait refuser un visuel juste. Ici les deux disent
   la même chose — l’œil et la machine voient deux lignes. */
.acc span { display:block; color:#F6BC1C; }

   📌 On n’a pas corrigé à l’œil. Un programme a rendu sept formulations, lu la

.dit { position:absolute; left:76px; top:782px; width:400px; z-index:5;
