     SENTIMENT : LA PROXIMITÉ

     Fait à la demande du patron : « je ne joue plus dans la cour des entreprises
     comoriennes, je veux m’imposer comme numéro un. Les petits détails comptent.
     Fais-moi un flyer d’exemple. »
     Norme complète : ../../dossier/EXIGENCE.md — contrôle : `python3 exigence.py`.

     🎯 CE QU’IL DÉMONTRE : UN SEUL UNIVERS, DEUX MOMENTS.
     Le titre porte l’émotion, le corps porte le produit — sans changer de
     lumière, de typographie, ni de calme. C’est la synthèse retenue contre le
     conseil « choisis un ton » : le marché comorien IMPOSE d’expliquer (une
     grande partie des gens n’a jamais payé en ligne), mais expliquer n’autorise
     pas à baisser le niveau. L’explication monte au niveau de l’émotion, jamais
     l’inverse.

     ✅ POURQUOI CETTE IMAGE ET PAS UNE PLAGE
     Une vedette minuscule sur une mer immense. Elle ne montre pas un produit :
     elle montre la distance entre deux personnes. C’est ce que le titre dit.
     Le titre ne fait que nommer ce que l’image montre déjà — règle du 26/08.
     Les ombres sont poussées vers notre marine (`traiter.etalonner`) : cette
     mer devient NOTRE mer, sans qu’on sache dire pourquoi.

/* 🚩 02/09/2026 — LA PHOTO PASSE DE FOND À BANDEAU. Elle couvrait toute la
   page et le texte flottait dessus dans un dégradé. C'était joli et ce n'était
   pas notre grammaire : `famille.js` donnait 3/5, et surtout ce visuel n'avait
   pas la même silhouette que ses voisins. Le patron : « tous les flyers hors
   bulletin doivent se ressembler. »
   📌 La photo parle, PUIS les mots parlent. Un texte posé sur une image demande
   à l'image de se taire pour être lisible — d'où le dégradé qui l'écrasait. */
.photo { position:absolute; top:0; left:0; width:1080px; height:700px;
  overflow:hidden; }
/* ⚠️ 14 %, ET LES TROIS VALEURS ONT ÉTÉ RENDUES POUR CHOISIR. En passant de
   fond de page à bandeau, le cadrage d'origine (12 %) a perdu la vedette —
   c'est-à-dire le SUJET. À 8 % elle passe derrière le coin blanc, à 20 % elle
   frôle le bord haut. 📌 Changer la hauteur d'une photo change son sujet : un
   recadrage n'est jamais une opération neutre, il faut le REGARDER. */
.photo img { width:100%; height:100%; object-fit:cover; object-position:50% 14%; display:block; }

/* Le marine monte DANS la mer. SIX arrêts et non quatre — sur remarque
   extérieure : « on pourrait affiner la transition pour qu’elle soit plus
   naturelle ». Juste. Un dégradé à quatre arrêts fait une marche perceptible
   vers 55 % ; à six, la mer se referme sans qu’on voie où.
   ⚠️ Il reste TOTAL à 69 %, avant le titre : un titre posé sur un dégradé en
   cours de route perd son contraste ligne après ligne. */
