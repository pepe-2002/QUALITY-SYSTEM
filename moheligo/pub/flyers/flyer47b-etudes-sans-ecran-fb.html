     ⛔ **UNE APPARTENANCE NE SE DÉDUIT JAMAIS DU CONTEXTE. Elle se dit, ou elle

     appartenance. Un crédit, pas une biographie. Ce qu’il fait dans la vie ne
     regarde pas une page Facebook, et un visage peut être le visage d’une idée
     sans être un cas nommé.

     📱 L’ÉCRAN DE L’APPLI, demandé le 01/09 : « mets aussi un écran de l’appli
     pour faire original, mais toujours l’émotion. » C’est exactement le § 1 de
     la norme — un seul univers, deux moments. Le portrait ouvre (l’émotion),
     la carte de réservation livre (le produit), sans changer de lumière ni de
     calme. On n’a pris QUE le bloc « Réserver une traversée » : un écran entier
     à cette taille ne se lit pas, et ce qui ne se lit pas ne prouve rien.
     ⚠️ La date affichée est calculée à « aujourd’hui + 7 jours » et se
     REGÉNÈRE avant chaque publication (`demo/ecrans/capture.js`). Un post reste
     sur la page pour toujours : une date passée y ferait croire que le service
     est mort (norme § 7.3).

     ⚠️ CE QUI RESTE À RÉGLER AVANT PUBLICATION — et ça ne dépend pas de moi :

     écrit. Pour les photos Young Leader il y avait au moins une association et
     un contrat derrière ; ici c’est un particulier, il n’y a rien. Un message
