<!-- « TU N’ES QU’À UNE TRAVERSÉE. » — 02/09/2026. Sans date.

     SENTIMENT : LA PROXIMITÉ

     🏆 CE VISUEL EST LE NOUVEAU GABARIT DE RÉFÉRENCE. Le patron : « nos flyers
     hors bulletin doivent contenir une photo. Sois très original et clair mais
     très simple, et directement reconnaissable SANS LOGO. Ça doit être du
     10/10 : on doit comprendre que MoheliGo n’est pas une petite boîte mais un
     grand parmi les grands du monde. »

     ⛔ LA QUESTION QU’IL POSE EST LA SEULE QUI COMPTE, ET ON NE SE L’ÉTAIT
     JAMAIS POSÉE : **si on cache le logo, à quoi reconnaît-on que c’est nous ?**
     Jusqu’ici la réponse était « au coin blanc » — c’est-à-dire au logo. Donc :
     à rien. Un visuel qui a besoin de sa signature pour être identifié n’a pas
     d’identité, il a une étiquette.

     ✅ LA RÉPONSE : **LA VAGUE D’OR.** Elle était en bas de page, 74 px, en
     décoration. Elle devient ici la COUTURE entre la mer et les mots — la ligne
     qui sépare le monde du texte. C’est le seul élément qu’on ne partage avec
     personne : la couleur est copiable, une police s’achète, mais cette
     découpe-là est à nous.
     📌 **UNE MARQUE SE RECONNAÎT À UNE FORME QUI FAIT UN TRAVAIL, PAS À UNE
     FORME QUI DÉCORE.** Coca-Cola ne se reconnaît pas au rouge — il se reconnaît
     au ruban, qui structure la boîte. Apple ne se reconnaît pas au gris, mais au
     vide autour de l’objet. Notre vague ne bordait rien ; maintenant elle tient
     la page en deux.
     ⚠️ C’est un changement de charte, et il est réversible d’une ligne. Si le
     patron préfère la vague en bas, on la remet — mais alors il faut trouver
     autre chose pour répondre à « reconnaissable sans logo ».

     📷 LA PHOTO EST À 720 px ET LE VISUEL EN FAIT 2160. Elle est donc agrandie
     trois fois, ce qui est normalement rédhibitoire. Elle passe pour une raison
     précise, mesurée dans `../photos/preparer-photo.py` : **c’est la plus FLOUE
     des sept, et c’est exactement pour ça.** Mer, ciel et horizon sont des
     dégradés — il n’y a presque rien à inventer entre deux pixels. Les six
     autres photos ont du feuillage ou du sable en gros plan et deviennent de la
     bouillie au même agrandissement.
     ⚠️ Cette photo est une copie compressée (renvoi WhatsApp). **L’original du
     téléphone rendrait ce raisonnement inutile** — il est demandé.

     🔒 Aucune personne identifiable : plage vide, deux embarcations à l’horizon.
     Photo fournie par le patron le 02/09/2026 (voir `PHOTOS-PATRON.md`).

     Rendu : node render.js flyer48-traversee-fb.html flyer-traversee-facebook.png 1080 1350 2 -->

/* LA PHOTO — plein cadre sur le haut. Elle n’est pas un fond : c’est l’objet

/* ⚠️ 660 px, ET C'EST UN RECADRAGE, PAS UN CHOIX DE PLACE. À 742 px la photo
   montrait 45 % de sable nu : un grand aplat beige où il ne se passe rien, et
   sur lequel la vague d'or ne se lisait plus (or clair sur sable clair). En
   remontant à 660 on garde le ciel, l'horizon, les îlots et la ligne d'écume,
   et la vague retombe sur le sable MOUILLÉ, qui est sombre.
   📌 Le sujet d'une photo de plage n'est pas la plage : c'est la ligne où la
   mer s'arrête. Tout ce qu'on ajoute en dessous est du vide qui dilue. */
.mer { position:absolute; left:0; top:0; width:1080px; height:660px; z-index:1;
  overflow:hidden; }
.mer img { width:100%; height:100%; object-fit:cover; display:block; }

/* La photo s’assombrit très légèrement vers le bas, pour que la vague d’or ne
   soit pas posée sur du sable clair — l’or sur le sable ne se lit pas. */
.ombre { position:absolute; left:0; top:430px; width:1080px; height:230px; z-index:2;
  background:linear-gradient(180deg, rgba(15,42,92,0) 0%, rgba(15,42,92,.42) 100%); }

/* 🏆 LA COUTURE — l’élément qui fait qu’on nous reconnaît sans lire le nom.
   Elle est haute (86 px contre 74 en pied de page) parce qu’ici elle porte la
   page au lieu de la border. Un seul tracé, comme le veut la charte. */

/* 💎 LA TYPOGRAPHIE DU TITRE CHANGE — 02/09/2026, sur une relecture extérieure
   transmise par le patron : « le style reste très digital / Instagram ; ça n'a
   pas le raffinement d'une marque type Air France ou d'une compagnie maritime
   haut de gamme — polices plus élégantes, compositions plus aérées. »
   ⛔ ELLE AVAIT RAISON, ET LA CAUSE ÉTAIT PRÉCISE : Archivo 900 est une
   grotesque très grasse, avec un interlettrage NÉGATIF (-3,4 px) pour serrer
   les mots. C'est le geste des réseaux sociaux — on compresse pour occuper. Le
   luxe fait l'inverse : il ESPACE. Une marque qui n'a rien à prouver n'a pas
   besoin de remplir la ligne.
   ✅ Cormorant Garamond 400, en capitales, +5 px d'interlettrage. On garde la
   règle des capitales (Coca-Cola § 2.35, adoptée ce matin) et on change la
   voix qui les prononce.
   📌 **LE PREMIUM SE JOUE PLUS SOUVENT SUR L'ESPACE ENTRE LES LETTRES QUE SUR
   LE DESSIN DES LETTRES.**
   ⚠️ Et le dégradé doré à quatre arrêts + ombre portée est parti. Sur une
   grotesque grasse il faisait un effet ; sous une serif délicate il faisait un
   déguisement. Or de la charte, plat. **Le luxe se retire, il n'ajoute pas.** */
.acc { position:absolute; left:76px; top:770px; width:928px; z-index:5;
  font-family:'Cormorant',serif; font-weight:400; font-size:88px; line-height:1.1;

.dit { position:absolute; left:76px; top:1008px; width:640px; z-index:5;

/* 💎 L'APPEL À L'ACTION S'ACCORDE AU TITRE — 02/09/2026. Une fois le titre

   ✅ La pastille dorée reste — c'est elle qui dit « ceci se clique » — mais son
