     📌 **UN CHEMIN DE SECOURS QUI PARTAGE UNE DÉPENDANCE AVEC LE CHEMIN NORMAL

     a cru la question réglée. Aujourd’hui les deux tombent ensemble, et le seul
     chemin qui reste debout est celui qu’on n’avait pas prévu : la conversation.
     🔴 À DEMANDER AU PATRON (poste C, manuel § 12.2 ter — commercial et
     encaissement sont à lui) : Holo passe-t-il encore par kartaPay ? Et

     ✅ CE QU’ON DIT, ET DANS QUEL ORDRE. Trois slots, une seule information.
