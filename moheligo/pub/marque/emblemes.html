     ⚖️ CE FICHIER NE DÉCIDE RIEN. Le logo est son identité, pas ma matière
     (manuel § 12.2 ter, règle A / B / C : dans le doute, je propose). Il
     fabrique les options et les soumet au MÊME test que l'emblème actuel :
     réduit à 32 px, combien de nuances restent ? L'actuel en garde 414 et
     devient une tache — mesuré le matin même par `../flyers/mesure-marque.py`.

     Les quatre cases, dans l'ordre :
       0. l'emblème ACTUEL, pour comparer honnêtement

       2. MG — exactement ce qu'il demande, dessiné sérieusement et pas en
          épouvantail : une idée ne se juge qu'à sa meilleure version

body { width:2048px; height:512px; display:flex; background:#fff; }
.case { width:512px; height:512px; display:flex; align-items:center; justify-content:center; }

<!-- 1. LA PROUE — trois formes, pas trente. L'arc dit l'île et l'horizon, la

     32 px, donc rien d'autre n'a le droit d'être là. -->
<div class="case">
  <svg viewBox="0 0 100 100">
    <path d="M 14 64 A 38 38 0 1 1 86 64" fill="none" stroke="#0F2A5C"

    <path d="M 10 82 Q 30 72 50 82 T 90 82" fill="none" stroke="#F6BC1C"

<!-- 2. MG — la demande du patron, dessinée pour de vrai : Archivo 900, le G en
     or, la vague en socle pour qu'il reste quelque chose de maritime. C'est la

<div class="case">

    <rect x="6" y="6" width="88" height="88" rx="22" fill="#0F2A5C"/>

    <path d="M 20 76 Q 35 68 50 76 T 80 76" fill="none" stroke="#F6BC1C"
